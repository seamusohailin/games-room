<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Over the Bridge</title>
<script src="../../results.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Over the Bridge. An X-ray lightbox: night-blue film, bone white, glowing cyan, coral muscle. Green, amber and red always come with words or icons. */
:root{
  --paper:#EEF3F8; --ink:#1B2440; --muted:#5A6378; --line:#D3DDE9;
  --film:#0E1B33; --film-2:#16284A; --bone:#F4ECDD; --glow:#7FE3F0; --glow-d:#2A9DB0;
  --coral:#EE7A67; --coral-d:#B94B3A; --ok:#2E9E66; --ok-bg:#E2F4EA; --amber:#E2A12F; --amber-bg:#FFF3D6; --ouch:#D2463D; --ouch-bg:#FBE6E3;
  --brand:#2B4C9B; --brand-d:#1C3473;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --body:"Andika","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:1.15rem;line-height:1.45;background:var(--paper);
  background-image:radial-gradient(circle at 8% 8%,rgba(127,227,240,.25) 0 140px,transparent 141px),radial-gradient(circle at 96% 30%,rgba(238,122,103,.14) 0 170px,transparent 171px),radial-gradient(circle at 30% 98%,rgba(43,76,155,.10) 0 200px,transparent 201px);background-attachment:fixed}
#app{max-width:1120px;margin:0 auto;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(86px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0 0 .55em}
.note{font-size:.98rem;color:var(--muted)}
.center{text-align:center;justify-content:center}

.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:4px 0 10px;margin-bottom:12px;border-bottom:4px solid transparent;border-image:linear-gradient(90deg,#E8553F,#F1A43A,#F4D23C,#4FB477,#3A9AD9,#6C5BC7) 1}
.brand{display:flex;gap:10px;align-items:center}
.bface svg{width:50px;height:50px;display:block}
.brand h1{font-size:clamp(1.5rem,4.2vw,2.2rem);color:var(--brand)}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:1rem}
.chip-t{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;min-height:44px;display:inline-flex;align-items:center}
.chip-t[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}

.panel{background:#fff;border:2px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);padding:14px 16px 20px}
.head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.head h2{font-size:clamp(1.3rem,3.8vw,1.85rem);color:var(--brand)}
.back{background:#fff;border:2px solid var(--brand);color:var(--brand);border-radius:999px;padding:6px 16px;min-height:46px;font-size:1rem;font-weight:700}
.dots{display:flex;gap:7px;margin-left:auto}
.dots i{width:16px;height:16px;border-radius:50%;background:#E8EEF5;border:2px solid var(--line)}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.dots i.now{background:var(--glow);border-color:var(--glow-d)}

.bubble{display:flex;gap:10px;align-items:center;min-height:58px}
.bubble .face{flex:none;width:60px;height:60px}
.bubble .face svg{width:60px;height:60px;display:block}
.bubble p{flex:1;margin:0;font-size:1.28rem;line-height:1.32;font-weight:700;background:#EAF7FA;border-radius:16px;padding:9px 15px;border:2px solid #BFE6EE}
.bubble p b{color:var(--brand)}
.qbtn{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid #B98419;background:var(--amber-bg);font-weight:700;font-size:1.4rem}
.qbtn[disabled]{opacity:.3;cursor:default}
.clue{margin:8px 0 0 70px;background:var(--amber-bg);border-radius:12px;padding:8px 14px;font-size:1.08rem;border:2px solid #EFD27F}

.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:14px}
.stage.one{grid-template-columns:1fr}
@media (max-width:860px){.stage{grid-template-columns:1fr}}
.pic{position:relative;display:grid;gap:10px;justify-items:center;min-width:0}
.side{min-width:0;display:grid;gap:12px;align-content:start}
.film{width:100%;background:radial-gradient(ellipse at 50% 35%,var(--film-2),var(--film) 75%);border-radius:18px;border:3px solid #263C66;box-shadow:inset 0 0 40px rgba(127,227,240,.12),0 5px 0 #0A1426;padding:8px;position:relative}
.film svg{width:100%;height:auto;display:block}
.film .tag{position:absolute;top:8px;left:12px;font-family:var(--display);font-size:.9rem;color:var(--glow);letter-spacing:.08em;opacity:.8}

.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:94%;width:max-content;padding:10px 18px;border-radius:16px;font-weight:700;font-size:1.15rem;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.18);z-index:20;pointer-events:none}
.toast.yes{background:var(--ok-bg);color:#1D6B44;border:3px solid var(--ok)}
.toast.hmm{background:var(--amber-bg);color:#6d4410;border:3px solid var(--amber)}
.toast.ouch{background:var(--ouch-bg);color:#8E2A23;border:3px solid var(--ouch)}

.btn{font-family:var(--body);font-weight:700;font-size:1.15rem;background:var(--brand);color:#fff;border:0;border-radius:999px;padding:.45em 1.35em;min-height:54px;box-shadow:0 4px 0 var(--brand-d);transition:transform .08s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.big{font-size:1.6rem;min-width:200px;min-height:80px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn.red{background:#E0332B;box-shadow:0 4px 0 #8F1D17}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.next-row{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
textarea,input[type=text],input[type=number]{border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:1.15rem;background:#FCFDFF}
textarea{width:100%;line-height:1.5;resize:vertical}
input[type=number]{width:120px;min-height:54px;font-size:1.4rem;font-weight:700;text-align:center}

/* home */
.intro{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:20px;align-items:start}
@media (max-width:760px){.intro{grid-template-columns:1fr}}
.intro h2{font-size:clamp(1.6rem,4.5vw,2.3rem);color:var(--brand);margin-bottom:8px}
.casehead{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-family:var(--display);font-size:1.3rem;color:var(--brand)}
.casehead small{font-family:var(--body);font-size:.95rem;color:var(--muted)}
.stops{display:grid;gap:10px;margin:6px 0}
.stop{display:flex;gap:14px;align-items:center;text-align:left;background:#fff;border:3px solid var(--c);border-radius:18px;padding:10px 14px;min-height:64px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 45%,white)}
.stop .num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.3rem}
.stop .st{display:grid}.stop small{color:var(--muted);font-size:.98rem}
.stop.done{background:color-mix(in srgb,var(--c) 10%,white)}
.stop.locked{opacity:.45;cursor:default;box-shadow:none}
.stop.vid{border-style:dashed}
.big-tick{width:92px;height:92px;border-radius:50%;background:var(--c);color:#fff;font-size:3rem;display:grid;place-items:center;margin:10px auto}

/* chips and targets */
.chip{user-select:none;-webkit-user-select:none;touch-action:none;background:#fff;border:3px solid var(--brand);border-radius:14px;padding:8px 14px;font-weight:700;min-height:52px;display:inline-flex;gap:8px;align-items:center;box-shadow:0 3px 0 #AFC0DE}
.chip.sel{background:#FFF6D8;border-color:#C69212}
.chip.used{opacity:.25;pointer-events:none}
.chip.lifted{opacity:.35}
.chip.card{flex-direction:column;text-align:center;padding:8px;width:150px;font-size:1rem;line-height:1.2}
.chip.card svg{width:96px;height:72px}
.dragghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-60%) rotate(-3deg);opacity:.95;box-shadow:0 10px 24px rgba(0,0,0,.25)!important}
.target.glow{filter:drop-shadow(0 0 6px #F2C14E)}
.target.over{filter:drop-shadow(0 0 9px #7FE3F0)}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* spine labelling */
.spinewrap{position:relative;width:100%;max-width:440px;margin:0 auto}
.lslot{position:absolute;left:52%;width:46%;transform:translateY(-50%);min-height:54px;border:3px dashed var(--glow);border-radius:14px;background:rgba(127,227,240,.10);display:flex;align-items:center;justify-content:center;color:var(--glow);font-weight:700;font-size:.95rem;padding:4px;text-align:center}
.lslot.full{border-style:solid;background:#fff;color:var(--ink);border-color:var(--ok)}
.lslot .lab{display:grid;line-height:1.15}
.lslot .lab small{font-weight:400;color:var(--muted);font-size:.85rem}
.ztap{position:absolute;left:4%;width:44%;transform:translateY(-50%);border-radius:16px;border:3px dashed transparent;background:transparent}
.ztap:hover,.ztap:focus-visible{border-color:var(--glow)}

/* bins and slots */
.bins{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bin{border:3px dashed;border-radius:16px;min-height:130px;padding:8px;display:grid;align-content:start;gap:8px}
.bin.go{background:var(--ok-bg);border-color:#8FCCAA}
.bin.stopb{background:var(--ouch-bg);border-color:#E6A7A1}
.bin-h{display:flex;gap:6px;align-items:center;justify-content:center;font-weight:700;font-size:1.08rem;text-align:center}
.bin-h svg{width:34px;height:34px}
.bin-body{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bin-body .chip.card{width:120px}
.bin-body .chip.card svg{width:64px;height:48px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;width:100%}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;background:#F2F6FB;border:3px dashed #A9BCD8;border-radius:14px;padding:6px;min-height:170px}
.slot-n{font-family:var(--display);font-weight:600;color:var(--brand);font-size:1.1rem}
.slot.full{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}

/* choices */
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 14px;min-height:56px;text-align:left;font-weight:700;display:flex;gap:10px;align-items:center}
.choice svg{flex:none;width:90px;height:70px}
.choice.pictop{flex-direction:column;text-align:center}
.choice.pictop svg{width:100%;max-width:220px;height:auto}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.wrong{border-color:#E3B6B1;background:#FDF3F2;opacity:.75}
.choice.on{border-color:var(--brand);background:#EAF0FB}

/* sliders */
.sliders{display:grid;gap:12px}
.sl{display:grid;grid-template-columns:62px 1fr;gap:4px 10px;align-items:center;background:#F4F8FC;border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.sl>span{grid-row:span 2}
.sl svg{width:58px;height:58px;display:block}
.sl label{font-weight:700}
.sl input{width:100%}
input[type=range]{-webkit-appearance:none;appearance:none;height:34px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:7px;background:linear-gradient(90deg,#CFE1F2,#7FE3F0)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;border-radius:50%;background:#fff;border:4px solid var(--brand);margin-top:-11px;box-shadow:0 2px 0 var(--brand-d)}
input[type=range]::-moz-range-track{height:14px;border-radius:7px;background:linear-gradient(90deg,#CFE1F2,#7FE3F0)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid var(--brand)}
.meter{display:flex;gap:10px;align-items:center;border-radius:14px;padding:8px 12px;font-weight:700;border:3px solid}
.meter svg{flex:none;width:44px;height:44px}
.meter.red{background:var(--ouch-bg);border-color:var(--ouch);color:#8E2A23}
.meter.amber{background:var(--amber-bg);border-color:var(--amber);color:#6d4410}
.meter.green{background:var(--ok-bg);border-color:var(--ok);color:#1D6B44}

/* stretch zones */
.zones{display:grid;grid-template-columns:55fr 25fr 20fr;border-radius:12px;overflow:hidden;border:2px solid var(--line);font-weight:700;font-size:.95rem;text-align:center}
.zones div{padding:6px 4px}
.zones .z1{background:#EEF2F7;color:var(--muted)}
.zones .z2{background:var(--ok-bg);color:#1D6B44;background-image:repeating-linear-gradient(45deg,transparent 0 8px,rgba(46,158,102,.12) 8px 12px)}
.zones .z3{background:var(--ouch-bg);color:#8E2A23;background-image:repeating-linear-gradient(-45deg,transparent 0 5px,rgba(210,70,61,.15) 5px 9px)}
.breath{width:86px;height:86px;border-radius:50%;margin:4px auto;display:grid;place-items:center;font-weight:700;font-size:.95rem;color:#1D6B44;background:var(--ok-bg);border:4px solid var(--ok)}
.breath.go{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.85)}50%{transform:scale(1.12)}}
.holdbar{height:16px;border-radius:8px;background:#E8EEF5;overflow:hidden}
.holdbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}

/* stack */
.joint{cursor:pointer}
.counter{font-family:var(--display);font-size:1.3rem;color:var(--brand);text-align:center}

/* won, rules, finish */
.won{display:flex;gap:12px;align-items:flex-start;background:var(--ok-bg);border:3px solid var(--ok);border-radius:16px;padding:12px 14px;font-size:1.12rem}
.won .tick{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.won .tick svg{width:26px;height:26px}
.won p{margin:0 0 .4em}
.teach{background:#F3F7FC;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:1.12rem}
.teach b{color:var(--brand)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.pair figure{margin:0;display:grid;gap:6px;text-align:center;font-weight:700}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rule{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:700;min-height:74px}
.rule svg{flex:none;width:52px;height:52px}
.rule.on{border-color:var(--brand);background:#EAF0FB;box-shadow:0 0 0 3px #BFD0F0}
.promise{background:#F6FBFF;border:3px solid var(--glow-d);border-radius:18px;padding:12px 16px}
.promise h3{color:var(--brand);margin-bottom:6px}
.promise ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.coach{display:flex;gap:12px;align-items:center;background:#FFF8E1;border:3px solid #E8C14C;border-radius:16px;padding:10px 14px;font-weight:700}
.coach svg{flex:none;width:56px;height:56px}
.vidcard{display:grid;gap:10px;justify-items:center;text-align:center;background:var(--film);color:#fff;border-radius:20px;padding:18px;border:3px solid #263C66}
.vidcard h3{color:var(--glow);font-size:1.5rem}
.vidcard p{margin:0;max-width:560px}

/* Over the Bridge additions */
.track{position:relative;height:240px;border-radius:18px;background:linear-gradient(#16284A,#0E1B33);border:3px solid #263C66;overflow:hidden}
.nowline{position:absolute;left:0;right:0;bottom:0;height:100px;background:rgba(127,227,240,.10);border-top:3px dashed #7FE3F0}
.nowline span{position:absolute;right:10px;top:4px;color:var(--glow);font-size:.85rem;font-weight:700;letter-spacing:.06em}
.tile{position:absolute;left:50%;top:0;transform:translateX(-50%);width:160px;height:94px;border-radius:14px;background:#F4ECDD;color:#1B2440;display:grid;place-items:center;font-weight:700;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.3);overflow:hidden;font-size:.95rem;line-height:1.1;padding:3px}
.tile svg{width:100%;height:60px;display:block;border-radius:8px}
.tile.q{font-family:var(--display);font-size:1.15rem;color:var(--brand)}
.tile.q b{font-size:2.2rem;line-height:1}
.tile.wait{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(242,193,78,.65)}}
.pads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pad{background:#fff;border:3px solid var(--line);border-radius:14px;min-height:64px;font-weight:700;display:grid;justify-items:center;align-content:center;gap:3px;padding:6px;font-size:1rem;line-height:1.15;text-align:center}
.pad svg{width:100%;max-width:120px;height:auto;border-radius:8px;display:block}
.pad.glow{border-color:#C69212;background:#FFF6D8;box-shadow:0 0 0 4px #F2C14E}
.pad.right{border-color:var(--ok);background:var(--ok-bg)}
.tempo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tempo .choice{flex-direction:column;text-align:center;justify-content:center}
.checks{display:grid;gap:8px}
.check{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px 12px;min-height:64px;font-weight:700}
.check .box{flex:none;width:34px;height:34px;border-radius:8px;border:3px solid var(--brand);display:grid;place-items:center;color:#fff;font-size:1.3rem}
.check[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg)}
.check[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok)}
.check .th svg,.rung .th svg{width:84px;height:63px;display:block;border-radius:8px}
.check .th,.rung .th{flex:none}
.ladder{display:flex;flex-direction:column-reverse;gap:8px}
.rung{display:flex;gap:10px;align-items:center;border:3px solid var(--line);border-radius:14px;padding:6px 10px;background:#fff;font-weight:700}
.rung small{display:block;font-weight:400;color:var(--muted);font-size:.92rem}
.rung.done{background:var(--ok-bg);border-color:#8FCCAA}
.rung.today{border-color:#C69212;background:#FFF6D8;box-shadow:0 0 0 3px #F2C14E}
.rung .mark{margin-left:auto;flex:none;font-size:.9rem;border-radius:999px;padding:2px 10px;background:#fff;border:2px solid currentColor}
.bin.piece{background:#F2F6FB;border-color:#A9BCD8}
.bins.three{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.safety{background:#FFF8E1;border:3px solid #E8C14C;border-radius:16px;padding:10px 14px}
.safety h3{color:#6d4410;margin-bottom:4px}
.safety ul{margin:4px 0 0;padding-left:1.2em;display:grid;gap:4px}
.rungcard{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px;align-items:center}
@media (max-width:700px){.rungcard{grid-template-columns:1fr}}
.cues{display:grid;gap:8px}
.cue{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px 12px;min-height:60px;font-weight:700;text-align:left}
.cue svg{flex:none;width:48px;height:48px}
.cue.on{border-color:var(--brand);background:#EAF0FB;box-shadow:0 0 0 3px #BFD0F0}
.ctrl{display:grid;gap:10px}
.armtog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.armtog button{min-height:54px;border-radius:14px;border:3px solid var(--line);background:#fff;font-weight:700}
.armtog button[aria-pressed="true"]{border-color:var(--brand);background:#EAF0FB}

<body>
<main id="app" aria-live="polite"></main>
<script>
/* ---------- drawings ---------- */
const ART=(()=>{
  const S=(vb,inner,label)=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label||''}">${inner}</svg>`;
  const T=(x,y,txt,o)=>{o=o||{};return `<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" font-family="Andika,sans-serif" font-weight="700" font-size="${o.s||16}" fill="${o.f||'#F4ECDD'}">${txt}</text>`;};

  // Bonnie, a friendly X-ray skeleton (from The Rainbow Bridge)
  const guide=S('0 0 64 64',`<circle cx="32" cy="32" r="31" fill="#16284A"/><circle cx="32" cy="32" r="29" fill="none" stroke="#7FE3F0" stroke-width="2" opacity=".7"/>
<path d="M14 30c0-11 8-19 18-19s18 8 18 19c0 6-3 9-6 11v6c0 2-2 3-4 3H24c-2 0-4-1-4-3v-6c-3-2-6-5-6-11z" fill="#F4ECDD"/>
<ellipse cx="24.5" cy="30" rx="5.5" ry="6.5" fill="#16284A"/><ellipse cx="39.5" cy="30" rx="5.5" ry="6.5" fill="#16284A"/>
<circle cx="26" cy="28" r="2" fill="#7FE3F0"/><circle cx="41" cy="28" r="2" fill="#7FE3F0"/>
<path d="M32 35l-2.6 4h5.2z" fill="#16284A"/><path d="M24 43q8 5 16 0" stroke="#16284A" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M28 43.8v3M32 44.6v3M36 43.8v3" stroke="#16284A" stroke-width="1.6"/>`,'Bonnie the X-ray skeleton');

  // ---- the spine, side view (from The Rainbow Bridge) ----
  function spineGeom(){
    const vs=[];
    const xAt=y=>{
      if(y<135)return 150-12*Math.sin(Math.PI*(y-35)/100);
      if(y<335)return 150+20*Math.sin(Math.PI*(y-135)/200);
      return 150-16*Math.sin(Math.PI*(y-335)/100);};
    let y=42;
    for(let i=0;i<7;i++){vs.push({r:'neck',x:xAt(y+6),y,w:34,hh:11});y+=13.5;}
    y+=2;for(let i=0;i<12;i++){vs.push({r:'upper',x:xAt(y+7),y,w:42,hh:13});y+=16.6;}
    y+=2;for(let i=0;i<5;i++){vs.push({r:'lower',x:xAt(y+8),y,w:56,hh:16});y+=19.5;}
    return {vs,xAt,end:y};
  }
  function spine(o){o=o||{};const g=spineGeom();let out='';
    out+=`<path d="M150 6 a34 34 0 1 1 -1 0" fill="none" stroke="#7FE3F0" stroke-width="2" opacity=".25"/>`;
    out+=`<path d="M90 120 C70 220 70 330 92 440 M222 120 C238 220 236 330 214 440" fill="none" stroke="#7FE3F0" stroke-width="2" opacity=".18"/>`;
    const lit=r=>(o.hi||[]).includes(r);
    g.vs.forEach(v=>{
      if(v.r==='upper')out+=`<path d="M${v.x-8} ${v.y+7} q-46 6 -64 30" fill="none" stroke="#CFC6B6" stroke-width="3" stroke-linecap="round" opacity=".85"/>`;
      out+=`<rect x="${v.x-v.w/2}" y="${v.y}" width="${v.w}" height="${v.hh}" rx="4" fill="${lit(v.r)?'#5CD08F':'#F4ECDD'}"/>`;
      out+=`<path d="M${v.x+v.w/2-2} ${v.y+v.hh/2} l12 4" stroke="${lit(v.r)?'#5CD08F':'#F4ECDD'}" stroke-width="5" stroke-linecap="round"/>`;
    });
    const e=g.end+4,sx=g.xAt(e);
    out+=`<path d="M${sx-26} ${e} L${sx+26} ${e} L${sx+6} ${e+50} L${sx-2} ${e+50}Z" fill="#E6DCCB"/>`;
    out+=`<path d="M${sx+2} ${e+52} q4 10 -2 18" stroke="#E6DCCB" stroke-width="5" fill="none" stroke-linecap="round"/>`;
    return S('0 0 440 540',out,'X-ray of the spine from the side');
  }

  // ---- small icons ----
  const ic={
    go:S('0 0 40 40',`<circle cx="20" cy="20" r="18" fill="#2E9E66"/><path d="M11 21 l6 6 12 -13" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`),
    play:S('0 0 40 40',`<circle cx="20" cy="20" r="18" fill="#E0332B"/><path d="M16 12 L29 20 L16 28Z" fill="#fff"/>`),
    breathe:S('0 0 56 56',`<circle cx="28" cy="28" r="26" fill="#E2F4EA"/><path d="M14 22 q8 -6 16 0 t14 0 M14 30 q8 -6 16 0 t14 0 M18 38 q6 -5 12 0 t10 0" stroke="#2E9E66" stroke-width="3.2" fill="none" stroke-linecap="round"/>`),
    rainbow:S('0 0 56 56',`<circle cx="28" cy="28" r="26" fill="#FFF8E1"/><path d="M10 40 a18 18 0 0 1 36 0" stroke="#E8553F" stroke-width="4" fill="none"/><path d="M15 40 a13 13 0 0 1 26 0" stroke="#F4D23C" stroke-width="4" fill="none"/><path d="M20 40 a8 8 0 0 1 16 0" stroke="#3A9AD9" stroke-width="4" fill="none"/>`),
    ears:S('0 0 56 56',`<circle cx="28" cy="28" r="26" fill="#E8F1FB"/><circle cx="28" cy="32" r="7" fill="#2B4C9B"/><path d="M28 39 v12 M20 30 L19 8 M36 30 L37 8" stroke="#2B4C9B" stroke-width="5" stroke-linecap="round"/><path d="M14 20 h-4 M46 20 h-4" stroke="#2A9DB0" stroke-width="3" stroke-linecap="round"/>`),
    whistle:S('0 0 56 56',`<circle cx="28" cy="28" r="26" fill="#FFF3D6"/><path d="M12 26 h20 a10 10 0 1 1 -10 10 h-10z" fill="#B98419"/><circle cx="32" cy="36" r="4" fill="#FFF3D6"/><path d="M36 14 l5 -5 M41 20 l7 -2 M30 12 l1 -6" stroke="#B98419" stroke-width="3" stroke-linecap="round"/>`),
    sensor:S('0 0 56 56',`<circle cx="28" cy="28" r="26" fill="#E2F4EA"/><ellipse cx="28" cy="28" rx="16" ry="9" fill="#16284A" stroke="#7FE3F0" stroke-width="3"/><circle cx="23" cy="28" r="2.4" fill="#7FE3F0"/><circle cx="33" cy="28" r="2.4" fill="#7FE3F0"/><path d="M24 32 q4 2.5 8 0" stroke="#7FE3F0" stroke-width="2" fill="none"/>`)
  };

  // ---- Bonnie's whole body, side view. Points: feet F1/F2, knees K1/K2, hips H, spine bend C, shoulders S, elbow E, hands W, head Hd ----
  const KEYS=['F1','K1','H','K2','F2','S','C','E','W','Hd'];
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const qpt=(p0,c,p1,t)=>[(1-t)*(1-t)*p0[0]+2*(1-t)*t*c[0]+t*t*p1[0],(1-t)*(1-t)*p0[1]+2*(1-t)*t*c[1]+t*t*p1[1]];
  function lerp(a,b,t){const o={};KEYS.forEach(k=>{o[k]=[a[k][0]+(b[k][0]-a[k][0])*t,a[k][1]+(b[k][1]-a[k][1])*t];});
    o.eye=[a.eye[0]+(b.eye[0]-a.eye[0])*t,a.eye[1]+(b.eye[1]-a.eye[1])*t];o.wall=t<.5?a.wall:b.wall;return o;}
  // rough share of body weight in each part, used to place the balance point
  function com(p){const parts=[[p.Hd,.08],[qpt(p.H,p.C,p.S,.5),.50],[mid(p.H,p.K1),.10],[mid(p.H,p.K2),.10],[mid(p.K1,p.F1),.06],[mid(p.K2,p.F2),.06],[mid(p.S,p.E),.055],[mid(p.E,p.W),.045]];
    let x=0,y=0;parts.forEach(([q,w])=>{x+=q[0]*w;y+=q[1]*w;});return [x,y];}
  const f1=n=>n.toFixed(1);
  function body(p,o){o=o||{};const GY=300;let out='';
    const vb=o.vb||[0,0,520,330];
    if(o.bg!==false)out+=`<rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" rx="${o.vb?10:16}" fill="#0E1B33"/>`;
    out+=`<line x1="${vb[0]}" y1="${GY+4}" x2="${vb[0]+vb[2]}" y2="${GY+4}" stroke="#7FE3F0" stroke-width="3" opacity=".5"/>`;
    if(p.wall!=null)out+=`<rect x="${p.wall-14}" y="30" width="14" height="${GY-26}" fill="#2A3E66" stroke="#7FE3F0" stroke-opacity=".45" stroke-width="2"/>`;
    if(o.base)out+=`<rect x="${o.base[0]}" y="${GY-1}" width="${o.base[1]-o.base[0]}" height="10" rx="5" fill="#5CD08F"/>`;
    const ln=(a,b,c,w,op)=>`<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"${op?` stroke-opacity="${op}"`:''}/>`;
    const sp=`M${f1(p.H[0])} ${f1(p.H[1])} Q${f1(p.C[0])} ${f1(p.C[1])} ${f1(p.S[0])} ${f1(p.S[1])}`;
    // soft body
    out+=`<path d="${sp}" stroke="#7FE3F0" stroke-opacity=".16" stroke-width="46" fill="none" stroke-linecap="round"/>`;
    out+=ln(p.H,p.K1,'#7FE3F0',30,.14)+ln(p.K1,p.F1,'#7FE3F0',24,.14)+ln(p.H,p.K2,'#7FE3F0',30,.16)+ln(p.K2,p.F2,'#7FE3F0',24,.16)+ln(p.S,p.E,'#7FE3F0',20,.16)+ln(p.E,p.W,'#7FE3F0',18,.16);
    out+=`<circle cx="${f1(p.Hd[0])}" cy="${f1(p.Hd[1])}" r="24" fill="#7FE3F0" fill-opacity=".16"/>`;
    // far leg, a little dimmer
    out+=ln(p.H,p.K1,'#B9B1A3',9)+ln(p.K1,p.F1,'#B9B1A3',8)+`<circle cx="${f1(p.F1[0])}" cy="${f1(p.F1[1])}" r="5" fill="#B9B1A3"/>`;
    // the spine: lower back bones are bigger
    for(let i=0;i<=14;i++){const t=i/14,q=qpt(p.H,p.C,p.S,t),low=t<0.3;
      out+=`<circle cx="${f1(q[0])}" cy="${f1(q[1])}" r="${low?6.6:5.2}" fill="${o.hinge&&low?'#FF6A5E':'#F4ECDD'}"/>`;}
    out+=`<ellipse cx="${f1(p.H[0])}" cy="${f1(p.H[1])}" rx="13" ry="10" fill="#E6DCCB"/>`;
    out+=ln(p.H,p.K2,'#F4ECDD',10)+ln(p.K2,p.F2,'#F4ECDD',9)+`<circle cx="${f1(p.F2[0])}" cy="${f1(p.F2[1])}" r="5.5" fill="#F4ECDD"/>`;
    out+=ln(p.S,p.Hd,'#F4ECDD',6);
    out+=`<circle cx="${f1(p.Hd[0])}" cy="${f1(p.Hd[1])}" r="15" fill="#F4ECDD"/><circle cx="${f1(p.Hd[0]+p.eye[0])}" cy="${f1(p.Hd[1]+p.eye[1])}" r="3.8" fill="#16284A"/>`;
    out+=ln(p.S,p.E,'#F4ECDD',8)+ln(p.E,p.W,'#F4ECDD',7)+`<circle cx="${f1(p.W[0])}" cy="${f1(p.W[1])}" r="5.5" fill="#F4ECDD"/>`;
    if(o.com){const c=com(p),col=o.comCol||'#F2C14E';
      out+=`<line x1="${f1(c[0])}" y1="${f1(c[1])}" x2="${f1(c[0])}" y2="${GY}" stroke="${col}" stroke-width="3" stroke-dasharray="6 6"/><circle cx="${f1(c[0])}" cy="${f1(c[1])}" r="11" fill="${col}" stroke="#fff" stroke-width="3"/>`;
      if(o.comLabel)out+=T(f1(c[0]+18),f1(c[1]-12),o.comLabel,{s:16,f:col,a:'start'});}
    if(o.tag)out+=T(vb[0]+vb[2]-14,vb[1]+26,o.tag,{s:16,f:'#7FE3F0',a:'end'});
    return S(vb.join(' '),out,o.label||'X-ray of Bonnie');
  }
  // the same drawing, cropped tight around Bonnie, for cards and buttons
  function thumb(p,o){const xs=[],ys=[];KEYS.forEach(k=>{if(k==='C')return;xs.push(p[k][0]);ys.push(p[k][1]);});
    let x0=Math.min(...xs)-34,x1=Math.max(...xs)+34,y0=Math.min(...ys)-30,y1=312;
    if(p.wall!=null){x0=Math.min(x0,p.wall-24);x1=Math.max(x1,p.wall+10);}
    let w=x1-x0,hh=y1-y0;if(w/hh<4/3){const nw=hh*4/3;x0-=(nw-w)/2;w=nw;}else{const nh=w*3/4;y0-=(nh-hh);hh=nh;}
    return body(p,Object.assign({vb:[Math.round(x0),Math.round(y0),Math.round(w),Math.round(hh)]},o||{}));}

  // ---- the poses (Bonnie faces right; a back walkover travels left) ----
  const P=(o)=>Object.assign({wall:null},o);
  const POSE={
    stand:P({F1:[292,300],K1:[292,245],H:[292,188],K2:[300,245],F2:[302,300],C:[296,146],S:[293,104],E:[296,146],W:[300,186],Hd:[298,84],eye:[6,0]}),
    up:P({F1:[300,300],K1:[300,245],H:[300,188],K2:[318,243],F2:[334,298],C:[304,146],S:[300,104],E:[298,64],W:[296,24],Hd:[306,84],eye:[6,0]}),
    leg:P({F1:[300,300],K1:[300,245],H:[300,188],K2:[356,183],F2:[411,177],C:[300,146],S:[294,104],E:[288,64],W:[283,24],Hd:[300,85],eye:[6,0]}),
    reach:P({F1:[300,300],K1:[290,248],H:[268,196],K2:[300,150],F2:[330,104],C:[226,140],S:[188,222],E:[185,262],W:[182,300],Hd:[205,246],eye:[1,5]}),
    push:P({F1:[270,72],K1:[230,104],H:[188,138],K2:[146,104],F2:[106,72],C:[178,180],S:[184,222],E:[183,261],W:[182,300],Hd:[200,240],eye:[3,5]}),
    down:P({F1:[150,80],K1:[140,135],H:[126,190],K2:[110,246],F2:[100,300],C:[168,150],S:[200,224],E:[202,262],W:[205,300],Hd:[214,244],eye:[1,5]}),
    tall:P({F1:[156,298],K1:[146,242],H:[118,198],K2:[104,248],F2:[94,300],C:[114,156],S:[120,114],E:[123,74],W:[126,34],Hd:[126,94],eye:[6,0]}),
    // ladder pictures
    bridge:P({F1:[300,300],K1:[296,246],H:[262,196],K2:[290,246],F2:[294,300],C:[224,138],S:[186,222],E:[184,262],W:[182,300],Hd:[204,246],eye:[1,5]}),
    wall:P({F1:[300,300],K1:[304,246],H:[290,192],K2:[310,246],F2:[312,300],C:[262,140],S:[236,150],E:[214,170],W:[196,186],Hd:[248,168],eye:[0,5],wall:196}),
    lean:P({F1:[296,300],K1:[304,246],H:[302,190],K2:[322,246],F2:[332,300],C:[300,138],S:[272,114],E:[250,84],W:[230,52],Hd:[282,96],eye:[-4,-4]}),
    kneel:P({F1:[340,302],K1:[300,298],H:[296,240],K2:[300,298],F2:[340,302],C:[276,196],S:[262,166],E:[240,140],W:[222,112],Hd:[270,146],eye:[-2,-5]}),
    hand:P({F1:[184,60],K1:[186,104],H:[186,138],K2:[182,104],F2:[180,60],C:[186,180],S:[184,222],E:[183,261],W:[182,300],Hd:[198,240],eye:[3,5],wall:170})
  };

  // Bonnie balancing on her hands. s: 0 shoulders behind hands, 1 shoulders right over them. straight: straight arms or bent
  function balancePose(s,straight){
    const W=[182,300];let Sh,E;
    if(straight){const dx=(1-s)*44;Sh=[W[0]+dx,W[1]-Math.sqrt(80*80-dx*dx)];E=mid(W,Sh);}
    else{const dx=(1-s)*44+12,ch=58;Sh=[W[0]+dx,W[1]-Math.sqrt(ch*ch-dx*dx)];
      const m=mid(W,Sh),d=Math.hypot(Sh[0]-W[0],Sh[1]-W[1]),hh=Math.sqrt(Math.max(0,40*40-(d/2)*(d/2)));
      const ux=(Sh[0]-W[0])/d,uy=(Sh[1]-W[1])/d;E=[m[0]+uy*hh,m[1]-ux*hh];}
    const a=(1-s)*0.6+(straight?0:0.2);const u=[Math.sin(a),-Math.cos(a)],n=[-u[1],u[0]];
    const H=[Sh[0]+85*u[0],Sh[1]+85*u[1]];
    const C=[(Sh[0]+H[0])/2-6*n[0],(Sh[1]+H[1])/2-6*n[1]];
    const rot=(v,t)=>[v[0]*Math.cos(t)-v[1]*Math.sin(t),v[0]*Math.sin(t)+v[1]*Math.cos(t)];
    const lead=rot(u,-0.75),trail=rot(u,0.75);
    const at=(v,k)=>[H[0]+v[0]*k,H[1]+v[1]*k];
    const Hd=[Sh[0]-u[0]*15+n[0]*17,Sh[1]-u[1]*15+n[1]*17];
    return {F1:at(trail,112),K1:at(trail,57),H,K2:at(lead,57),F2:at(lead,112),C,S:Sh,E,W,Hd,eye:[2,5],wall:null};
  }
  const balanced=(s,straight)=>straight&&Math.abs(com(balancePose(s,straight))[0]-182)<=12;

  return {S,T,guide,spine,ic,body,thumb,lerp,com,POSE,balancePose,balanced};
})();

/* ---------- Over the Bridge ---------- */
const GAME='over-the-bridge', SAVE='over-the-bridge-v1';
const YT=(id,t)=>'https://www.youtube.com/watch?v='+id+(t?'&t='+t+'s':'');
const V1='Xo5Dt5oPr0A',V2='pG2uW38fkY0',V3='xF3a0VmYTOs';
const G=window.GR||{player:()=> 'unknown',key:k=>k,start(){},part(){},partDone(){},finish(){},ask:()=>({miss(){},hint(){},done(){},giveUp(){}}),write(){},testing:()=>false};
let PLAYER=G.player(); let KEY=G.key(SAVE); let S=load();
const app=document.getElementById('app');
const isM=()=>PLAYER==='maeve';
const easy=()=>isM()&&S.easy;
const SIS=()=>isM()?'Maggie':'Maeve';
const ME=()=>isM()?'Maeve':'Maggie';

function defaults(){return {easy:false,done:{},part:null,task:0,tempo:null,ticks:{},cue:null,writing:{},finished:false};}
function load(){try{return Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){return defaults();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function sisterSave(){try{const other=isM()?'maggie':'maeve';const k=KEY.replace(/::(test-)?(maeve|maggie)$/,(m,t)=>'::'+(t||'')+other);return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}

/* tiny DOM helpers: text always goes in as text nodes; innerHTML only for the SVG strings drawn above */
function h(tag,a,...kids){const e=document.createElement(tag);if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;
  if(k==='class')e.className=v;else if(k==='on')for(const ev in v)e.addEventListener(ev,v[ev]);else if(k==='svg')e.innerHTML=v;else if(k==='style')e.style.cssText=v;else e.setAttribute(k,v===true?'':v);}
  kids.flat().forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);});return e;}
function rich(s){const f=document.createDocumentFragment();String(s).split(/(\*\*[^*]+\*\*)/).forEach(p=>{if(!p)return;if(p.startsWith('**')&&p.endsWith('**'))f.appendChild(h('b',null,p.slice(2,-2)));else f.appendChild(document.createTextNode(p));});return f;}
function P(s,cls){const p=h('p',{class:cls||null});p.appendChild(rich(s));return p;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function film(svg,tag){const f=h('div',{class:'film'});f.innerHTML=svg;if(tag)f.appendChild(h('span',{class:'tag'},tag));return f;}
function nextBtn(label,fn){return h('div',{class:'next-row'},h('button',{class:'btn',type:'button',on:{click:fn||advance}},label||'Next →'));}
const TICK='<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- the frame every task sits in ---------- */
let F=null, ASKS=[], HELP=null, SEL=null, TIMERS=[];
function ask(item,concept,area){const q=G.ask({item,concept,area:area||'HPE'});ASKS.push(q);return q;}
function later(fn,ms){const t=setTimeout(fn,ms);TIMERS.push(t);return t;}
function every(fn,ms){const t=setInterval(fn,ms);TIMERS.push(t);return t;}
function clearTimers(){TIMERS.forEach(t=>{clearTimeout(t);clearInterval(t);});TIMERS=[];}
function frame(){
  clearTimers();app.textContent='';ASKS=[];HELP=null;SEL=null;
  const ps=parts(),p=ps[S.part],ts=p.tasks;
  const dots=h('div',{class:'dots','aria-label':'Step '+(S.task+1)+' of '+ts.length},ts.map((_,i)=>h('i',{class:i<S.task?'on':(i===S.task?'now':'')})));
  const head=h('div',{class:'head'},h('button',{class:'back',type:'button',on:{click:()=>{clearTimers();S.part=null;save();render();}}},'← Map'),h('h2',null,p.title),dots);
  const sayEl=h('p');
  const qb=h('button',{class:'qbtn',type:'button','aria-label':'Help, please',title:'Help, please',disabled:true,on:{click:showHelp}},'?');
  const bubble=h('div',{class:'bubble'},h('div',{class:'face',svg:ART.guide}),sayEl,qb);
  const clue=h('div',{class:'clue',hidden:true});
  const picEl=h('div',{class:'pic'});const side=h('div',{class:'side'});
  const stage=h('div',{class:'stage'},picEl,side);
  app.append(whoBar(),h('div',{class:'panel'},head,bubble,clue,stage));
  F={pic:picEl,side,stage,clue,qb,

/* ---------- drag, or tap then tap ---------- */
function clearSel(){if(SEL){SEL.chip.classList.remove('sel');document.querySelectorAll('.target.glow').forEach(t=>t.classList.remove('glow'));}SEL=null;}
function hitTest(targets,x,y){const ok=t=>t&&targets.includes(t)&&!t.classList.contains('full');
  let el=document.elementFromPoint(x,y);while(el&&el!==document.body){if(el.classList&&el.classList.contains('target')){if(ok(el))return el;break;}el=el.parentNode;}
  let best=null,ba=Infinity;for(const t of targets){if(!ok(t))continue;const r=t.getBoundingClientRect();if(x>=r.left-6&&x<=r.right+6&&y>=r.top-6&&y<=r.bottom+6){const a=r.width*r.height;if(a<ba){ba=a;best=t;}}}return best;}
function draggable(chip,targets,drop){chip.classList.add('chip');chip.setAttribute('role','button');chip.tabIndex=0;
  chip.addEventListener('pointerdown',e=>{if(chip.classList.contains('used'))return;e.preventDefault();
    const sx=e.clientX,sy=e.clientY;let ghost=null,moved=false;try{chip.setPointerCapture(e.pointerId);}catch(_){}
    const move=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>9){moved=true;clearSel();ghost=chip.cloneNode(true);ghost.classList.add('dragghost');document.body.appendChild(ghost);chip.classList.add('lifted');}
      if(moved){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';const t=hitTest(targets(),ev.clientX,ev.clientY);targets().forEach(x=>x.classList.toggle('over',x===t));}};
    const up=ev=>{chip.removeEventListener('pointermove',move);chip.removeEventListener('pointerup',up);chip.removeEventListener('pointercancel',up);
      if(moved){ghost.remove();chip.classList.remove('lifted');targets().forEach(x=>x.classList.remove('over'));if(ev.type==='pointerup'){const t=hitTest(targets(),ev.clientX,ev.clientY);if(t)drop(chip,t);}}
      else if(ev.type==='pointerup'){const was=SEL&&SEL.chip===chip;clearSel();if(!was){SEL={chip,drop,targets};chip.classList.add('sel');targets().forEach(t=>{if(!t.classList.contains('full'))t.classList.add('glow');});}}};
    chip.addEventListener('pointermove',move);chip.addEventListener('pointerup',up);chip.addEventListener('pointercancel',up);});
  chip.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();clearSel();SEL={chip,drop,targets};chip.classList.add('sel');}});}
function target(el){el.classList.add('target');el.addEventListener('click',()=>{if(SEL&&SEL.targets().includes(el)){const s=SEL;clearSel();s.drop(s.chip,el);}});return el;}

/* A one-answer question. opts: [{t, ok, why, svg}] */
function choose(host,opts,q,onRight,o){o=o||{};
  const box=h('div',{class:'choices'+(o.two?' two':'')+(o.three?' three':'')});
  (o.keep?opts:shuffle(opts)).forEach(op=>{const b=h('button',{class:'choice'+(op.svg&&o.pictop?' pictop':''),type:'button'});
    if(op.svg)b.appendChild(h('span',{svg:op.svg}));b.appendChild(h('span',null,op.t));
    b.addEventListener('click',()=>{if(box.dataset.done)return;
      if(op.ok){box.dataset.done=1;b.classList.add('right');q.done();onRight(op);}
      else{b.classList.add('wrong');b.disabled=true;q.miss(op.t);toast('hmm',op.why||'Not quite. Have another look.',3800);}});
    box.appendChild(b);});
  host.appendChild(box);return box;}

/* Bonnie moving smoothly from one pose to another */
function animate(fl,from,to,ms,o,cb){let t0=performance.now();
  const id=every(()=>{const t=Math.min(1,(performance.now()-t0)/ms),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

  if(!learn)f.help(['Look at Bonnie. Where is she now? What does she do next?','Standing: arms go up first. Hands on the floor: push off. Upside down: one leg comes down.','The order: '+ph.map(p=>p.m).join(', ')+'.']);

  const order=learn?ph:shuffle(ph);
  const padEls={};
  order.forEach(p=>{const showPic=learn||isM();
    const b=h('button',{class:'pad',type:'button','aria-label':p.t});
    if(showPic)b.appendChild(h('span',{svg:ART.thumb(ART.POSE[p.k])}));
    b.appendChild(h('span',null,learn?p.t:p.m));
    b.addEventListener('click',()=>tap(p.k));padEls[p.k]=b;pads.appendChild(b);});
  f.side.append(track,pads);
  let i=0,pos=0,q=null,moving=false,falling=null;
  function startTile(){const p=ph[i];pos=0;tile.className='tile'+(learn?'':' q');tile.textContent='';
    if(learn){tile.appendChild(h('span',{svg:ART.thumb(ART.POSE[p.k])}));tile.appendChild(h('span',null,p.m));
      Object.values(padEls).forEach(b=>b.classList.remove('glow'));padEls[p.k].classList.add('glow');}
    else{tile.append(h('b',null,'?'),h('span',null,'What next?'));
      q=ask('Beat '+(i+1)+': '+p.m+(i?' (after '+ph[i-1].m+')':''),'walkover-sequence');}
    const t0=performance.now();
    falling=every(()=>{pos=Math.min(1,(performance.now()-t0)/ms);tile.style.top=`calc(${(pos*100).toFixed(1)}% - ${(pos*94).toFixed(1)}px)`;
      if(pos>=1){clearInterval(falling);tile.classList.add('wait');}},30);}
  function tap(k){if(moving||i>=ph.length)return;const p=ph[i];
    if(k!==p.k){if(q)q.miss(k);padEls[k].classList.add('shake');later(()=>padEls[k].classList.remove('shake'),500);
      toast('hmm',learn?'Tap the **glowing** one.':(i===0?'Bonnie is standing still. What’s the very first thing she does?':'Bonnie has just done **'+ph[i-1].m.toLowerCase()+'**. What comes next?'),3000);return;}
    if(pos<0.72){toast('hmm','Wait for it… a walkover is **slow and controlled**.',1800);return;}
    if(q)q.done();clearInterval(falling);moving=true;tile.classList.remove('wait');padEls[k].classList.add('right');
    const to=ART.POSE[p.k];animate(fl,pose,to,650,{},()=>{pose=to;moving=false;padEls[k].classList.remove('right');i++;
      if(i<ph.length)later(startTile,300);else finish();});}
  function finish(){tile.className='tile';tile.textContent='';tile.style.top='8px';tile.appendChild(h('span',{svg:ART.thumb(ART.POSE.tall)}));tile.appendChild(h('span',null,'Walkover!'));
    Object.values(padEls).forEach(b=>{b.classList.remove('glow');b.disabled=true;});
    later(()=>playThrough(fl,[ART.POSE.stand].concat(ph.map(p=>ART.POSE[p.k])),520,{},()=>{
      win(learn?(isM()?'That’s a whole back walkover, beat by beat! Next time the labels hide.':'That’s the whole back walkover, beat by beat. Next round, the labels are hidden.'):
        (isM()?'You remembered the **whole walkover**!':'You remembered every beat. Which beat do you think needs the most **strength**? Tell your grown-up why.'));}),400);}
  startTile();
}
const beatLearn=f=>beatRound(f,1), beatRecall=f=>beatRound(f,2);

/* ---------- PART 4: your ladder ---------- */
function ladderOrder(f){
  if(!isM())return ladderMatch(f);
  const keys=easy()?['bridge','stand','walk']:['bridge','wall','stand','push','walk'];
  f.say('Nobody starts with a walkover. Put the **ladder** in order, from first step to last.');
  f.help(['What do you need before you can walk down a wall **into** a bridge?','A walkover is the very last step.','Order: '+keys.map(k=>rungBy(k).t).join(', ')+'.']);
  const q=ask('Order the ladder to a walkover','walkover-progression');
  F.one();
  const slots=h('div',{class:'slots'});const sl=keys.map((_,i)=>{const s=target(h('div',{class:'slot'},h('span',{class:'slot-n'},String(i+1))));s.dataset.n=i;slots.appendChild(s);return s;});
  const tray=h('div',{class:'tray'});let left=keys.length;
  shuffle(keys).forEach(k=>{const r=rungBy(k),n=keys.indexOf(k);const card=()=>h('div',{class:'chip card'},h('span',{svg:ART.thumb(ART.POSE[RUNG_PIC[k]])}),h('span',null,r.t));
    const chip=h('div',{class:'card'},h('span',{svg:ART.thumb(ART.POSE[RUNG_PIC[k]])}),h('span',null,r.t));chip.classList.add('card');
    draggable(chip,()=>sl,(ch,s)=>{if(+s.dataset.n===n){s.classList.add('full');s.appendChild(card());ch.classList.add('used');left--;
        if(left===0){q.done();later(()=>win('That’s the ladder. Each step gets you ready for the next one. **Bridge** first, **walkover** last.',null,F.side),300);}}
      else{q.miss(r.t+' in place '+(+s.dataset.n+1));s.classList.add('shake');later(()=>s.classList.remove('shake'),500);
        toast('hmm',k==='walk'?'The walkover puts everything together. When does that come?':(k==='bridge'?'You need a bridge before you can do anything else on this ladder.':'Which step gets you ready for this one?'),3200);}});
    tray.appendChild(chip);});
  f.pic.append(slots,tray);
}
function ladderMatch(f){ // Magnolia
  f.say('Each drill in the videos trains **one piece** of the walkover. Sort the drills into the piece they train.');
  f.help(['Think about which beat of the walkover each drill feels like.','The wall walk and the knee back bend train the **reach back**. A wall handstand trains the **finish**.']);
  const pieces=[{k:'reach',t:'Reach back (the back bend)'},{k:'push',t:'Push off'},{k:'down',t:'Over the top and one leg down'}];
  const drills=[{t:'Wall walk',p:'reach',pic:'wall'},{t:'Back bend on your knees',p:'reach',pic:'kneel'},{t:'Bridge pops and kick-offs',p:'push',pic:'reach'},{t:'Wall handstand, one leg down',p:'down',pic:'hand'}];
  const qs={};drills.forEach(d=>qs[d.t]=ask('Match drill: '+d.t,'walkover-progression'));
  F.one();
  const bins=pieces.map(pc=>{const b=target(h('div',{class:'bin piece'},h('div',{class:'bin-h'},h('span',null,pc.t)),h('div',{class:'bin-body'})));b.dataset.k=pc.k;return b;});
  const tray=h('div',{class:'tray'});let left=drills.length;
  shuffle(drills).forEach(d=>{const chip=h('div',{class:'card'},h('span',{svg:ART.thumb(ART.POSE[d.pic])}),h('span',null,d.t));chip.classList.add('card');
    draggable(chip,()=>bins,(ch,bin)=>{if(bin.dataset.k===d.p){qs[d.t].done();ch.classList.add('used');bin.lastChild.appendChild(h('div',{class:'chip card'},h('span',{svg:ART.thumb(ART.POSE[d.pic])}),h('span',null,d.t)));left--;
        if(left===0)later(why,500);}
      else{qs[d.t].miss('put in '+bin.dataset.k);bin.classList.add('shake');later(()=>bin.classList.remove('shake'),500);
        toast('hmm',d.p==='reach'?'This one has you leaning back towards the floor. Which beat is that?':(d.p==='push'?'Here your feet drive you over. Which beat is that?':'Here you’re upside down on your hands. Which beat is that?'),3400);}});
    tray.appendChild(chip);});
  f.pic.append(tray,h('div',{class:'bins three'},...bins));
  function why(){f.pic.textContent='';f.say('The coach says you need a **standing back bend** and a **handstand** before you try a walkover. Why?');
    f.help(['Think about the beats: what does Bonnie do at the start, and in the middle?','A walkover starts as a standing back bend and passes through a handstand.']);
    const q=ask('Why a standing back bend and a handstand come before a walkover','walkover-progression');
    f.pic.appendChild(film(ART.body(ART.POSE.push,{}),'THE MIDDLE OF A WALKOVER'));
    choose(f.pic,[
      {t:'A walkover starts as a standing back bend and passes through a handstand. Each one is a piece of it.',ok:true},
      {t:'So you are tired out before you start',why:'Being tired makes it harder, not safer. Think about the beats of the walkover.'},
      {t:'Because they look good in videos',why:'Think about what Bonnie actually does at the start and in the middle of a walkover.'}],q,
      ()=>win('Yes. Learn each piece on its own, safely, then join them up. That’s what the ladder does.',null,f.pic));}
}

function ladderCheck(f){
  f.say(isM()?'Where are **you** on the ladder? Tap everything you can **already** do.':'Where are **you** on the ladder? Tick what you can already do, honestly.');
  f.help(null);F.one();
  const keys=['bridge','wall','stand','push','hand'];
  const box=h('div',{class:'checks'});
  keys.forEach(k=>{const r=rungBy(k);const b=h('button',{class:'check',type:'button','aria-pressed':String(!!S.ticks[k])},h('span',{class:'box'},S.ticks[k]?'✓':''),h('span',{class:'th',svg:ART.thumb(ART.POSE[RUNG_PIC[k]])}),h('span',null,r.can));
    b.addEventListener('click',()=>{S.ticks[k]=!S.ticks[k];save();b.setAttribute('aria-pressed',String(S.ticks[k]));b.firstChild.textContent=S.ticks[k]?'✓':'';});box.appendChild(b);});
  f.pic.append(P(isM()?'Not sure? Leave it empty. You’ll test it with your grown-up.':'Not sure? Leave it unticked. You’ll test it with your grown-up, and you can change it next time.','note'),box,
    nextBtn('Find my rung →',showLadder));
  function showLadder(){f.pic.textContent='';const today=todayRung();
    G.write({prompt:'Walkover ladder: what I can already do (and today’s rung)',text:keys.map(k=>rungBy(k).t+': '+(S.ticks[k]?'yes':'not yet')).join('; ')+'. Today’s rung: '+rungBy(today).t+'.',game:GAME,part:'Your ladder',area:'HPE'});
    f.say(isM()?'Here’s your ladder. Today you practise the **glowing** rung.':'Here’s your ladder. Today’s rung is glowing.');
    const lad=h('div',{class:'ladder'});
    RUNGS.forEach(r=>{const done=r.k!=='walk'&&S.ticks[r.k],now=r.k===today;
      lad.appendChild(h('div',{class:'rung'+(done?' done':'')+(now?' today':'')},h('span',{class:'th',svg:ART.thumb(ART.POSE[RUNG_PIC[r.k]])}),
        h('span',null,r.t,h('small',null,r.k==='hand'?'needed for the finish':(r.k==='walk'?'with a grown-up spotting':''))),
        done?h('span',{class:'mark',style:'color:#1D6B44'},'✓ can do'):(now?h('span',{class:'mark',style:'color:#8a5a00'},'today'):null)));});
    f.pic.append(lad);
    // coaching cue for her sister
    const cues=[{k:'ears',t:'Arms tight by your ears',svg:ART.ic.ears},{k:'rainbow',t:'A rainbow, not a hinge',svg:ART.ic.rainbow},{k:'slow',t:'Slow and controlled',svg:ART.ic.breathe}];
    const cb=h('div',{class:'cues'});const go=h('button',{class:'btn',type:'button',disabled:!S.cue},'I’m ready →');go.addEventListener('click',advance);
    cues.forEach(c=>{const b=h('button',{class:'cue'+(S.cue===c.k?' on':''),type:'button'},h('span',{svg:c.svg}),h('span',null,c.t));
      b.addEventListener('click',()=>{S.cue=c.k;save();cb.querySelectorAll('.cue').forEach(x=>x.classList.remove('on'));b.classList.add('on');go.disabled=false;});cb.appendChild(b);});
    f.pic.append(h('div',{class:'teach'},P('**Your coaching job:** when '+SIS()+' has her turn, you watch for one thing. Choose it.')),cb,h('div',{class:'next-row'},go));
    lad.scrollIntoView({behavior:'smooth',block:'start'});}
}

/* ---------- the parts ---------- */
function parts(){return [
  {id:'remember',title:'Bonnie remembers',blurb:'What do you remember from The Rainbow Bridge?',col:'#3A9AD9',tasks:[recallSpine,recallSafe]},

/* ---------- screens ---------- */
function whoBar(){const w=h('div',{class:'top'},h('div',{class:'brand'}),h('div',{class:'who'}));
  const brand=w.firstChild;brand.appendChild(h('span',{class:'bface',svg:ART.guide}));brand.appendChild(h('h1',null,'Over the Bridge'));

    h('button',{class:'btn big',type:'button',style:'background:#16A08F',on:{click:()=>set('maeve')}},'Maeve'))));}
function unlocked(i){const ps=parts();return i===0||S.done[ps[i-1].id]||S.done[ps[i].id];}
function home(){clearTimers();app.textContent='';const ps=parts();
  const tile=(p,i)=>{const open=unlocked(i),done=!!S.done[p.id];
    const b=h('button',{class:'stop'+(done?' done':'')+(open?'':' locked'),type:'button',disabled:!open,style:`--c:${p.col}`},
      h('span',{class:'num'},done?'✓':String(i+1)),h('span',{class:'st'},h('b',null,p.title),h('small',null,p.blurb)));
    if(open)b.addEventListener('click',()=>{S.part=i;S.task=0;S._rem=0;save();G.start(GAME);G.part(p.title);render();});return b;};
  const allDone=ps.every(p=>S.done[p.id]);
  const vid=h('button',{class:'stop vid'+(allDone?'':' locked'),type:'button',disabled:!allDone,style:'--c:#E0332B'},h('span',{class:'num',svg:ART.ic.play}),h('span',{class:'st'},h('b',null,'Practice time!'),h('small',null,'Your rung, with the coach’s video and a grown-up')));
  if(allDone)vid.addEventListener('click',finishScreen);
  app.append(whoBar(),h('div',{class:'panel'},h('div',{class:'intro'},film(ART.body(ART.POSE.push,{com:true,base:[170,194]}),'X-RAY'),h('div',null,
    h('h2',null,'Why don’t you land on your head?'),P(isM()?'In a back walkover you go upside down, right over your own hands. Find out how, learn the beats, and find your first step.':'A back walkover takes you upside down, over your own hands, and back on to your feet. Find out what keeps you up, learn its beats, and find where you are on the ladder.'),
    h('div',{class:'casehead'},'Your path',h('small',null,'about 10 minutes, then practice')),h('div',{class:'stops'},ps.map((p,i)=>tile(p,i)),vid),
    P(Object.keys(S.done).length&&!allDone?'Everything is saved. You can stop and come back any time.':'','note')))));}
function advance(){clearTimers();const ps=parts(),p=ps[S.part];S.task++;S._rem=0;
  if(S.task>=p.tasks.length){if(!S.done[p.id]){S.done[p.id]=true;G.partDone(p.title);}save();return partEnd();}
  save();render();}
function partEnd(){const ps=parts(),i=S.part,p=ps[i],last=i===ps.length-1;app.textContent='';
  if(last)return finishScreen();
  app.append(whoBar(),h('div',{class:'panel center'},h('div',{class:'big-tick',style:`--c:${p.col}`},'✓'),h('h2',null,p.title+': done!'),
    P('You can stop here. Everything is saved.','note'),
    h('div',{class:'row center'},h('button',{class:'btn ghost',type:'button',on:{click:()=>{S.part=null;save();render();}}},'Map'),
      h('button',{class:'btn',type:'button',on:{click:()=>{S.part=i+1;S.task=0;S._rem=0;save();G.part(ps[i+1].title);render();}}},'Next: '+ps[i+1].title+' →'))));}
function finishScreen(){clearTimers();app.textContent='';
  if(!S.finished){S.finished=true;save();G.finish();}
  S.part=null;save();
  const r=rungBy(todayRung());
  const cues={ears:['Arms tight by your ears',ART.ic.ears],rainbow:['A rainbow, not a hinge',ART.ic.rainbow],slow:['Slow and controlled',ART.ic.breathe]};
  const me=cues[S.cue],sis=sisterSave(),sc=sis&&cues[sis.cue],sr=sis&&sis.finished?rungBy(todayRung(sis.ticks||{})):null;

  const safety=h('div',{class:'safety'},h('h3',null,'Before you start'),h('ul',null,

    h('li',null,'Take turns. One tries, one coaches. Then swap.'),

    const ta=h('textarea',{rows:2,'aria-label':'One sentence, if you like'});ta.value=S.writing.after||'';

  app.append(whoBar(),h('div',{class:'panel'},h('div',{class:'rungcard'},film(ART.body(ART.POSE[RUNG_PIC[r.k]],{}),'TODAY'),h('div',{style:'display:grid;gap:12px'},
    h('h2',null,'Ready for your rung!'),
    P(isM()?'Shoulders over hands, arms strong, go slowly. One step at a time up the ladder.':'Shoulders stacked over straight arms keep your balance point over your hands. Learn each piece slowly, then join them up.'),
    coach))),
    h('div',{style:'height:14px'}),safety,h('div',{style:'height:14px'}),card,h('div',{style:'height:14px'}),after,h('div',{style:'height:14px'}),wonder,
    h('div',{class:'row center',style:'margin-top:12px'},h('button',{class:'btn ghost',type:'button',on:{click:()=>render()}},'Back to the map')));
}
function playTask(){const ps=parts();const p=ps[S.part];if(!p){S.part=null;return home();}
  if(S.task>=p.tasks.length)S.task=0;G.start(GAME);G.part(p.title);const f=frame();p.tasks[S.task](f);}
function render(){window.scrollTo(0,0);if(PLAYER==='unknown')return whoScreen();if(S.part==null)return home();playTask();}
window.OB={state:()=>S,go(part,task){S.part=part;S.task=task||0;S._rem=0;save();render();},setEasy(v){S.easy=v;save();render();},parts,ART};
