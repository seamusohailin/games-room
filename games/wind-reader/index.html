<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>The Wind Reader</title>
<script src="../../results.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fraunces:opsz,wght@9..144,700&display=swap">
<style>
/* Aboard Captain Hale's ship. Pictures first, one short line of text, hands-on moves. Maeve's teal for every action. */
:root{
  --bg:#10263a; --bg-deep:#091726; --glow:#f2c75c; --parch:#f8efdc; --parch-2:#e8d9b6; --parch-3:#d6c193;
  --ink:#2a2118; --muted:#6d5c44; --teal:#16A08F; --teal-deep:#0c6b5f; --wax:#a5302a; --rope:#b0864f;
  --ok:#2f7d4f; --ok-bg:#e1f1e2; --hmm-bg:#fbecd2; --clue-bg:#fff4d6; --on-dark:#f4ead6;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Andika","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:radial-gradient(ellipse at 90% -5%,rgba(242,199,92,.22),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(22,160,143,.14),transparent 50%);
  color:var(--on-dark);font-family:var(--body);font-size:1.15rem;line-height:1.4;min-height:100vh;-webkit-text-size-adjust:100%}
.wrap{max-width:960px;margin:0 auto;padding:max(12px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(90px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
svg text{font-family:var(--body)}

.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding-bottom:10px;margin-bottom:12px;border-bottom:2px dashed rgba(242,199,92,.35)}
.brand h1{color:var(--glow);font-size:clamp(1.6rem,5vw,2.3rem);line-height:1.05}
.status{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pips{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.pips li{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;border:2px solid var(--parch-3);color:var(--parch-3)}
.pips li.done{background:var(--teal);border-color:var(--teal);color:#fff}
.pips li.now{background:var(--glow);border-color:var(--glow);color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:8px;background:var(--bg-deep);border:2px solid var(--parch-3);border-radius:999px;padding:6px 14px;min-height:46px;cursor:pointer;font-size:.95rem}
.toggle .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--parch-3);display:grid;place-items:center}
.toggle[aria-pressed="true"]{border-color:var(--teal)}
.toggle[aria-pressed="true"] .box{background:var(--teal);border-color:var(--teal)}
.toggle[aria-pressed="true"] .box::after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px)}

.panel{background:var(--parch);color:var(--ink);border-radius:14px;padding:14px 16px 16px;box-shadow:0 6px 0 var(--bg-deep)}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.phead h2{color:var(--wax);font-size:clamp(1.3rem,4vw,1.7rem)}
.dots{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.dots li{width:16px;height:16px;border-radius:50%;border:2px solid var(--parch-3);background:#fff}
.dots li.on{background:var(--teal);border-color:var(--teal)}
.bubble{display:flex;gap:10px;align-items:center;margin:10px 0 0;min-height:52px}
.bubble .who{flex:none;width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;border:2px solid var(--rope)}
.bubble .who svg{width:38px;height:38px}
.bubble p{flex:1;margin:0;font-size:1.3rem;line-height:1.35;font-weight:700;background:#fff;border-radius:14px;padding:8px 14px;border:2px solid var(--parch-2)}
.qbtn{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid #E3BE5C;background:var(--clue-bg);font-weight:700;font-size:1.3rem;cursor:pointer;color:var(--ink)}
.qbtn[disabled]{opacity:.35;cursor:default}
.clue{margin:8px 0 0 60px;background:var(--clue-bg);border-radius:12px;padding:8px 12px;font-size:1.1rem}

.sw{position:relative;margin-top:10px;border-radius:14px;background:#0b1c2c;padding:5px;box-shadow:inset 0 0 0 2px rgba(176,134,79,.45)}
.sw>svg{display:block;width:100%;height:auto;border-radius:10px;touch-action:manipulation}
.ov{position:absolute;inset:5px;pointer-events:none}
.ov>*{pointer-events:auto}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:88%;padding:8px 18px;border-radius:999px;font-weight:700;font-size:1.2rem;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.25);z-index:5;pointer-events:none}
.toast.yes{background:var(--ok-bg);color:var(--ok);border:3px solid var(--ok)}
.toast.hmm{background:var(--hmm-bg);color:#7a4a12;border:3px solid #E3BE5C}
.toast.info{background:#fff;color:var(--ink);border:3px solid var(--rope)}
.tray{margin-top:12px;min-height:60px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.btn{font-family:var(--body);font-weight:700;font-size:1.25rem;background:var(--teal);color:#fff;border:0;border-radius:999px;padding:.5em 1.5em;min-height:58px;cursor:pointer;box-shadow:0 4px 0 var(--teal-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-deep)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink),0 4px 0 var(--parch-3)}
.btn[disabled]{opacity:.5}

/* picture tiles */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:#fff;border:3px solid var(--parch-2);border-radius:16px;padding:8px 8px 10px;cursor:pointer;box-shadow:0 4px 0 var(--parch-2);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:1.15rem;color:var(--ink)}
.tile svg{width:96px;height:72px}
.tile.yes{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok)}
.tile.no{opacity:.35;box-shadow:none}

/* things to drag */
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border:3px solid var(--teal);border-radius:16px;padding:6px 14px;min-height:58px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:1.2rem;color:var(--ink);cursor:grab;box-shadow:0 4px 0 var(--teal-deep);position:relative}
.chip svg{width:40px;height:40px;flex:none}
.chip.lift{z-index:60;cursor:grabbing;box-shadow:0 10px 18px rgba(0,0,0,.3)}
.chip.sel{background:#e9f7f5;box-shadow:0 0 0 4px var(--glow),0 4px 0 var(--teal-deep)}
.chip.used{visibility:hidden}
.chip.shake{animation:shake .45s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.chip.float{position:absolute;border-color:#1f5fa8;box-shadow:0 4px 0 #154a86;background:#e9f2fb;padding:4px 8px;min-height:52px}
.chip.float svg{width:52px;height:52px}
svg .drop{cursor:pointer}
svg .drop.cando{fill:rgba(242,199,92,.25);stroke:#f2c75c;stroke-width:3;stroke-dasharray:8 6}
svg .drop.over{fill:rgba(22,160,143,.35);stroke:#16A08F;stroke-width:4}
#ara path.drop.cando{fill:#efe3bd;stroke:#f2c75c;stroke-width:4}
#ara path.drop.over{fill:#cdeee8;stroke:#16A08F;stroke-width:5}

/* slider */
.slide{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--parch-2);border-radius:999px;padding:6px 16px}
.slide svg{width:44px;height:44px;flex:none}
.slide input{flex:1;height:48px;accent-color:var(--teal)}
.monthbox{display:flex;align-items:center;gap:12px;justify-content:center;margin:0 0 8px}
.monthbox b{font-family:var(--display);font-size:1.8rem;color:var(--wax);min-width:6.5em;text-align:center}
.monthbox span{width:52px;height:52px;display:inline-block}
.monthbox svg{width:52px;height:52px}

/* poem */
.poem{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;background:#fffaf0;border:2px solid var(--parch-2);border-radius:12px;padding:10px 14px;margin-top:10px}
.poem p{margin:0;font-size:1.15rem;line-height:1.6;transition:opacity .5s}
.poem p.dim{opacity:.2}
.poem .cite{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
.gap{display:inline-block;min-width:96px;border-bottom:3px dashed var(--teal);text-align:center;color:var(--teal-deep);font-weight:700;padding:0 4px;border-radius:6px;cursor:pointer}
.gap.cando{background:#fff4d6}
.gap.over{background:#d9f1ed}
.gap.filled{border-bottom-style:solid;border-color:var(--ok);color:var(--ok)}
@media (max-width:640px){.poem{grid-template-columns:1fr}}

/* chance line */
.chance{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chance .drop{background:#fff;border:3px solid var(--parch-2);border-radius:14px;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:1.05rem;text-align:center;color:var(--ink);cursor:pointer}
.chance .drop svg{width:34px;height:34px}
.chance .drop.cando{border-color:var(--glow);border-style:dashed}
.chance .drop.over{border-color:var(--teal);background:#e9f7f5}
.chance .drop.filled{border-color:var(--ok);background:var(--ok-bg)}

/* sorting cards */
.sorts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sorts .drop{background:#fff;border:3px solid var(--parch-2);border-radius:14px;padding:6px;text-align:center;min-height:140px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.sorts .drop svg{width:100%;height:auto;max-height:110px}
.sorts .drop b{font-size:1.05rem;min-height:1.4em;color:var(--ok)}
.sorts .drop.cando{border-color:var(--glow);border-style:dashed}
.sorts .drop.over{border-color:var(--teal);background:#e9f7f5}
.sorts .drop.filled{border-color:var(--ok);background:var(--ok-bg)}

/* true-story card over the picture */
.card{position:absolute;inset:5px;background:rgba(9,23,38,.72);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:12px;z-index:8}
.card .in{background:#fffaf0;border:3px double var(--rope);border-radius:14px;padding:14px 16px;max-width:560px;width:100%;position:relative}
.card .ribbon{position:absolute;top:-14px;left:14px;background:var(--wax);color:#fff;font-weight:700;font-size:.9rem;padding:3px 12px;border-radius:999px}
.card h3{color:var(--wax);font-size:1.25rem;margin:4px 0 6px}
.card svg{width:100%;height:auto;display:block;margin:4px 0 8px}
.card p{margin:0 0 4px;font-size:1.2rem;font-weight:700}
.card .row{margin-top:8px}

/* end of a part */
.donebox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;background:#fff;border:3px solid var(--ok);border-radius:16px;padding:10px 14px}
.donebox .stamp{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:1.8rem;font-weight:700;flex:none}
.donebox p{margin:0;font-size:1.2rem;font-weight:700;flex:1;min-width:200px}

/* contents */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:700px){.hero{grid-template-columns:1fr}}
.hero p{font-size:1.25rem;margin:0 0 8px}
.hero .note{font-size:.9rem;color:var(--muted)}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.part{text-align:center;border:0;cursor:pointer;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;box-shadow:0 4px 0 var(--parch-3)}
.part svg{width:100%;max-width:150px;height:auto}
.part[disabled]{opacity:.45;cursor:default}
.part h3{font-size:1.05rem;color:var(--ink)}
.part .tag{font-size:.85rem;font-weight:700;color:var(--muted)}
.part.next{box-shadow:0 0 0 4px var(--glow),0 4px 0 var(--parch-3)}
.part.next .tag{color:var(--teal-deep)}

/* the end */
.endgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.endgrid div{background:#fffaf0;border:2px solid var(--parch-2);border-radius:12px;padding:8px;text-align:center;font-size:1rem;font-weight:700}
.endgrid svg{width:70px;height:56px;display:block;margin:0 auto 4px}
.tell{background:#fff;border:2px solid var(--parch-2);border-radius:12px;padding:10px 14px;margin-top:10px}
.tell h3{color:var(--wax);font-size:1.15rem;margin-bottom:4px}
.tell ul{margin:0;padding-left:1.2em}
textarea{width:100%;min-height:64px;font:inherit;font-size:1.15rem;border:2px solid var(--parch-3);border-radius:12px;padding:10px;background:#fff;color:var(--ink);margin-top:6px}

/* harbour */
#hb .palm-bow,#hb .flag-fly,#hb .seeds,#hb .streak,#hb .waves{opacity:0;transition:opacity .5s}
#hb .palm-up,#hb .flag-limp{transition:opacity .5s}
#hb.w1 .flag-fly{opacity:1}#hb.w1 .flag-limp{opacity:0}#hb.w1 .waves{opacity:.5}
#hb.w2 .flag-fly{opacity:1}#hb.w2 .flag-limp{opacity:0}#hb.w2 .waves{opacity:1}
#hb.w2 .palm-bow{opacity:1}#hb.w2 .palm-up{opacity:0}#hb.w2 .seeds,#hb.w2 .streak{opacity:1}
#hb.w1 .canopy{animation:shiver 1.2s ease-in-out infinite}
#hb.w2 .canopy{animation:shiver2 .8s ease-in-out infinite}
#hb.w1 .drift{animation:drift 9s ease-in-out infinite alternate}
#hb.w2 .drift{animation:drift 4s ease-in-out infinite alternate}
#hb.w1 .flap,#hb.w2 .flap{animation:flap .8s ease-in-out infinite}
#hb.w2 .wave{animation:wave 1.6s ease-in-out infinite}
#hb.w2 .seed{animation:seed 4s linear infinite}
#hb.w2 .streak{animation:streak 1.4s ease-in-out infinite}
#hb.w2 .seed.s2{animation-delay:1.3s}#hb.w2 .seed.s3{animation-delay:2.6s}
.canopy{transform-box:fill-box;transform-origin:50% 100%}
.flap{transform-box:fill-box;transform-origin:100% 50%}
@keyframes shiver{50%{transform:rotate(-2.5deg)}}
@keyframes shiver2{50%{transform:rotate(-6deg)}}
@keyframes drift{from{transform:translateX(20px)}to{transform:translateX(-30px)}}
@keyframes flap{50%{transform:scaleY(.82) skewY(5deg)}}
@keyframes wave{50%{transform:translateX(-10px)}}
@keyframes seed{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(-110px,-40px);opacity:0}}
@keyframes streak{0%{transform:translateX(8px);opacity:.2}50%{opacity:1}100%{transform:translateX(-14px);opacity:.2}}
.spot{cursor:pointer}
.spot .hit{fill:transparent;stroke:none}
.spot.got .hit{stroke:#16A08F;stroke-width:4;stroke-dasharray:8 5;fill:rgba(22,160,143,.12)}
.spot.nope .hit{stroke:#8a7a62;stroke-width:2;stroke-dasharray:3 5}
.spot.ring .hit{stroke:#f2c75c;stroke-width:6}
.cpt{cursor:pointer}
.cpt circle{fill:#fff;stroke:#2a2118;stroke-width:2}
.cpt.tappable circle{fill:#fff4d6;stroke:#e3be5c;stroke-width:3}
.cpt.no circle{fill:#ddd}
.cpt.yes circle{fill:#e1f1e2;stroke:#2f7d4f;stroke-width:4}

/* globe */
#gl .rays,#gl .warm,#gl .risebox,#gl .cool-s,#gl .cool-c,#gl .spinlbl,#gl .tradelbl{opacity:0;transition:opacity .6s}
#gl.lit .rays{opacity:1}
#gl.warmed .warm,#gl.warmed .risebox{opacity:1}
#gl.cool .cool-s{opacity:1}
#gl.curve .cool-s{opacity:0}
#gl.curve .cool-c,#gl.curve .tradelbl{opacity:1}
#gl.spin .spinlbl{opacity:1}
#gl.spin .spinl{animation:spinl 1.6s linear infinite}
#gl .sunbtn{cursor:pointer}
#gl .sunring{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
#gl.lit .sunring{display:none}
@keyframes spinl{from{transform:translateX(0)}to{transform:translateX(40px)}}
@keyframes pulse{50%{transform:scale(1.25);opacity:.3}}
.tz{cursor:pointer}

/* beach */
#bc .risebox,#bc .breeze-arr,#bc .flag-blow{opacity:0;transition:opacity .6s}
#bc.hot .risebox{opacity:1}
#bc.breeze .breeze-arr,#bc.breeze .flag-blow{opacity:1}
#bc.breeze .flag-limp{opacity:0}
#bc.breeze .flag-blow{animation:flap .8s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}

/* charts */
#atl .routes,#atl .west,#atl .trade,#atl .slotg{opacity:0;transition:opacity .6s}
#atl.routes-on .routes,#atl.west-on .west,#atl.trade-on .trade,#atl.slot-on .slotg{opacity:1}
.rt{cursor:pointer}
#wd .names{transition:opacity .6s}
#wd.hide .names{opacity:0}
#wd.calm.hide .names{opacity:.3}
#ara .wetw,#ara .dryw,#ara .turnw,#ara .rainl,#ara .storm{opacity:0;transition:opacity .5s}
#ara.wet .wetw,#ara.dry .dryw,#ara.turn .turnw,#ara.rain.wet .rainl,#ara.storm-on .storm{opacity:1}

.ccw{animation:ccw 3s linear infinite;transform-box:fill-box;transform-origin:center}
.cw{animation:cw 3s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes ccw{to{transform:rotate(-360deg)}}
@keyframes cw{to{transform:rotate(360deg)}}
.rise{animation:rise 1.8s ease-in infinite}
.rise.r2{animation-delay:.6s}.rise.r3{animation-delay:1.2s}
@keyframes rise{0%{transform:translateY(6px);opacity:0}30%{opacity:1}100%{transform:translateY(-20px);opacity:0}}
.zz{animation:zz 2.4s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}40%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.grown{margin-top:24px;padding-top:12px;border-top:2px dashed rgba(244,234,214,.25);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.95rem;opacity:.85}
.grown button{background:transparent;border:2px solid rgba(244,234,214,.5);border-radius:999px;padding:6px 14px;min-height:44px;cursor:pointer;font-size:.95rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>The Wind Reader</h1></div>
    <div class="status">
      <ol class="pips" id="pips" aria-label="Parts"></ol>
      <button class="toggle" id="easy" aria-pressed="false"><span class="box"></span>Calm seas (easier)</button>
    </div>
  </header>
  <main id="main"></main>
  <footer class="grown">
    <span>Your place is saved after each part. You can stop any time.</span>
    <button id="home">Contents</button>
    <button id="reset">Start again</button>
  </footer>
</div>
<script>
'use strict';
const G=window.GR||{player:()=>'unknown',key:k=>k,start(){},part(){},partDone(){},finish(){},ask(){return {miss(){},hint(){},done(){},giveUp(){},missed:()=>0};},write(){}};
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const GAME='wind-reader';
const RM=(()=>{try{return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}})();
const main=$('#main');
let runId=0;
const sleep=ms=>{const r=runId;return new Promise(res=>setTimeout(()=>{if(r===runId)res();},ms));};
function toTop(){try{window.scrollTo({top:0,behavior:'auto'});}catch(e){window.scrollTo(0,0);}}

/* ---------- saved progress, separate for each girl ---------- */
const KEY=G.key('wind-reader-v2');
function blank(){return {done:[],easy:false};}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&Array.isArray(v.done))return Object.assign(blank(),v);}catch(e){}return blank();}
let S=load();

/* ================= the stage: one picture, one short line, one thing to do ================= */
let STEP={n:0,of:0};
let HELP=null,HELPN=0,HELPQ=[],HELPX=null;
function stage(o){
  toTop();untoast();
  main.innerHTML=`<section class="panel"><div class="phead"><h2>${o.title}</h2><ol class="dots" id="dots" aria-label="Steps"></ol></div>
    <div class="bubble"><span class="who">${NUTMEG}</span><p id="say"></p><button class="qbtn" id="help" aria-label="Help, please" disabled>?</button></div>
    <p class="clue" id="clue" hidden></p>
    <div class="sw" id="sw" ${o.scene?'':'hidden'}>${o.scene||'<svg></svg>'}<div class="ov" id="ov"></div><div class="toast" id="toast" hidden></div></div>
    <div class="tray" id="tray"></div></section>`;
  STEP={n:0,of:o.steps||0};dots();if(o.say)say(o.say);
  $('#help').onclick=()=>{if(!HELP||HELPN>=HELP.length)return;HELPQ.forEach(q=>q&&q.hint());clue(`<b>${['Remember','Hint','Look'][Math.min(HELPN,2)]}:</b> ${HELP[HELPN]}`);if(HELPX)HELPX(HELPN);HELPN++;if(HELPN>=HELP.length)$('#help').disabled=true;};
}
function setScene(svg){const sw=$('#sw');const old=sw.querySelector(':scope>svg');const tmp=document.createElement('div');tmp.innerHTML=svg;old.replaceWith(tmp.firstElementChild);$('#ov').innerHTML='';}
function dots(){const d=$('#dots');if(d)d.innerHTML=Array.from({length:STEP.of},(_,i)=>`<li class="${i<STEP.n?'on':''}"></li>`).join('');}
function stepDone(){STEP.n++;dots();}
function say(t){const s=$('#say');if(s)s.innerHTML=t;}
function clue(t){const c=$('#clue');if(!c)return;if(!t){c.hidden=true;c.innerHTML='';return;}c.hidden=false;c.innerHTML=t;}
let toastT=null;
function toast(kind,t,ms){const el=$('#toast');if(!el)return;clearTimeout(toastT);el.className='toast '+kind;el.innerHTML=t;el.hidden=false;if(ms)toastT=setTimeout(()=>{el.hidden=true;},ms);}
function untoast(){clearTimeout(toastT);const el=$('#toast');if(el)el.hidden=true;}
function setHelp(levels,qs,extra){HELP=levels||null;HELPN=0;HELPQ=[].concat(qs||[]);HELPX=extra||null;clue(null);const b=$('#help');if(!b)return;b.disabled=!levels;if(S.easy&&levels&&levels.length>1){clue(`<b>Tip:</b> ${levels[0]}`);HELPN=1;}}
async function yes(t,ms){toast('yes',t);await sleep(ms||1500);untoast();}
function ask(o,suffix){return G.ask({item:o.item+(suffix||'')+(S.easy?'-calm':''),concept:o.concept,area:o.area||'SC'});}
function tray(html){const t=$('#tray');if(t)t.innerHTML=html||'';}
function press(label){tray(`<div class="row"><button class="btn" id="pr">${label}</button></div>`);return new Promise(res=>{$('#pr').onclick=()=>res();});}

/* pick a picture */
function pics(o){
  return new Promise(res=>{
    let opts=o.options.slice();
    if(S.easy&&opts.length>2){const r=opts.find(x=>x.v===o.answer);const w=opts.filter(x=>x.v!==o.answer);opts=[r,w.find(x=>x.v===o.easyWrong)||w[0]];}
    if(!o.keep)opts=shuffle(opts);
    if(o.say)say(o.say);untoast();
    tray(`<div class="tiles">${opts.map((op,i)=>`<button class="tile" data-i="${i}">${op.pic||''}<span>${op.label}</span></button>`).join('')}</div>`);
    const q=ask(o);setHelp(o.help,q);
    let locked=false;
    $$('#tray .tile').forEach(b=>b.onclick=async()=>{
      if(locked||b.disabled)return;const op=opts[+b.dataset.i];
      if(op.v===o.answer){locked=true;q.done();b.classList.add('yes');$$('#tray .tile').forEach(x=>x.disabled=true);setHelp(null);if(o.onRight)o.onRight();await yes(o.yes,o.ms);stepDone();res();}
      else{q.miss(op.label.replace(/<[^>]+>/g,''));b.classList.add('no');b.disabled=true;toast('hmm',o.miss?o.miss(op.v):'Not that one. Try again.');}
    });
  });
}
/* tap the right place on the picture */
function tapScene(o){
  return new Promise(res=>{
    if(o.say)say(o.say);untoast();tray(o.tray||'');
    const q=ask(o);setHelp(o.help,q,o.helpExtra);
    let locked=false;const tried={};const els=$$(o.sel);
    els.forEach(el=>{el.classList.add('tappable');el.addEventListener('click',async()=>{
      if(locked)return;const k=el.dataset.t;
      if(k===o.answer){locked=true;q.done();els.forEach(e=>e.classList.remove('tappable'));el.classList.add('yes');setHelp(null);if(o.onRight)await o.onRight(el);await yes(o.yes,o.ms);stepDone();res();}
      else if(!tried[k]){tried[k]=1;q.miss(o.names?o.names[k]:k);el.classList.add('no');if(o.onMiss)o.onMiss(k);toast('hmm',o.miss(k));}
    });});
  });
}
/* drag things onto the picture. Tapping a thing and then a place works too. */
function drag(o){
  return new Promise(res=>{
    if(o.say)say(o.say);untoast();
    let chips=o.chips.slice();
    if(S.easy&&o.easyDrop)chips=chips.filter(c=>!o.easyDrop.includes(c.v));
    if(!o.keep)chips=shuffle(chips);
    const inTray=chips.filter(c=>c.x==null),floats=chips.filter(c=>c.x!=null);
    const chipHTML=c=>`<button class="chip ${c.x!=null?'float':''}" data-v="${c.v}" ${c.x!=null?`style="left:${c.x}%;top:${c.y}%;translate:-50% -50%"`:''} aria-label="${c.aria||c.label||'drag me'}">${c.pic||''}${c.label?`<span>${c.label}</span>`:''}</button>`;
    tray((o.trayHead||'')+(inTray.length?`<div class="chips">${inTray.map(chipHTML).join('')}</div>`:'<p style="text-align:center;margin:4px 0;font-weight:700;color:#6d5c44">Drag it on the picture.</p>'));
    if(floats.length)$('#ov').insertAdjacentHTML('beforeend',floats.map(chipHTML).join(''));
    const targets=$$(o.targets);
    const decoy=t=>(o.decoys||[]).includes(t.dataset.t);
    const qs={};let firstQ=null;
    if(o.oneAsk){firstQ=ask(o);targets.forEach(t=>{if(!decoy(t))qs[t.dataset.t]=firstQ;});}
    else targets.forEach(t=>{if(decoy(t))return;const k=t.dataset.t;qs[k]=ask(o,'-'+k);if(!firstQ)firstQ=qs[k];});
    const allQ=[...new Set(Object.values(qs))];
    setHelp(o.help,allQ,o.helpExtra);
    const need=o.need||targets.filter(t=>!decoy(t)).length;
    let placed=0,sel=null,finished=false;
    const open=t=>!t.classList.contains('filled');
    function targetAt(x,y){const p=o.pad==null?12:o.pad;let best=null;for(const t of targets){if(!open(t))continue;const r=t.getBoundingClientRect();if(x>=r.left-p&&x<=r.right+p&&y>=r.top-p&&y<=r.bottom+p){if(!best||decoy(best))best=t;}}return best;}
    function mark(on){targets.forEach(t=>t.classList.toggle('cando',on&&open(t)));}
    async function attempt(chip,t){
      const v=chip.dataset.v,k=t.dataset.t,q=qs[k]||firstQ;
      if(!decoy(t)&&o.fits(v,k)){
        if(q&&!q._d){q.done();q._d=1;}
        placed++;if(!o.reuse)chip.classList.add('used');if(!o.multi)t.classList.add('filled');
        if(o.onPlace)o.onPlace(v,k,chip,t);
        if(placed>=need&&!finished){finished=true;mark(false);setHelp(null);allQ.forEach(x=>{if(x&&!x._d){x.done();x._d=1;}});await yes(o.yes,o.ms);stepDone();res();}
        else if(o.each)toast('yes',o.each(v,k),1200);
      }else{
        if(q)q.miss(o.label?o.label(v):v);chip.classList.remove('shake');void chip.offsetWidth;chip.classList.add('shake');
        toast('hmm',o.miss(v,k));
      }
    }
    const reset=chip=>{chip.style.transform='';};
    [...$$('#tray .chip'),...$$('#ov .chip')].forEach(chip=>{
      let sx=0,sy=0,moved=false,on=false;
      chip.addEventListener('pointerdown',e=>{if(chip.classList.contains('used')||finished)return;on=true;moved=false;sx=e.clientX;sy=e.clientY;try{chip.setPointerCapture(e.pointerId);}catch(_){}chip.classList.add('lift');e.preventDefault();});
      chip.addEventListener('pointermove',e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>8)moved=true;chip.style.transform=`translate(${dx}px,${dy}px)`;const over=targetAt(e.clientX,e.clientY);targets.forEach(t=>t.classList.toggle('over',t===over));});
      chip.addEventListener('pointerup',e=>{if(!on)return;on=false;chip.classList.remove('lift');reset(chip);targets.forEach(t=>t.classList.remove('over'));
        if(!moved){sel=sel===chip?null:chip;$$('.chip').forEach(c=>c.classList.toggle('sel',c===sel));mark(!!sel);return;}
        const t=targetAt(e.clientX,e.clientY);if(t)attempt(chip,t);});
      chip.addEventListener('pointercancel',()=>{on=false;chip.classList.remove('lift');reset(chip);});
    });
    targets.forEach(t=>t.addEventListener('click',()=>{if(!sel||finished||!open(t))return;const c=sel;sel=null;c.classList.remove('sel');mark(false);attempt(c,t);}));
  });
}

function sail(ship,path,from,to,ms,flip){
  return new Promise(res=>{
    const L=path.getTotalLength();
    const place=f=>{const p=path.getPointAtLength(L*f);ship.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})${flip?' scale(-1 1)':''}`);};
    if(RM||!ms){place(to);res();return;}
    const r=runId,t0=performance.now();
    const step=t=>{if(r!==runId)return;const k=Math.min(1,(t-t0)/ms);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;place(from+(to-from)*e);if(k<1)requestAnimationFrame(step);else res();};
    requestAnimationFrame(step);
  });
}

      yes:'Likely! Some years they’re a week late.',ms:1800});
    say('Now, when will the wind carry us home? Pick a month, then set sail!');
    tray(`<div class="monthbox"><span id="mpic"></span><b id="mname">July</b></div><div class="slide"><span style="font-weight:700">Jan</span><input type="range" id="rng" min="0" max="11" value="6" aria-label="Month"><span style="font-weight:700">Dec</span></div><div class="row" style="margin-top:10px"><button class="btn" id="go">Set sail!</button></div>`);
    const q=G.ask({item:'monsoon-month'+(S.easy?'-calm':''),concept:'Monsoon winds change with the seasons',area:'HSS'});
    setHelp(['Watch the arrows as you slide.','We need arrows that point towards Africa.','Try November.'],q);
    const show=m=>{untoast();const s=season(m);ara.classList.remove('wet','dry','turn');ara.classList.add(s);$('#mname').textContent=MONTHS[m];$('#mpic').innerHTML=s==='wet'?I.rain:s==='dry'?I.sunS:I.turn;};
    show(6);$('#rng').oninput=()=>show(+$('#rng').value);
    const tried={};
    await new Promise(res=>{$('#go').onclick=async()=>{
      const m=+$('#rng').value,s=season(m);$('#go').disabled=true;
      if(s==='dry'){q.done();setHelp(null);toast('yes',MONTHS[m]+'! The wind has turned.');await sail(ship,$('#pH'),0,.5,2600,true);untoast();res();}
      else if(s==='wet'){if(!tried[m]){q.miss(MONTHS[m]);tried[m]=1;}toast('hmm','Pushed back! It blows towards India.');await sail(ship,$('#pH'),0,.12,900,true);await sail(ship,$('#pH'),.12,0,800,true);$('#go').disabled=false;}
      else{if(!tried[m]){q.miss(MONTHS[m]);tried[m]=1;}toast('hmm','The wind is still turning. Try another month.');$('#go').disabled=false;}
    };});
    stepDone();
    ara.classList.add('storm-on');
    await drag({item:'monsoon-storm',concept:'Storm names by place',area:'HSS',targets:'#ara .storm .drop',oneAsk:true,
      say:'A storm in the Indian Ocean! What’s its name?',
      chips:[{v:'h',label:'Hurricane',pic:I.storm},{v:'t',label:'Typhoon',pic:I.storm},{v:'c',label:'Cyclone',pic:I.storm}],keep:true,easyDrop:['t'],
      fits:v=>v==='c',label:v=>({h:'Hurricane',t:'Typhoon',c:'Cyclone'})[v],
      miss:v=>v==='h'?'Hurricanes are near America.':'Typhoons are near Asia.',
      help:['Remember the world map.','The Indian Ocean and Australia share a name.','Cyclone.'],yes:'A cyclone!'});
    say('Africa, ho!');tray('');setHelp(null);
    await sail(ship,$('#pH'),.5,1,2200,true);
    await card({title:'Vasco da Gama, 1498',pic:DAGAMA_PIC,ps:['He didn’t wait for the wind to turn.','Going home took more than three months!']});
    finishPart(3);
    afterPart(3,'Monsoon winds change with the seasons. Wait for the wind!');
  })();
}

/* ===== Part 5: the captain's log ===== */
function partLog(){
  stage({title:'The captain’s log',steps:2,scene:HOMEPORT,say:'Home! Drag the missing words into the poem.'});
  (async()=>{
    const gaps=S.easy?['trembling','by']:['trembling','bow','by'];
    const gap=k=>gaps.includes(k)?`<span class="gap drop" data-t="${k}">&nbsp;</span>`:k;
    await drag({item:'log-poem',concept:'Who Has Seen the Wind? (memory work)',area:'EN',targets:'#tray .gap',
      trayHead:`<div class="poem"><p>Who has seen the wind?<br>Neither I nor you:<br>But when the leaves hang ${gap('trembling')},<br>The wind is passing through.</p><p>Who has seen the wind?<br>Neither you nor I:<br>But when the trees ${gap('bow')} down their heads,<br>The wind is passing ${gap('by')}.</p></div><div style="height:10px"></div>`,
      chips:[{v:'trembling',label:'trembling'},{v:'bow',label:'bow'},{v:'by',label:'by'},{v:'dancing',label:'dancing'},{v:'high',label:'high'}].filter(c=>!S.easy||gaps.includes(c.v)),
      fits:(v,k)=>v===k,label:v=>v,each:()=>'Yes!',
      miss:()=>'Say the line out loud. Does it sound right?',
      help:['Say each verse out loud.','The last line rhymes with “I”.','Leaves hang trembling. Trees bow. Passing by.'],
      onPlace:(v,k,chip,t)=>{t.textContent=v;},yes:'Lovely! Say it once more, out loud.',ms:1800});
    await drag({item:'log-sort',concept:'Kinds of wind',targets:'#tray .sorts .drop',
      say:'Last job: match each wind to its picture.',
      trayHead:`<div class="sorts"><div class="drop" data-t="trade">${SORT_TRADE}<b></b></div><div class="drop" data-t="monsoon">${SORT_MONSOON}<b></b></div><div class="drop" data-t="breeze">${SORT_BREEZE}<b></b></div></div><div style="height:10px"></div>`,
      chips:[{v:'trade',label:'trade winds'},{v:'monsoon',label:'monsoon'},{v:'breeze',label:'sea breeze'}],
      fits:(v,k)=>v===k,label:v=>v,each:()=>'Yes!',
      miss:v=>({trade:'Trade winds cross whole oceans.',monsoon:'The monsoon changes with the seasons.',breeze:'A sea breeze blows onto a hot beach.'})[v],
      help:['Look for the ocean, the season clock and the beach.','The clock means the wind changes with the seasons.','Ocean: trade winds. Clock: monsoon. Beach: sea breeze.'],
      onPlace:(v,k,chip,t)=>{t.querySelector('b').textContent=chip.textContent.trim();},yes:'A real wind reader!'});
    ending();
  })();
}
function ending(){
  runId++;toTop();pips(-1);
  main.innerHTML=`<section class="panel"><div class="phead"><h2>The voyage is over</h2></div>
    <div class="sw">${HOMEPORT}</div>
    <div class="bubble"><span class="who">${NUTMEG}</span><p>Thank you, wind reader. Purr.</p></div>
    <div class="tell"><h3>Tell a grown-up</h3><ul><li>Why does the wind blow? Start with “Because…”</li><li>Why did the Captain wait in India?</li></ul></div>
    <p style="margin:12px 0 0;font-weight:700">Write one line in the log, if you like.</p>
    <textarea id="note" maxlength="300" placeholder="We got home because..."></textarea>
    <div class="tell"><h3>Now go outside with a grown-up</h3>
      <div class="endgrid"><div>${I.poem}Say the poem</div><div>${I.leaves}Find 3 wind signs</div><div>${I.grass}Drop some grass. Where is the wind from?</div></div></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="go">Close the log</button></div></section>`;
  const NK=G.key('wind-reader-log');
  const ta=$('#note');try{ta.value=localStorage.getItem(NK)||'';}catch(e){}
  ta.oninput=()=>{try{localStorage.setItem(NK,ta.value);}catch(e){}G.write({prompt:'Captain’s log: We got home because',text:ta.value,game:GAME,part:'The captain’s log',area:'EN'});};
  finishPart(4);
  G.finish();
  $('#go').onclick=home;
}

/* ---------- grown-up controls ---------- */
function setEasy(){$('#easy').setAttribute('aria-pressed',S.easy?'true':'false');}
$('#easy').onclick=()=>{S.easy=!S.easy;save();setEasy();if(cur>=0)runPart(cur);};
$('#home').onclick=home;
let armed=false;
$('#reset').onclick=()=>{
  if(!armed){armed=true;$('#reset').textContent='Tap again to start again';setTimeout(()=>{armed=false;$('#reset').textContent='Start again';},4000);return;}
  armed=false;$('#reset').textContent='Start again';const e=S.easy;S=blank();S.easy=e;save();home();
};
setEasy();home();
