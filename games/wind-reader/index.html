<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>The Wind Reader</title>
<script src="../../results.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fraunces:opsz,wght@9..144,700&display=swap">
<style>
/* Aboard Captain Hale's ship: night-sea navy, parchment charts, lantern gold, Maeve's teal for every action */
:root{
  --bg:#10263a; --bg-deep:#091726; --glow:#f2c75c; --parch:#f8efdc; --parch-2:#e8d9b6; --parch-3:#d6c193;
  --ink:#2a2118; --muted:#6d5c44; --teal:#16A08F; --teal-deep:#0c6b5f; --wax:#a5302a; --rope:#b0864f;
  --ok:#2f7d4f; --ok-bg:#e1f1e2; --hmm-bg:#fbecd2; --clue-bg:#fff4d6; --on-dark:#f4ead6;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Andika","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:radial-gradient(ellipse at 90% -5%,rgba(242,199,92,.22),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(22,160,143,.14),transparent 50%);
  color:var(--on-dark);font-family:var(--body);font-size:1.15rem;line-height:1.45;min-height:100vh;-webkit-text-size-adjust:100%}
.wrap{max-width:1000px;margin:0 auto;padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
svg text{font-family:var(--body)}

.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;margin-bottom:18px;border-bottom:2px dashed rgba(242,199,92,.35)}
.brand h1{color:var(--glow);font-size:clamp(1.7rem,5.2vw,2.6rem);line-height:1.05}
.brand p{margin:.3rem 0 0;font-size:1rem;opacity:.85}
.status{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pips{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.pips li{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;border:2px solid var(--parch-3);color:var(--parch-3)}
.pips li.done{background:var(--teal);border-color:var(--teal);color:#fff}
.pips li.now{background:var(--glow);border-color:var(--glow);color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:8px;background:var(--bg-deep);border:2px solid var(--parch-3);border-radius:999px;padding:6px 14px;min-height:46px;cursor:pointer;font-size:.95rem}
.toggle .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--parch-3);display:grid;place-items:center}
.toggle[aria-pressed="true"]{border-color:var(--teal)}
.toggle[aria-pressed="true"] .box{background:var(--teal);border-color:var(--teal)}
.toggle[aria-pressed="true"] .box::after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px)}

.panel{background:var(--parch);color:var(--ink);border-radius:14px;padding:18px 20px;box-shadow:0 6px 0 var(--bg-deep)}
.panel h2{color:var(--wax);font-size:clamp(1.45rem,4.2vw,2rem);margin-bottom:8px}
.say{display:flex;gap:12px;align-items:flex-start;margin:0 0 4px}
.say .who{flex:none;width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;border:2px solid var(--rope)}
.say .who svg{width:38px;height:38px}
.say .text{flex:1}
.say p{margin:0;font-size:1.22rem;line-height:1.45;padding-top:6px}
.say p+p{margin-top:6px}
.btn{font-family:var(--body);font-weight:700;font-size:1.2rem;background:var(--teal);color:#fff;border:0;border-radius:999px;padding:.55em 1.4em;min-height:56px;cursor:pointer;box-shadow:0 4px 0 var(--teal-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-deep)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink),0 4px 0 var(--parch-3)}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
.hintbtn{background:var(--clue-bg);border:2px solid #E3BE5C;border-radius:999px;padding:6px 16px;min-height:46px;cursor:pointer;font-size:1rem;color:var(--ink)}
.hintbtn[disabled]{opacity:.5;cursor:default}
.ask{font-size:1.25rem;font-weight:700;margin:14px 0 0}
.tip{background:var(--clue-bg);border-radius:12px;padding:10px 14px;margin:10px 0 0;font-size:1.1rem}

.choices{display:grid;gap:12px;margin:12px 0 4px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.choices.wide{grid-template-columns:1fr}
.choice{background:#fff;border:3px solid var(--parch-2);border-radius:14px;padding:12px 16px;min-height:60px;font-size:1.18rem;color:var(--ink);text-align:left;cursor:pointer;box-shadow:0 4px 0 var(--parch-2);display:flex;align-items:center;gap:12px}
.choice:active:not([disabled]){transform:translateY(2px)}
.choice svg{flex:none;width:56px;height:56px}
.choice.yes{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok)}
.choice.no{opacity:.38;box-shadow:none;cursor:default}
.fb{border-radius:12px;margin:12px 0 0;scroll-margin-bottom:100px}
.fb:empty{display:none}
.fb.show{padding:12px 14px}
.fb.yes{background:var(--ok-bg)}
.fb.hmm{background:var(--hmm-bg)}
.fb.clue{background:var(--clue-bg)}
.fb p{margin:0;font-size:1.15rem}
.fb p+p{margin-top:6px}

.scene{background:#0b1c2c;border-radius:14px;padding:6px;margin-top:12px;box-shadow:inset 0 0 0 2px rgba(176,134,79,.45)}
.scene svg{display:block;width:100%;height:auto;border-radius:9px}
.scene.light{background:#fff;box-shadow:inset 0 0 0 2px var(--parch-2)}

/* home */
.letter{background:#fbf4e3;border:2px solid var(--parch-2);max-width:840px;margin-bottom:22px}
.letter .eyebrow{font-family:var(--display);color:var(--wax);font-size:1.3rem;margin:0 0 8px}
.letter p{margin:0 0 10px;font-size:1.2rem}
.note{font-size:.95rem;color:var(--muted);margin:10px 0 0}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.part{text-align:left;border:0;cursor:pointer;padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.part[disabled]{opacity:.45;cursor:default}
.part .n{font-family:var(--display);color:var(--wax);font-size:1.05rem}
.part h3{font-size:1.3rem;color:var(--ink)}
.part p{margin:0;font-size:1rem;color:var(--muted)}
.part .tag{margin-top:auto;font-size:.9rem;font-weight:700;color:var(--muted)}
.part.next{box-shadow:0 0 0 4px var(--glow),0 6px 0 var(--bg-deep)}
.part.next .tag{color:var(--teal-deep)}

/* the poem */
.poem{background:#fffaf0;border:2px solid var(--parch-2);border-radius:12px;padding:14px 18px;margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 28px}
.poem h3{grid-column:1/-1;color:var(--wax);font-size:1.35rem}
.poem p{margin:6px 0;font-size:1.3rem;line-height:1.55}
.poem .cite{grid-column:1/-1;font-size:.95rem;color:var(--muted);margin:2px 0 0}

/* harbour hunt */
.spot{cursor:pointer}
.spot .hit{fill:transparent;stroke:none}
.spot.got .hit{stroke:#16A08F;stroke-width:4;stroke-dasharray:8 5}
.spot.nope{cursor:default}
.spot.nope .hit{stroke:#8a7a62;stroke-width:2;stroke-dasharray:3 5}
.spot.ring .hit{stroke:#f2c75c;stroke-width:6}
.beads{display:flex;gap:8px;margin:10px 0 0;align-items:center;font-size:1rem;color:var(--muted)}
.beads i{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.beads i.on{background:var(--teal);border-color:var(--teal)}
.found{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.found li{background:var(--ok-bg);border:2px solid var(--ok);border-radius:12px;padding:8px 12px;font-size:1.02rem}
.found li b{display:block}

/* the chart scenes */
#gl .rays,#gl .warm,#gl .risebox,#gl .cool-s,#gl .cool-c,#gl .spinlbl{opacity:0;transition:opacity .6s}
#gl.lit .rays{opacity:1}
#gl.warmed .warm{opacity:1}
#gl.rising .risebox{opacity:1}
#gl.cool .cool-s{opacity:1}
#gl.curve .cool-s{opacity:0}
#gl.curve .cool-c{opacity:1}
#gl.spin .spinlbl{opacity:1}
#gl.spin .spinl{animation:spinl 1.6s linear infinite}
@keyframes spinl{from{transform:translateX(0)}to{transform:translateX(40px)}}
.tz{cursor:pointer}
#gl .tz.pick{fill:rgba(22,160,143,.35)}
#bc .heat,#bc .risebox,#bc .breeze-arr,#bc .flag-blow{opacity:0;transition:opacity .6s}
#bc.hot .heat{opacity:.35}
#bc.hot .risebox{opacity:1}
#bc.breeze .breeze-arr,#bc.breeze .flag-blow{opacity:1}
#bc.breeze .flag-limp{opacity:0}
#atl .routes,#atl .west,#atl .trade,#atl .storm{opacity:0;transition:opacity .6s}
#atl.routes-on .routes{opacity:1}
#atl.west-on .west{opacity:1}
#atl.trade-on .trade{opacity:1}
#atl.storm-on .storm{opacity:1}
#ara .wetw,#ara .dryw,#ara .rainl,#ara .storm{opacity:0;transition:opacity .6s}
#ara.wet .wetw{opacity:1}
#ara.dry .dryw{opacity:1}
#ara.rain.wet .rainl{opacity:1}
#ara.storm-on .storm{opacity:1}
.seasons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.seasons .btn.ghost[aria-pressed="true"]{background:#e9f7f5;box-shadow:inset 0 0 0 3px var(--teal),0 4px 0 var(--teal-deep)}
.seasons .btn{font-size:1.05rem;line-height:1.25;padding:.5em .8em}

/* gentle movement, all of it switched off for reduced motion */
.shiver{animation:shiver 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes shiver{50%{transform:rotate(-3deg)}}
.flap{animation:flap .8s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 50%}
@keyframes flap{50%{transform:scaleY(.82) skewY(5deg)}}
.drift{animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(20px)}to{transform:translateX(-30px)}}
.wave{animation:wave 2.2s ease-in-out infinite}
@keyframes wave{50%{transform:translateX(-10px)}}
.seed{animation:seed 4.5s linear infinite}
.seed.s2{animation-delay:1.5s}.seed.s3{animation-delay:3s}
@keyframes seed{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(-110px,-40px);opacity:0}}
.streak{animation:streak 1.6s ease-in-out infinite}
@keyframes streak{0%{transform:translateX(8px);opacity:.2}50%{opacity:1}100%{transform:translateX(-14px);opacity:.2}}
.rise{animation:rise 1.8s ease-in infinite}
.rise.r2{animation-delay:.6s}.rise.r3{animation-delay:1.2s}
@keyframes rise{0%{transform:translateY(6px);opacity:0}30%{opacity:1}100%{transform:translateY(-20px);opacity:0}}
.ccw{animation:ccw 3s linear infinite;transform-box:fill-box;transform-origin:center}
.cw{animation:cw 3s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes ccw{to{transform:rotate(-360deg)}}
@keyframes cw{to{transform:rotate(360deg)}}
.zz{animation:zz 2.4s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}40%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
@media (prefers-reduced-motion:reduce){.shiver,.flap,.drift,.wave,.seed,.streak,.rise,.ccw,.cw,.zz,#gl.spin .spinl{animation:none}}

/* cards */
.story{background:#fffaf0;border:3px double var(--rope);border-radius:12px;padding:16px 18px 12px;margin-top:14px;position:relative}
.story .ribbon{position:absolute;top:-14px;left:16px;background:var(--wax);color:#fff;font-weight:700;font-size:.9rem;padding:3px 12px;border-radius:999px}
.story h3{color:var(--wax);font-size:1.3rem;margin:4px 0 8px}
.story p{margin:0 0 8px;font-size:1.15rem}
.namecard{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px 16px;box-shadow:4px 4px 0 var(--parch-3)}
.namecard h3{font-size:1.25rem;color:var(--wax);margin-bottom:6px}
.namecard ul{margin:0;padding-left:1.2em}
.namecard li{font-size:1.15rem}
.namecard li+li{margin-top:4px}
.fb .namecard p,.fb .namecard li{font-size:1.15rem}

/* the log */
.answer{background:#fff;border-left:6px solid var(--teal);border-radius:8px;padding:10px 14px;margin-top:10px}
.tell{background:#fff;border:2px solid var(--parch-2);border-radius:12px;padding:12px 14px;margin-top:12px}
.tell h3{color:var(--wax);font-size:1.25rem;margin-bottom:6px}
.tell ul{margin:0;padding-left:1.2em}
.tell li+li{margin-top:6px}
textarea{width:100%;min-height:80px;font:inherit;font-size:1.15rem;border:2px solid var(--parch-3);border-radius:12px;padding:10px;background:#fff;color:var(--ink)}

.grown{margin-top:30px;padding-top:14px;border-top:2px dashed rgba(244,234,214,.25);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.95rem;opacity:.85}
.grown button{background:transparent;border:2px solid rgba(244,234,214,.5);border-radius:999px;padding:6px 14px;min-height:44px;cursor:pointer;font-size:.95rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>The Wind Reader</h1><p>Aboard Captain Hale’s ship</p></div>
    <div class="status">
      <ol class="pips" id="pips" aria-label="Parts"></ol>
      <button class="toggle" id="easy" aria-pressed="false"><span class="box"></span>Calm seas (easier)</button>
    </div>
  </header>
  <main id="main"></main>
  <footer class="grown">
    <span>Your place is saved after each part. You can stop any time.</span>
    <button id="home">Contents</button>
    <button id="reset">Start again</button>
  </footer>
</div>
<script>
'use strict';
const G=window.GR||{player:()=>'unknown',key:k=>k,start(){},part(){},partDone(){},finish(){},ask(){return {miss(){},hint(){},done(){},giveUp(){},missed:()=>0};},write(){}};
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const GAME='wind-reader';
const RM=(()=>{try{return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}})();
const main=$('#main');
let runId=0;
const sleep=ms=>{const r=runId;return new Promise(res=>setTimeout(()=>{if(r===runId)res();},ms));};
function toTop(){try{window.scrollTo({top:0,behavior:'auto'});}catch(e){window.scrollTo(0,0);}}

/* ---------- saved progress, separate for each girl ---------- */
const KEY=G.key('wind-reader-v1');
function blank(){return {done:[],easy:false};}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&Array.isArray(v.done))return Object.assign(blank(),v);}catch(e){}return blank();}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- pictures ---------- */
const NUTMEG='<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 15L9 3l9 8zM33 15L31 3l-9 8z" fill="#e08a3c"/><path d="M10 13l1-6 4 4zM30 13l-1-6-4 4z" fill="#f6c7a0"/><circle cx="20" cy="22" r="14" fill="#e08a3c"/><path d="M14 12q2 3 0 6M20 10v6M26 12q-2 3 0 6" stroke="#b35f1d" stroke-width="1.8" fill="none" stroke-linecap="round"/><ellipse cx="14.5" cy="22" rx="2.2" ry="3" fill="#1d1a14"/><ellipse cx="25.5" cy="22" rx="2.2" ry="3" fill="#1d1a14"/><circle cx="15.2" cy="21" r=".8" fill="#fff"/><circle cx="26.2" cy="21" r=".8" fill="#fff"/><path d="M18.6 27h2.8l-1.4 1.8z" fill="#d6577a"/><path d="M20 28.8v1.2M20 30q-2.2 1.8-4 .2M20 30q2.2 1.8 4 .2" stroke="#1d1a14" stroke-width="1.1" fill="none" stroke-linecap="round"/><path d="M4 25l8 1M4 29l8-1M36 25l-8 1M36 29l-8-1" stroke="#fff" stroke-width="1" stroke-linecap="round"/></svg>';
/* a little ship, bow to the right, centred on its waterline */
const SHIP='<path d="M-18 0h36l-6 10h-24z" fill="#6b4a2b" stroke="#3e2a16" stroke-width="1.2"/><path d="M0 0v-30" stroke="#3e2a16" stroke-width="2.4"/><path d="M1-28v24h14z" fill="#f8efdc" stroke="#8a7a62" stroke-width="1"/><path d="M-1-24v20h-12z" fill="#f8efdc" stroke="#8a7a62" stroke-width="1"/><path d="M0-30l-8-2.5 8-2.5z" fill="#a5302a"/>';
const STORM='<g><circle r="22" fill="#e8eef5" opacity=".92"/><path d="M0 0m-15 0a15 15 0 1 1 15 15M0 0m7 0a7 7 0 1 0-7-7" stroke="#4d5d70" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>';
const MINIGLOBE='<svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="40" cy="28" r="14" fill="#3f7fae"/><path d="M26 28h28" stroke="#fff" stroke-dasharray="3 2"/><circle cx="9" cy="28" r="6" fill="#f6c430"/><path d="M16 22h10M16 28h10M16 34h10" stroke="#f6c430" stroke-width="1.5"/></svg>';
const MINIBEACH='<svg viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" rx="8" fill="#cfe6f5"/><circle cx="28" cy="12" r="6" fill="#f6c430"/><path d="M0 34h28v22H0z" fill="#3f7fae"/><path d="M26 34q2-3 6-3h24v25H26z" fill="#e3c98d"/><path d="M40 31V14" stroke="#3e2a16" stroke-width="1.5"/><path d="M40 15h8l-2 2 2 2h-8z" fill="#a5302a"/></svg>';

function marker(id,col){return `<marker id="${id}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="${col}"/></marker>`;}

const SIGNS={
  leaves:{ok:1,name:'Trembling leaves',line:'“When the leaves hang trembling, the wind is passing through.”'},
  bow:{ok:1,name:'A bowing tree',line:'“When the trees bow down their heads, the wind is passing by.”'},
  flag:{ok:1,name:'The flag',line:'The wind pushes the flag out sideways.'},
  clouds:{ok:1,name:'Racing clouds',line:'The wind carries the clouds across the sky.'},
  waves:{ok:1,name:'Waves',line:'The wind stirs up the waves on the sea.'},
  seeds:{ok:1,name:'Flying seeds',line:'The wind carries seeds across the land, so plants can grow in new places.'},
  sand:{ok:1,name:'Blowing sand',line:'The wind lifts grains of sand. Over a long time it can build great sand dunes.'},
  sun:{ok:0,name:'The sun',line:'The sun shines whether the wind blows or not. Look for something that is being moved.'},
  light:{ok:0,name:'The lighthouse',line:'The lighthouse stands still, wind or no wind. Look for something that is being pushed.'},
  crab:{ok:0,name:'The crab',line:'The crab is just walking along its rock. Look for something the wind is moving.'}
};
const HARBOUR=`<svg id="hb" viewBox="0 0 600 340" role="img" aria-label="A windy harbour with a ship">
  <rect width="600" height="230" fill="#cfe6f5"/>
  <rect y="215" width="600" height="125" fill="#3f7fae"/>
  <g class="spot" data-k="sun"><circle cx="420" cy="55" r="22" fill="#f6c430"/><g stroke="#f6c430" stroke-width="3" stroke-linecap="round"><path d="M420 22v-8M420 88v8M387 55h-8M453 55h8M397 32l-6-6M443 78l6 6M443 32l6-6M397 78l-6 6"/></g><rect class="hit" x="380" y="12" width="80" height="86" rx="12"/></g>

/* ---------- small building blocks ---------- */
function sayHTML(lines){return `<div class="say"><span class="who">${NUTMEG}</span><div class="text">${[].concat(lines).map(p=>`<p>${p}</p>`).join('')}</div></div>`;}
function panel(o){
  toTop();
  main.innerHTML=`<section class="panel">${o.title?`<h2>${o.title}</h2>`:''}<div id="say">${o.say?sayHTML(o.say):''}</div>${o.body||''}<div id="act"></div><div class="fb" id="fb" aria-live="polite"></div></section>`;
}
function say(lines){const s=$('#say');if(s)s.innerHTML=sayHTML(lines);}
function goBtn(label,id){return `<div class="row"><button class="btn" id="${id||'go'}">${label}</button></div>`;}
function click(sel){return new Promise(res=>{const b=$(sel);if(b)b.onclick=()=>res();});}
function seen(el){try{el.scrollIntoView({block:'nearest',behavior:'auto'});}catch(e){}}
function fb(kind,html){const f=$('#fb');if(!f)return;f.className='fb show '+kind;f.innerHTML=[].concat(html).map(p=>p.trim().startsWith('<div')?p:`<p>${p}</p>`).join('');seen(f);}
function fbClear(){const f=$('#fb');if(f){f.className='fb';f.innerHTML='';}}
function rightThenGo(why,label){
  return new Promise(res=>{const f=$('#fb');f.className='fb show yes';f.innerHTML=`<p><b>Yes.</b> ${why||''}</p>`+goBtn(label||'Go on','go2');$('#go2').onclick=()=>{fbClear();res();};seen(f);});
}
function note(html,label){
  return new Promise(res=>{$('#act').innerHTML='';const f=$('#fb');f.className='fb show clue';f.innerHTML=[].concat(html).map(p=>p.trim().startsWith('<div')?p:`<p>${p}</p>`).join('')+goBtn(label||'Go on','go2');$('#go2').onclick=()=>{fbClear();res();};seen(f);});
}
function story(c){
  return new Promise(res=>{fbClear();$('#act').innerHTML=`<div class="story"><span class="ribbon">True story</span><h3>${c.title}</h3>${c.ps.map(p=>`<p>${p}</p>`).join('')}</div>${goBtn(c.go||'Go on','sgo')}`;seen($('#act .story'));$('#sgo').onclick=()=>res();});
}
function helpRow(){return '<div class="row"><button class="hintbtn" id="help">Help, please</button></div>';}
/* help in three levels: a reminder, a focused hint, then a worked example.
   In calm seas the reminder is already on screen, so the button starts at the hint. */
function wireHelp(levels,q,extra,start){
  const b=$('#help');if(!b||!levels)return;let n=start||0;
  b.onclick=()=>{if(n>=levels.length)return;q&&q.hint();fb('clue',`<b>${['Remember','Hint','Example'][n]}:</b> ${levels[n]}`);if(extra)extra(n);n++;b.textContent=n>=levels.length?'No more help':'More help';if(n>=levels.length)b.disabled=true;};
}
function tipHTML(help){return S.easy&&help&&help[0]?`<p class="tip"><b>Nutmeg’s tip:</b> ${help[0]}</p>`:'';}
/* a question with buttons, drawn under whatever is already on screen */
function choose(o){
  return new Promise(res=>{
    const isRight=v=>o.isRight?o.isRight(v):v===o.answer;
    let opts=o.options.slice();
    if(S.easy&&opts.length>2){
      const right=opts.filter(op=>isRight(op.v)).slice(0,1);
      const wrong=opts.filter(op=>!isRight(op.v));
      const pick=wrong.filter(op=>op.v===o.easyWrong);
      opts=right.concat(pick.length?pick:wrong.slice(0,1));
    }
    if(!o.keep)opts=shuffle(opts);
    $('#act').innerHTML=`${o.ask?`<p class="ask">${o.ask}</p>`:''}${tipHTML(o.help)}<div class="choices ${o.wide?'wide':''}">${opts.map((op,i)=>`<button class="choice" data-i="${i}">${op.html||''}<span>${op.label}</span></button>`).join('')}</div>${o.help?helpRow():''}`;
    fbClear();
    const q=o.concept?G.ask({item:o.item+(S.easy?'-calm':''),concept:o.concept,area:o.area||'SC'}):null;

        locked=true;q&&q.done();b.classList.add('yes');$$('#act .choice').forEach(x=>{if(x!==b)x.disabled=true;});const h=$('#help');if(h)h.disabled=true;
        if(o.onRight)o.onRight(op.v);
        if(o.quick){await sleep(700);res(op.v);}else{await rightThenGo(typeof o.why==='function'?o.why(op.v):o.why,o.go);res(op.v);}
      }else{

/* tap a place on a picture to answer */
function tapAsk(o){
  return new Promise(res=>{
    $('#act').innerHTML=`<p class="ask">${o.ask}</p>${tipHTML(o.help)}${helpRow()}`;

      if(locked)return;const k=z.dataset.z;
      if(k===o.answer){locked=true;q.done();z.classList.add('pick');const h=$('#help');if(h)h.disabled=true;if(o.onRight)o.onRight();await rightThenGo(o.why);res();}

/* move a ship along a path; flip turns its bow to face west */
function sail(ship,path,from,to,ms,flip){
  return new Promise(res=>{
    const L=path.getTotalLength();
    const place=f=>{const p=path.getPointAtLength(L*f);ship.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})${flip?' scale(-1 1)':''}`);};
    if(RM||!ms){place(to);res();return;}
    const r=runId,t0=performance.now();
    const step=t=>{if(r!==runId)return;const k=Math.min(1,(t-t0)/ms);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;place(from+(to-from)*e);if(k<1)requestAnimationFrame(step);else res();};
    requestAnimationFrame(step);
  });
}

/* ===================== Part 1: who has seen the wind? ===================== */

async function harbour(){
  const need=S.easy?3:5;

    body:`<div class="scene">${HARBOUR}</div><div class="beads" id="beads">${'<i></i>'.repeat(need)}</div><ul class="found" id="found"></ul>`});
  const q=G.ask({item:'harbour-signs'+(S.easy?'-calm':''),concept:'Signs of the wind',area:'SC'});
  $('#act').innerHTML=tipHTML(['Look for something that is being moved or pushed.'])+helpRow();
  wireHelp(['Look for something that is being moved or pushed.','Look at the tops of the trees, and at the little flag at the top of the ship’s mast.','The flag is streaming out sideways, because the wind is pushing it. Can you find more things like that?'],q,n=>{if(n===2){const f=$('#hb [data-k="flag"]');if(f&&!f.classList.contains('got'))f.classList.add('ring');}},S.easy?1:0);
  let got=0;const tapped={};
  await new Promise(res=>{$$('#hb .spot').forEach(g=>g.addEventListener('click',()=>{
    const k=g.dataset.k;if(tapped[k]||got>=need)return;tapped[k]=1;

      got++;g.classList.add('got');g.classList.remove('ring');
      const li=document.createElement('li');li.className='got';const b=document.createElement('b');b.textContent=s.name;li.appendChild(b);li.appendChild(document.createTextNode(s.line));$('#found').appendChild(li);

  await sleep(900);

  await choose({item:'harbour-from',concept:'A wind is named for where it comes from',keep:true,ask:'The flag is being blown towards the west. Where is the wind coming <i>from</i>?',
    options:['North','East','South','West'].map(d=>({v:d,label:d})),answer:'East',easyWrong:'West',
    help:['A wind is named for the place it comes from, not the place it’s going.','The flag points the way the wind is going: west. The wind must be coming from the opposite side.','West is on the left of the compass. The opposite of west is east. So the wind is coming from the east.'],

    why:'It’s coming from the east, so sailors call it an <b>east wind</b>. A wind is always named for where it comes from.'});
  finishPart(0);

/* ===================== Part 2: the wind engine ===================== */
function partEngine(){
  const st={globe:false,beach:false};
  function pick(){

    $('#act').innerHTML=`<div class="choices">${['globe','beach'].map(k=>`<button class="choice" data-k="${k}" ${st[k]?'disabled':''}>${k==='globe'?MINIGLOBE:MINIBEACH}<span>${k==='globe'?'The whole Earth':'A day at the beach'}${st[k]?' (done)':''}</span></button>`).join('')}</div>`;
    return new Promise(res=>$$('#act .choice').forEach(b=>b.onclick=()=>{if(!b.disabled)res(b.dataset.k);}));
  }
  (async()=>{
    while(!(st.globe&&st.beach)){const k=await pick();if(k==='globe')await globe();else await beach();st[k]=true;}
    finishPart(1);

  })();
}

      miss:v=>v==='dry'?'A dry wind comes from dry land. This one has blown across the sea. Wet or dry?':'This wind has crossed a warm sea, not snowy mountains. Will it bring snow?',
      why:'A wind from the sea brings rain. This is the <b>monsoon</b>, and in this season it brings India heavy rain.',onRight:()=>ara.classList.add('rain')});
    await choose({item:'monsoon-certain',concept:'Certain or only likely',area:'MA',ask:'The rice farmers of Calicut ask the Captain: “Will the rains start on exactly the first of June next year?”',wide:true,
      options:[{v:'cert',label:'Certain. They always start on the first of June.'},{v:'likely',label:'Likely around then, but not always on that exact day.'},{v:'imp',label:'Impossible. The rains will never come again.'}],answer:'likely',easyWrong:'cert',
      help:['Can anyone promise the weather?','The monsoon comes every year, so people plan for it. But does it come on exactly the same day each year?','The rains usually start around the beginning of June. Some years they come a week early or a week late. So it’s likely, not certain.'],
      miss:v=>v==='cert'?'Could the rains come a few days early, or a few days late? If they could, is it certain?':'The monsoon comes back every year. People plan their farming around it.',
      why:'Likely, not certain. Here the rains usually start around the beginning of June, but some years they’re a week early or a week late.'});
    say(['The monsoon wind changes with the seasons. Tap each season to see which way its wind blows.']);
    fbClear();$('#act').innerHTML='';
    $('#seasonsBox').innerHTML=`<div class="seasons"><button class="btn ghost" data-s="wet" aria-pressed="true">Wet season<br><small>about June to September</small></button><button class="btn ghost" data-s="dry" aria-pressed="false">Dry season<br><small>about November to February</small></button></div>`;
    const looked={wet:true,dry:false};
    const setSeason=s=>{ara.classList.toggle('wet',s==='wet');ara.classList.toggle('dry',s==='dry');$$('.seasons .btn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===s?'true':'false'));};
    await new Promise(res=>$$('.seasons .btn').forEach(b=>b.onclick=()=>{setSeason(b.dataset.s);looked[b.dataset.s]=true;if(looked.wet&&looked.dry)res();}));
    await sleep(700);
    await choose({item:'monsoon-which-season',concept:'Monsoon winds change with the seasons',area:'HSS',ask:'Which season’s wind will carry us west to Africa?',
      options:[{v:'wet',label:'The wet-season wind'},{v:'dry',label:'The dry-season wind'}],answer:'dry',
      help:['Tap each season again and watch the arrows.','We want a wind that blows from India towards Africa.','In the dry season, the wind blows from the land, out to sea, towards Africa. That’s our wind.'],
      miss:()=>'In the wet season, the wind blows towards India. We want to go the other way.',
      why:'The dry-season wind. The wind turns right round and blows from the land, out to sea, towards Africa. So the Captain waits in Calicut until the wind turns.',
      onRight:()=>{setSeason('dry');$$('.seasons .btn').forEach(b=>b.disabled=true);}});
    $('#seasonsBox').innerHTML='';
    say(['The months pass. In November the wind turns, and we set sail for Africa.']);
    $('#act').innerHTML='';
    await sail(ship,pH,0,.5,2800,true);
    ara.classList.add('storm-on');
    await choose({item:'monsoon-storm-name',concept:'Storm names by place',area:'HSS',ask:'Far to the south, another great circling storm! We’re in the Indian Ocean now. What do sailors here call it?',
      options:[{v:'h',label:'A hurricane'},{v:'t',label:'A typhoon'},{v:'c',label:'A cyclone'}],answer:'c',easyWrong:'h',
      help:['Remember the card from the Atlantic: one storm, three names.','Hurricanes are in the Atlantic. Typhoons are in the Pacific, near Asia. What about the Indian Ocean?','In the Indian Ocean, and near Australia, it’s called a cyclone.'],
      miss:v=>v==='h'?'Hurricanes are in the Atlantic Ocean. We’re in the Indian Ocean now.':'Typhoons are in the Pacific Ocean, near Asia. We’re in the Indian Ocean now.',
      why:'In the Indian Ocean, it’s a <b>cyclone</b>.'});
    $('#act').innerHTML='';
    await sail(ship,pH,.5,1,2400,true);
    say(['Land ho! Africa! The dry-season wind carried us all the way.']);
    await story({title:'Vasco da Gama and the monsoon, 1498',ps:[
      'In 1498, the Portuguese explorer Vasco da Gama sailed from Malindi, in Africa, to Calicut, in India. A pilot from Malindi who knew the winds showed him the way. With the monsoon wind behind his ships, the crossing took about three and a half weeks.',
      'But he set off for home before the wind had turned. Sailing against it, the crossing back to Africa took more than three months, and many of his sailors fell very sick.',
      'Sailors from India, Arabia and Africa had used the monsoon for hundreds of years before him. They knew to wait for the wind.']});
    finishPart(3);
    afterPart(3,'<b>Part 4 done.</b> Monsoon winds change direction with the seasons. A wind from the sea brings rain. A wise captain waits for the wind to turn.');
  })();
}

/* ===================== Part 5: the captain's log ===================== */
function partLog(){
  panel({title:'The captain’s log',say:['We’re home, safe and sound! Before the Captain writes up the voyage, two last questions for the wind reader.'],body:`<div class="scene">${HOMEPORT}</div>`});
  (async()=>{
    await choose({item:'log-queensland',concept:'Storm names by place',area:'HSS',ask:'Back home in Australia, a great circling storm is spinning in the sea off Queensland. What do we call it here?',
      options:[{v:'h',label:'A hurricane'},{v:'t',label:'A typhoon'},{v:'c',label:'A cyclone'}],answer:'c',easyWrong:'t',
      help:['Same storm, three names. Which name goes with Australia?','Hurricanes are in the Atlantic. Typhoons are near Asia.','Near Australia, it’s called a cyclone. You may hear about cyclones on the news in summer.'],
      miss:v=>v==='h'?'Hurricanes are in the Atlantic, on the other side of the world.':'Typhoons are in the Pacific near Asia, further north than us.',
      why:'Near Australia it’s a <b>cyclone</b>. You may hear about cyclones on the news in summer.'});
    await choose({item:'log-poem',concept:'Who Has Seen the Wind? (memory work)',area:'EN',ask:'Finish the line from the poem: “But when the trees bow down their heads, the wind is …”',
      options:[{v:'by',label:'passing by'},{v:'asleep',label:'fast asleep'},{v:'high',label:'up so high'}],answer:'by',easyWrong:'asleep',
      help:['It’s the last line of the second verse.','The first verse ends “The wind is passing through.” The second verse ends with a word that rhymes with “I”.','“The wind is passing by.”'],
      miss:()=>'Say the second verse out loud. The last word rhymes with “I”, and the line sounds a lot like the end of the first verse.',
      why:'“The wind is passing by.” Can you say the whole first verse without looking?'});
    ending();
  })();
}
async function ending(){
  runId++;toTop();pips(-1);
  main.innerHTML=`<section class="panel"><h2>The voyage is over</h2>
    <div class="scene">${HOMEPORT}</div>
    ${sayHTML(['Thank you, wind reader. The Captain says he’s never had a better one. Purr.'])}
    <div class="answer"><b>How a wind reader finds a wind nobody can see:</b> watch what it moves, name it by where it comes from, and know which winds blow where, and when.</div>
    <div class="answer"><b>Why the wind blows:</b> the Sun warms some places more than others. Warm air rises, and cooler air moves in to take its place. Because the Earth spins, the winds curve.</div>
    <div class="tell"><h3>Tell a grown-up</h3><ul>
      <li>Why does the wind blow? Start your answer with “Because…”</li>
      <li>Why did Captain Hale have to wait in Calicut?</li>
      <li>A question for another day: at the beach at night, when the land cools down, which way do you think the breeze blows?</li></ul></div>
    <p style="margin:14px 0 6px">If you like, write one line in the captain’s log.</p>
    <textarea id="note" maxlength="300" placeholder="We got home because..."></textarea>
    <div class="tell"><h3>Now put the iPad away</h3><p style="margin:0">Go outside with a grown-up. Say the first verse of “Who Has Seen the Wind?”. Find three signs that the wind is passing through. Then drop a pinch of grass: which way is the wind coming from? What do you think it might bring?</p></div>
    ${goBtn('Close the log')}</section>`;
  const NK=G.key('wind-reader-log');
  const ta=$('#note');try{ta.value=localStorage.getItem(NK)||'';}catch(e){}
  ta.oninput=()=>{try{localStorage.setItem(NK,ta.value);}catch(e){}G.write({prompt:'Captain’s log: We got home because',text:ta.value,game:GAME,part:'The captain’s log',area:'EN'});};
  finishPart(4);
  G.finish();
  await click('#go');home();
}

function setEasy(){$('#easy').setAttribute('aria-pressed',S.easy?'true':'false');}
$('#easy').onclick=()=>{S.easy=!S.easy;save();setEasy();if(cur>=0)runPart(cur);};
$('#home').onclick=home;
let armed=false;
$('#reset').onclick=()=>{
  if(!armed){armed=true;$('#reset').textContent='Tap again to start again';setTimeout(()=>{armed=false;$('#reset').textContent='Start again';},4000);return;}
  armed=false;$('#reset').textContent='Start again';const e=S.easy;S=blank();S.easy=e;save();home();
};
setEasy();home();
