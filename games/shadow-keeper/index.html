<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Shadow Keeper of Misselthwaite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --shade:#14261f;--panel:#f2f5ee;--ink:#16231c;--ink-soft:#4a5a50;
  --sun:#e0a93b;--violet:#4c4677;--moss:#6f8f6a;--clay:#a8523f;--rule:#cdd6c6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--shade);color:var(--ink);
  font-family:"Newsreader",Georgia,serif;font-size:19px;line-height:1.6;
  -webkit-text-size-adjust:100%;transition:background-color 1.2s ease;
}
body[data-time="dawn"]{background:#141e2c}
body[data-time="noon"]{background:#1d3327}
body[data-time="afternoon"]{background:#2a2740}
body[data-time="dusk"]{background:#241a22}

#title{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px 24px;text-align:center;color:#eef3e9}
#gnomon{width:min(320px,70vw);height:auto;margin-bottom:8px}
#title h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:clamp(30px,7vw,52px);line-height:1.05;margin:0 0 14px}
#title p{max-width:36ch;margin:0 auto 28px;color:#c3cfc0}
.begin{font-family:"Newsreader",serif;font-size:20px;background:var(--sun);color:#20180a;border:none;padding:16px 34px;border-radius:2px;min-height:56px;cursor:pointer}

#frame{display:none;max-width:720px;margin:0 auto;padding:0 14px 130px}
header.bar{position:sticky;top:0;z-index:5;background:rgba(20,38,31,.93);backdrop-filter:blur(6px);margin:0 -14px 18px;padding:9px 14px 11px;display:flex;align-items:center;gap:12px}
button.back{font-family:"Newsreader",serif;font-size:17px;background:transparent;color:#dfe7da;border:1.5px solid #56655a;border-radius:2px;padding:8px 14px;min-height:44px;cursor:pointer}
button.back:disabled{opacity:.3;cursor:default}
.chapline{color:#dfe7da;font-size:15px;line-height:1.25}
.chapline b{display:block;font-weight:400;color:var(--sun);font-size:13px}
.tokens{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;max-width:152px;justify-content:flex-end}
.tok{width:13px;height:13px;border-radius:50%;border:1.5px solid #7d8d80;transition:all .4s ease}
.tok.on{background:var(--sun);border-color:var(--sun)}

.card{background:var(--panel);border-radius:3px;padding:26px 24px 28px;margin:0 0 18px;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.card h2{font-family:"Fraunces",serif;font-weight:600;font-size:26px;line-height:1.15;margin:0 0 14px}
.card p{margin:0 0 16px;max-width:62ch}
.card p:last-child{margin-bottom:0}
.where{font-size:17px;color:var(--ink-soft);border-left:3px solid var(--rule);padding-left:14px;margin:0 0 20px}

.said{border-left:3px solid var(--rule);padding:2px 0 2px 16px;margin:0 0 18px}
.said .who{font-size:15px;color:var(--ink-soft);display:block;margin-bottom:2px}
.said.colin{border-color:var(--sun)}
.said.colin .who{color:#8a6c1c}
.said.mary{border-color:var(--violet)}
.said.mary .who{color:var(--violet)}
.said p{margin:0 0 8px;max-width:60ch}
.said p:last-child{margin:0}

.record{background:#fff;border:1px solid var(--rule);border-radius:2px;padding:16px 18px;margin:0 0 18px}
.record .cap{font-size:15px;color:var(--ink-soft);font-style:italic;margin:0 0 10px}

.q{font-size:20px;margin:22px 0 14px;max-width:60ch}
.opts{display:flex;flex-direction:column;gap:10px}
button.opt{font-family:"Newsreader",serif;font-size:18px;line-height:1.45;text-align:left;background:#fff;border:1.5px solid var(--rule);border-radius:2px;padding:15px 17px;min-height:56px;cursor:pointer;color:var(--ink)}
button.opt:active{background:#f6f8f3}
button.opt.sel{border-color:var(--moss);background:#eef3ea}
button.opt.right{border-color:var(--moss);background:#e6efe2}
button.opt.wrong{border-color:var(--clay);background:#f7ece9}
button.opt:disabled{cursor:default;opacity:.72}
button.opt.right:disabled,button.opt.wrong:disabled{opacity:1}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}

.act{font-family:"Newsreader",serif;font-size:19px;background:var(--ink);color:#f2f5ee;border:none;border-radius:2px;padding:15px 28px;min-height:54px;cursor:pointer;margin-top:20px}
.act.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.act:disabled{opacity:.35;cursor:default}
.note{margin-top:18px;padding:14px 16px;border-radius:2px;font-size:18px;background:#eef3ea;border-left:3px solid var(--moss)}
.note.bad{background:#f7ece9;border-left-color:var(--clay)}

.slots{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:64px;border-bottom:2px solid var(--rule);padding:10px 4px;margin-bottom:16px;font-family:"Fraunces",serif;font-size:26px}
.slots .empty{color:#a9b4a6;font-family:"Newsreader",serif;font-size:17px;font-style:italic}
.chipline{display:flex;gap:9px;flex-wrap:wrap}
button.chip{font-family:"Fraunces",serif;font-size:20px;background:#fff;border:1.5px solid var(--rule);border-radius:2px;padding:11px 16px;min-height:48px;cursor:pointer;color:var(--ink)}
button.chip.used{opacity:.3}
.builtpart{background:#eef3ea;border-radius:2px;padding:2px 8px}

.field{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.field label{font-size:18px;min-width:220px}
input[type=number],input[type=text]{font-family:"Newsreader",serif;font-size:19px;border:1.5px solid var(--rule);border-radius:2px;background:#fff;padding:11px 12px;width:110px;min-height:48px;color:var(--ink)}
input:focus,button:focus-visible,select:focus,textarea:focus{outline:2.5px solid var(--sun);outline-offset:2px}
textarea{font-family:"Newsreader",serif;font-size:19px;line-height:1.6;width:100%;min-height:210px;padding:14px;border:1.5px solid var(--rule);border-radius:2px;background:#fff;color:var(--ink)}
select{font-family:"Newsreader",serif;font-size:18px;padding:12px;min-height:48px;border:1.5px solid var(--rule);border-radius:2px;background:#fff;color:var(--ink)}
table.grid{border-collapse:collapse;width:100%;font-size:17px}
table.grid th,table.grid td{border:1px solid var(--rule);padding:9px 10px;text-align:left}
table.grid th{font-weight:600;background:#e9eee4}
.tallies{letter-spacing:2px;font-size:19px}
.wordcount{font-size:16px;color:var(--ink-soft);margin-top:8px}
svg .ax{stroke:var(--ink);stroke-width:1.5;fill:none}
svg .gl{stroke:#d7ddd2;stroke-width:1}
svg text{font-family:"Newsreader",serif;font-size:13px;fill:var(--ink)}
.letter{font-size:20px;line-height:1.75}
.letter p{margin:0 0 14px}
.sig{font-family:"Fraunces",serif;font-size:22px}
.audit{border-top:1px solid var(--rule);margin-top:18px;padding-top:6px}
.audit .row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #e2e8dd;font-size:17px}
.audit .mk{font-size:20px;line-height:1.2}
.audit .mk.y{color:var(--moss)}
.audit .mk.n{color:var(--clay)}
.audit .det{font-size:16px;color:var(--ink-soft);margin-top:4px}
@media print{body{background:#fff}header.bar,.act{display:none}.card{box-shadow:none;border:1px solid #ccc}}
@media (max-width:520px){body{font-size:18px}.card{padding:22px 18px 24px}.field label{min-width:100%}}
</style>
</head>
<body data-time="dawn">

<section id="title">
  <svg id="gnomon" viewBox="0 0 320 190" aria-hidden="true">
    <defs><linearGradient id="shg" x1="0" x2="1"><stop offset="0" stop-color="#4c4677" stop-opacity=".95"/><stop offset="1" stop-color="#4c4677" stop-opacity="0"/></linearGradient></defs>
    <circle cx="252" cy="46" r="21" fill="#e0a93b" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.2s" fill="freeze"/></circle>
    <line x1="40" y1="150" x2="290" y2="150" stroke="#7d8d80" stroke-width="1.5"/>
    <polygon points="40,150 40,58 100,150" fill="#eef3e9"/>
    <polygon points="40,150 100,150 40,150" fill="url(#shg)"><animate attributeName="points" from="40,150 100,150 40,150" to="40,150 236,150 40,150" dur="1.6s" begin="0.7s" fill="freeze"/></polygon>
  </svg>
  <h1>The Shadow Keeper<br>of Misselthwaite</h1>
  <p>Colin has been outside for a week. He writes down everything he sees, and some of it is wrong. Twelve pages. You decide who is right.</p>
  <button class="begin" id="beginBtn">Take up the record</button>
</section>

<div id="frame">
  <header class="bar">
    <button class="back" id="backBtn">Back</button>
    <span class="chapline" id="chapline"></span>
    <div class="tokens" id="tokens"></div>
  </header>
  <main id="stage"></main>
</div>

<script>
(function(){
"use strict";

var PAGES=[];
var S={p:0,done:{},audit:{},data:{}};
var stage=document.getElementById("stage");
var chapline=document.getElementById("chapline");
var tokbox=document.getElementById("tokens");
var backBtn=document.getElementById("backBtn");

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function card(title){var c=el("div","card");if(title)c.appendChild(el("h2",null,title));return c;}
function where(c,text){c.appendChild(el("p","where",text));}
function said(who,cls,lines){
  var s=el("div","said "+cls);
  s.appendChild(el("span","who",who));
  (Array.isArray(lines)?lines:[lines]).forEach(function(l){s.appendChild(el("p",null,l));});
  return s;
}
function record(cap,html){
  var r=el("div","record");
  r.appendChild(el("p","cap",cap));
  r.insertAdjacentHTML("beforeend",html);
  return r;
}
function mark(id,label,ok,chose,right){
  if(S.audit[id])return;
  S.audit[id]={label:label,ok:ok,chose:chose||"",right:right||""};
}

/* ---------- task components; each calls done() when finished ---------- */
function choice(parent,cfg,done){
  var wrap=el("div");
  wrap.appendChild(el("p","q",cfg.q));
  var box=el("div","opts");
  var finished=false,first=true,rightText="";
  cfg.opts.forEach(function(o){if(o.ok)rightText=o.t;});
  cfg.opts.forEach(function(o){
    var b=el("button","opt",o.t);
    b.onclick=function(){
      if(finished)return;
      if(o.ok){
        finished=true;
        b.className="opt right";
        Array.prototype.forEach.call(box.children,function(x){x.disabled=true;});
        if(first)mark(cfg.id,cfg.label,true,o.t,rightText);
        wrap.appendChild(el("div","note","<b>Recorded.</b> "+cfg.why));
        done();
      }else{
        if(first)mark(cfg.id,cfg.label,false,o.t,rightText);
        first=false;
        b.className="opt wrong";b.disabled=true;b.classList.add("shake");
        var old=wrap.querySelector(".note.bad");if(old)old.remove();
        wrap.insertBefore(el("div","note bad","<b>Not that one.</b> "+(o.why||"Read it again and try another.")),box.nextSibling);
      }
    };
    box.appendChild(b);
  });
  wrap.appendChild(box);
  parent.appendChild(wrap);
}

function multi(parent,cfg,done){
  var wrap=el("div");
  wrap.appendChild(el("p","q",cfg.q));
  var box=el("div","opts");
  var picked=[],first=true;
  var rightText=cfg.opts.filter(function(o){return o.ok;}).map(function(o){return o.short||o.t;}).join(", ");
  cfg.opts.forEach(function(o,ix){
    var b=el("button","opt",o.t);
    b.onclick=function(){
      if(b.disabled)return;
      var at=picked.indexOf(ix);
      if(at>-1){picked.splice(at,1);b.className="opt";}else{picked.push(ix);b.className="opt sel";}
      chk.disabled=picked.length===0;
    };
    box.appendChild(b);
  });
  wrap.appendChild(box);
  var chk=el("button","act","Check my answer");chk.disabled=true;
  chk.onclick=function(){
    var ok=true;
    cfg.opts.forEach(function(o,ix){if((picked.indexOf(ix)>-1)!==!!o.ok)ok=false;});
    var chose=picked.map(function(ix){return cfg.opts[ix].short||cfg.opts[ix].t;}).join(", ");
    if(first)mark(cfg.id,cfg.label,ok,chose,rightText);
    first=false;
    if(ok){
      cfg.opts.forEach(function(o,ix){box.children[ix].disabled=true;box.children[ix].className="opt"+(o.ok?" right":"");});
      chk.remove();
      wrap.appendChild(el("div","note","<b>Recorded.</b> "+cfg.why));
      done();
    }else{
      var old=wrap.querySelector(".note.bad");if(old)old.remove();
      wrap.insertBefore(el("div","note bad","<b>Not yet.</b> "+cfg.hint),chk);
      cfg.opts.forEach(function(o,ix){box.children[ix].className="opt";});
      picked=[];chk.disabled=true;
    }
  };
  wrap.appendChild(chk);
  parent.appendChild(wrap);
}

function assemble(parent,cfg,done){
  var wrap=el("div");
  wrap.appendChild(el("p","q",cfg.q));
  var slots=el("div","slots"),built=[],chips=el("div","chipline"),first=true;
  function draw(){
    slots.innerHTML="";
    if(!built.length)slots.appendChild(el("span","empty","tap the parts in order"));
    built.forEach(function(p,ix){
      var s=el("span","builtpart",p.t);s.style.cursor="pointer";
      s.onclick=function(){built.splice(ix,1);chips.children[p.ix].className="chip";draw();};
      slots.appendChild(s);
    });
    check.disabled=!built.length;
  }
  cfg.parts.forEach(function(p,ix){
    var b=el("button","chip",p);
    b.onclick=function(){if(b.classList.contains("used"))return;b.className="chip used";built.push({t:p,ix:ix});draw();};
    chips.appendChild(b);
  });
  wrap.appendChild(slots);wrap.appendChild(chips);
  var check=el("button","act","Check the word");check.disabled=true;
  check.onclick=function(){
    var word=built.map(function(b){return b.t;}).join("").toLowerCase();
    var old=wrap.querySelector(".note");if(old)old.remove();
    if(first)mark(cfg.id,cfg.label,word===cfg.answer,word,cfg.answer);
    first=false;
    if(word===cfg.answer){
      wrap.appendChild(el("div","note","<b>"+cfg.answer+".</b> "+cfg.why));
      check.remove();done();
    }else{
      wrap.appendChild(el("div","note bad","<b>"+(word||"nothing")+" is not a word.</b> "+cfg.hint+" The parts have been put back for you."));
      built=[];
      Array.prototype.forEach.call(chips.children,function(ch){ch.className="chip";});
      draw();
    }
  };
  wrap.appendChild(check);
  parent.appendChild(wrap);draw();
}

function columnGraph(data,opts){
  opts=opts||{};
  var W=Math.min(640,Math.max(340,data.length*110+80)),H=300,L=50,B=54,T=26;
  var max=0;data.forEach(function(d){if(d.value>max)max=d.value;});
  var stp=opts.step||(max<=10?1:max<=25?5:max<=60?10:max<=250?25:50);
  var top=Math.ceil(max/stp)*stp||stp;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">';
  if(opts.title)s+='<text x="'+(W/2)+'" y="16" text-anchor="middle" font-size="15">'+opts.title+'</text>';
  for(var v=0;v<=top;v+=stp){
    var y=H-B-((H-B-T)*(v/top));
    s+='<line class="gl" x1="'+L+'" y1="'+y+'" x2="'+(W-14)+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+v+'</text>';
  }
  var bw=(W-L-24)/data.length;
  data.forEach(function(d,ix){
    var h=(H-B-T)*(d.value/top),x=L+ix*bw+bw*0.2;
    s+='<rect x="'+x+'" y="'+(H-B-h)+'" width="'+(bw*0.6)+'" height="'+h+'" fill="'+(ix%2?"#6f8f6a":"#e0a93b")+'"/>';
    s+='<text x="'+(L+ix*bw+bw/2)+'" y="'+(H-B+20)+'" text-anchor="middle">'+d.label+'</text>';
  });
  s+='<line class="ax" x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'"/><line class="ax" x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-14)+'" y2="'+(H-B)+'"/></svg>';
  return s;
}

/* ============================ the twelve pages ============================ */
function page(o){PAGES.push(o);}

page({id:"p1",chap:"Words",time:"dawn",build:function(c,done){
  c.appendChild(el("h2",null,"A word Colin used"));
  where(c,"You are the Keeper of the Record at Misselthwaite Manor. Colin Craven spent ten years shut in a bedroom and has now been outside for a week. He writes down what he sees. Mary Lennox checks it. When they disagree, you decide, and you give your reason.");
  c.appendChild(record("Colin's record, Monday.","<p>The walled garden has an atmosphere of great happiness in it now that the roses are waking up.</p>"));
  c.appendChild(said("Mary","mary","That is wrong. The atmosphere is the layer of gases around a planet. Happiness is not a gas."));
  c.appendChild(said("Colin","colin","I know what it means in science. I am using the word a second way. The garden feels happy. That is what I meant and that is what I wrote."));
  c.appendChild(said("Mary","mary","You cannot use a word any way you please. Keeper, decide."));
  var t2=el("div");
  choice(c,{
    id:"atmosphere",label:"Can 'atmosphere' mean a feeling?",
    q:"Who is right?",
    opts:[
      {t:"Mary. Atmosphere only means the gases around a planet, so Colin must cross it out.",ok:false,why:"That is the first meaning, but words often grow a second one."},
      {t:"Colin. Atmosphere also means the feeling of a place, and that meaning grew out of the first one.",ok:true},
      {t:"Neither. Atmosphere means the weather.",ok:false,why:"Weather happens in the atmosphere, but the word does not mean weather."}
    ],
    why:"Air is all around you and you cannot see it. A feeling can fill a room in the same way. That is how the second meaning grew out of the first. Using a word like this is called using it figuratively."
  },function(){
    c.appendChild(t2);
    t2.appendChild(said("Mary","mary","Then show me a real writer doing it. Not you. A book."));
    choice(t2,{
      id:"evidence",label:"Finding evidence in The Secret Garden",
      q:"Here are three lines from The Secret Garden. Which one shows the author using 'atmosphere' to mean a feeling?",
      opts:[
        {t:"He had lain on his back in the huge closed house, breathing an atmosphere heavy with the fears of people who were tired of him.",ok:true},
        {t:"An angry unsympathetic little girl insisted obstinately that he was not as ill as he thought he was.",ok:false,why:"True, but it does not use the word at all."},
        {t:"Most of his fright and illness was created by himself.",ok:false,why:"That is the point of the chapter, not the point of the argument."}
      ],
      why:"Fear is not a gas either. The atmosphere in that closed house was the feeling of it, and Colin was breathing it. Your ruling stands and Mary has to accept it."
    },done);
  });
}});

page({id:"p2",chap:"Words",time:"dawn",build:function(c,done){
  c.appendChild(el("h2",null,"Colin's glossary"));
  where(c,"Colin has copied five definitions into the back of his record, all of them words built from the base 'sphere'. Mary says two of them are wrong. She is right, but she cannot say which two.");
  c.appendChild(record("The back page of Colin's record.",
    '<p><b>1. Cryosphere</b> &mdash; the frozen water part of the Earth: ice caps, glaciers and frozen ground.</p>'+
    '<p><b>2. Lithosphere</b> &mdash; all the solid parts of the earth: the crust, the mantle and the core.</p>'+
    '<p><b>3. Atmosphere</b> &mdash; the layer of gases surrounding a planet or star.</p>'+
    '<p><b>4. Hydrosphere</b> &mdash; the salt water of the oceans and the seas.</p>'+
    '<p><b>5. Hemisphere</b> &mdash; half of a sphere.</p>'));
  var t2=el("div");
  multi(c,{
    id:"glossary",label:"Finding the two wrong definitions",
    q:"Tap the two that are wrong, then check.",
    opts:[
      {t:"1. Cryosphere",ok:false,short:"cryosphere"},
      {t:"2. Lithosphere",ok:true,short:"lithosphere"},
      {t:"3. Atmosphere",ok:false,short:"atmosphere"},
      {t:"4. Hydrosphere",ok:true,short:"hydrosphere"},
      {t:"5. Hemisphere",ok:false,short:"hemisphere"}
    ],
    hint:"One of them goes far too deep into the earth. Another leaves out an enormous amount of water.",
    why:"Number 2 goes too deep: the lithosphere is only the rigid outside, the crust and the upper mantle. Number 4 is too narrow: the hydrosphere is all the water on the earth's surface, lakes and rivers as well as seas, and sometimes the water in the clouds above it."
  },function(){
    c.appendChild(t2);
    t2.appendChild(said("Colin","colin","But I did not invent number 2. I copied it out of a book, so it must be a word for something."));
    choice(t2,{
      id:"geosphere",label:"Naming the word Colin actually defined",
      q:"Colin's number 2 is a good definition of a different word. Which word is it?",
      opts:[
        {t:"geosphere",ok:true},
        {t:"biosphere",ok:false,why:"The biosphere is the living part: every living thing and how it all connects."},
        {t:"exosphere",ok:false,why:"The exosphere is the outermost layer of a planet's atmosphere. Nothing solid about it."}
      ],
      why:"The geosphere is the crust, the mantle and the core together. Colin had a good definition attached to the wrong word."
    },done);
  });
}});

page({id:"p3",chap:"Words",time:"dawn",build:function(c,done){
  c.appendChild(el("h2",null,"Two words Colin does not have"));
  where(c,"Colin keeps finding things in the garden he cannot name. Words built from 'sphere' are made of three kinds of part: a prefix at the front, the base in the middle, and a suffix at the end. Build the words he needs by tapping the parts in order.");
  c.appendChild(said("Colin","colin","There is a grain of pollen on my sleeve. It is a tiny ball. I cannot call it a sphere, because a sphere sounds enormous."));
  var t2=el("div");
  assemble(c,{
    id:"microsphere",label:"Building 'microsphere'",
    q:"A very small ball, such as a grain of pollen.",

  picker.appendChild(el("label",null,"Which word did you use figuratively?"));
  var sel=document.createElement("select");
  picker.appendChild(sel);
  c.appendChild(picker);
  var out=el("div"),b=el("button","act","Seal the record");
  c.appendChild(out);c.appendChild(b);
  function used(){var t=ta.value.toLowerCase();return WORDS.filter(function(w){return new RegExp("\\b"+w+"\\b").test(t);});}
  function refresh(){
    var n=ta.value.trim().split(/\s+/).filter(Boolean).length,u=used();
    wc.textContent=n+" words written. "+u.length+" sphere word"+(u.length===1?"":"s")+" used. You need at least 50 words and 3 sphere words.";
    var keep=sel.value;
    sel.innerHTML='<option value="">choose one</option>';
    u.forEach(function(w){var o=document.createElement("option");o.value=w;o.textContent=w;sel.appendChild(o);});
    sel.value=keep;
    b.disabled=!(n>=50&&u.length>=3);
  }
  ta.oninput=refresh;refresh();
  b.onclick=function(){
    if(!sel.value){out.innerHTML="";out.appendChild(el("div","note bad","<b>One thing missing.</b> Choose which of your sphere words you used figuratively."));return;}
    S.data.entry=ta.value;S.data.fig=sel.value;
    mark("entry","Writing the last entry",true,"","");
    out.innerHTML="";
    out.appendChild(el("div","note","<b>Sealed.</b> Colin has written you a letter in return."));
    b.remove();done();
  };
}});

/* ============================ closing ============================ */
function closing(){
  stage.innerHTML="";
  document.body.setAttribute("data-time","dusk");
  chapline.innerHTML="The record is closed<b>Misselthwaite</b>";
  backBtn.disabled=false;
  backBtn.onclick=function(){S.p=PAGES.length-1;render();};

  var c=card("Colin's letter");
  var l=el("div","letter");
  l.innerHTML=
    "<p>To the Keeper of the Record.</p>"+
    "<p>You decided that a word can mean a thing I can touch and a thing I cannot, and that the second meaning grew out of the first. So my atmosphere of happiness stays in the book.</p>"+
    "<p>You found the two wrong definitions in my glossary, and you told me the lithosphere is only the outside of the earth.</p>"+
    "<p>You decided that the poet was right about my shadow stretching, right about it lying short at midday although he exaggerated, right about what he saw when he called it a coward but wrong about why, and exactly right about the morning before sunrise. No light, no shadow.</p>"+
    "<p>Then you went outside and measured, which is more than I did.</p>"+
    "<p>You found the uneven scale on my bird graph, and the flowers I had strung along a number line, and the total I had remembered instead of adding up.</p>"+
    "<p>I have been outside for eight days now. I am beginning to think that seeing a thing and recording a thing are two different pieces of work, and that the second one is harder.</p>"+
    "<p class='sig'>Colin Craven</p>";
  c.appendChild(l);
  stage.appendChild(c);

  var c2=card("Your entry");
  var box=el("div","record");
  box.appendChild(el("p","cap","The first morning Colin came out of the house."));
  var p=document.createElement("p");p.style.whiteSpace="pre-wrap";p.textContent=S.data.entry||"";
  box.appendChild(p);
  box.appendChild(el("p","cap","Used figuratively: "+(S.data.fig||"")));
  c2.appendChild(box);
  if(S.data.shadow){
    var d=S.data.shadow;
    c2.appendChild(el("p",null,"Shadow measurements: object "+d.height+" cm tall, morning "+d.m+" cm, midday "+d.n+" cm, afternoon "+d.a+" cm."));
  }
  var ids=Object.keys(S.audit);
  var right=ids.filter(function(k){return S.audit[k].ok;}).length;
  c2.appendChild(el("p",null,"Rulings made without a second try: "+right+" of "+ids.length+"."));
  var pb=el("button","act ghost","Print this page");
  pb.onclick=function(){window.print();};
  c2.appendChild(pb);
  stage.appendChild(c2);

  var c3=card("The full audit");
  c3.appendChild(el("p",null,"Every ruling of the day, in order, showing what was chosen first and what was correct. Written for a grown-up to read over."));
  var showBtn=el("button","act ghost","Show the audit");
  c3.appendChild(showBtn);
  showBtn.onclick=function(){
    showBtn.remove();
    var a=el("div","audit");
    ids.forEach(function(k){
      var r=S.audit[k],row=el("div","row");
      row.appendChild(el("div","mk "+(r.ok?"y":"n"),r.ok?"&#10003;":"&#10007;"));
      var t=el("div");
      t.appendChild(el("div",null,r.label));
      if(!r.ok){
        t.appendChild(el("div","det","Chose first: "+(r.chose||"(nothing)")));
        if(r.right)t.appendChild(el("div","det","Correct: "+r.right));
      }
      row.appendChild(t);a.appendChild(row);
    });
    c3.appendChild(a);
  };
  stage.appendChild(c3);
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ============================ runner ============================ */
for(var z=0;z<12;z++)tokbox.appendChild(el("div","tok"));
function paintTokens(){
  for(var i=0;i<12;i++)tokbox.children[i].className="tok"+(S.done[PAGES[i].id]?" on":"");
}
function render(){
  var pg=PAGES[S.p];
  stage.innerHTML="";
  document.body.setAttribute("data-time",pg.time);
  chapline.innerHTML="Page "+(S.p+1)+" of 12<b>"+pg.chap+"</b>";
  backBtn.disabled=S.p===0;
  backBtn.onclick=function(){if(S.p>0){S.p--;render();}};
  paintTokens();
  var c=card(null);
  stage.appendChild(c);
  var already=!!S.done[pg.id],shown=false;
  function forward(scroll){
    if(shown)return;
    shown=true;
    var holder=el("div");
    stage.appendChild(holder);
    var b=el("button","act",S.p===PAGES.length-1?"Close the record":"Next page");
    b.onclick=function(){
      if(S.p===PAGES.length-1){closing();return;}
      S.p++;render();
    };
    holder.appendChild(b);
    if(scroll&&b.scrollIntoView)b.scrollIntoView({behavior:"smooth",block:"center"});
  }
  pg.build(c,function(){
    S.done[pg.id]=true;paintTokens();
    forward(true);
  });
  if(already)forward(false);
  window.scrollTo({top:0,behavior:"smooth"});
}
document.getElementById("beginBtn").onclick=function(){
  document.getElementById("title").style.display="none";
  document.getElementById("frame").style.display="block";
  render();
};
})();
</script>
