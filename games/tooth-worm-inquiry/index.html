<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>The Tooth Worm Inquiry</title>
<script src="../../results.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
/* An old case file: ivory enamel, gum pink, plum ink, apothecary green and brass. */
:root{
  --paper:#FBF7EE; --paper-2:#F2EADA; --ink:#2B2238; --muted:#625C6E; --line:#E4DAC6;
  --plum:#6B2D5C; --gum:#D9667E; --mint:#1F7A6B; --brass:#B8862B; --brass-d:#8A6216; --blue:#2D5B8A; --danger:#C2443E;
  --good:#1F7A45; --good-bg:#E3F3E7; --hmm-bg:#FFF3D4;
  --display:"Fraunces",Georgia,serif; --body:"Andika","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:1.15rem;line-height:1.45;background:var(--paper);
  background-image:radial-gradient(circle at 10% 6%,rgba(217,102,126,.10) 0 120px,transparent 121px),radial-gradient(circle at 94% 28%,rgba(184,134,43,.10) 0 160px,transparent 161px),radial-gradient(circle at 28% 96%,rgba(31,122,107,.10) 0 180px,transparent 181px);background-attachment:fixed}
#app{max-width:1120px;margin:0 auto;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(86px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0 0 .55em}
.note{font-size:.98rem;color:var(--muted)}
.center{text-align:center;justify-content:center}

.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:4px 0 10px;margin-bottom:12px;border-bottom:4px solid transparent;border-image:linear-gradient(90deg,var(--plum),var(--gum),var(--brass),var(--mint)) 1}
.brand{display:flex;gap:10px;align-items:center}
.bface svg{width:48px;height:48px;display:block}
.brand h1{font-size:clamp(1.5rem,4.2vw,2.2rem);color:var(--plum)}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:1rem}
.chip-t{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;min-height:44px;display:inline-flex;align-items:center}
.chip-t[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:#fff}

.panel{background:#fff;border:2px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);padding:14px 16px 20px}
.head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.head h2{font-size:clamp(1.3rem,3.8vw,1.85rem);color:var(--plum)}
.back{background:#fff;border:2px solid var(--plum);color:var(--plum);border-radius:999px;padding:6px 16px;min-height:46px;font-size:1rem;font-weight:700}
.dots{display:flex;gap:7px;margin-left:auto}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--paper-2);border:2px solid var(--line)}
.dots i.on{background:var(--mint);border-color:var(--mint)}
.dots i.now{background:var(--brass);border-color:var(--brass-d)}

.bubble{display:flex;gap:10px;align-items:center;min-height:58px}
.bubble .face{flex:none;width:58px;height:58px}
.bubble .face svg{width:58px;height:58px;display:block}
.bubble p{flex:1;margin:0;font-size:1.28rem;line-height:1.32;font-weight:700;background:#F7EEF3;border-radius:16px;padding:9px 15px;border:2px solid #E8D1DE}
.bubble p b{color:var(--plum)}
.qbtn{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--brass-d);background:var(--hmm-bg);font-weight:700;font-size:1.4rem}
.qbtn[disabled]{opacity:.3;cursor:default}
.clue{margin:8px 0 0 68px;background:var(--hmm-bg);border-radius:12px;padding:8px 14px;font-size:1.08rem;border:2px solid #EFD89A}

.stage{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:14px}
.stage.one{grid-template-columns:1fr}
@media (max-width:860px){.stage{grid-template-columns:1fr}}
.pic{position:relative;display:grid;gap:10px;justify-items:center;min-width:0}
.side{min-width:0;display:grid;gap:12px;align-content:start}
.artbox{width:100%;display:grid;place-items:center}
.artbox svg{width:100%;height:auto;display:block}
.artbox.big svg{max-width:380px}
.artbox.mid svg{max-width:260px}
.artbox.small svg{max-width:170px}
.artbox.wide svg{max-width:760px}

.toast{position:absolute;left:50%;top:6px;transform:translateX(-50%);max-width:94%;width:max-content;padding:10px 18px;border-radius:16px;font-weight:700;font-size:1.15rem;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.16);z-index:20;pointer-events:none}
.toast.yes{background:var(--good-bg);color:var(--good);border:3px solid var(--good)}
.toast.hmm{background:var(--hmm-bg);color:#6d4410;border:3px solid #E3BE5C}

.btn{font-family:var(--body);font-weight:700;font-size:1.15rem;background:var(--mint);color:#fff;border:0;border-radius:999px;padding:.45em 1.35em;min-height:54px;box-shadow:0 4px 0 #11524A;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #11524A}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.plum{background:var(--plum);box-shadow:0 4px 0 #42173A}
.btn.big{font-size:1.6rem;min-width:200px;min-height:80px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.next-row{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.sub{font-size:1.2rem;color:var(--plum);margin:10px 0 4px}
input[type=text]{border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-height:52px;flex:1;min-width:160px}
textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1.12rem;line-height:1.5;background:#FFFDF7;resize:vertical}

/* home */
.intro{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:20px;align-items:start}
@media (max-width:760px){.intro{grid-template-columns:1fr}}
.intro h2{font-size:clamp(1.6rem,4.5vw,2.3rem);color:var(--plum);margin-bottom:8px}
.casehead{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-family:var(--display);font-size:1.3rem;color:var(--brass-d)}
.casehead small{font-family:var(--body);font-size:.95rem;color:var(--muted)}
.stops{display:grid;gap:10px;margin:6px 0}
.stop{display:flex;gap:14px;align-items:center;text-align:left;background:#fff;border:3px solid var(--c);border-radius:18px;padding:10px 14px;min-height:64px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 45%,white)}
.stop .num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.3rem}
.stop .st{display:grid}.stop small{color:var(--muted);font-size:.98rem}
.stop.done{background:color-mix(in srgb,var(--c) 10%,white)}
.stop.locked{opacity:.45;cursor:default;box-shadow:none}
.stop .kit{margin-left:auto;flex:none;font-size:.85rem;font-weight:700;background:var(--hmm-bg);border:2px solid #E3BE5C;border-radius:999px;padding:2px 10px}
.big-tick{width:92px;height:92px;border-radius:50%;background:var(--c);color:#fff;font-size:3rem;display:grid;place-items:center;margin:10px auto}
.panel.center h2{margin-bottom:8px}

/* cards, files and facts */
.facts{display:grid;gap:4px;font-size:1.15rem;background:#F7F3FA;border:2px solid #E3D6EC;border-radius:16px;padding:12px 16px}
.facts p b{color:var(--plum)}
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;width:100%}
.file{position:relative;text-align:left;background:#FFF8E9;border:3px solid #E2C98F;border-radius:6px 18px 18px 18px;padding:10px 12px;min-height:150px;display:grid;gap:6px;align-content:start;box-shadow:0 4px 0 #EAD9B0}
.file::before{content:"";position:absolute;top:-14px;left:-3px;width:70px;height:14px;background:#FFF8E9;border:3px solid #E2C98F;border-bottom:0;border-radius:8px 8px 0 0}
.file .ft{font-weight:700;font-size:1.08rem;color:var(--plum)}
.file .fd{font-size:.95rem;color:var(--brass-d);font-weight:700}
.file .ic{width:64px;height:64px}
.file .fb{font-size:1.02rem}
.file.closed .fb{display:none}
.file.closed .open-me{display:block}
.open-me{display:none;font-size:.95rem;color:var(--muted)}
.file.read{border-color:var(--mint);background:#F1FAF7}
.quote{font-family:var(--display);font-size:1.08rem;background:#fff;border-left:5px solid var(--plum);border-radius:8px;padding:6px 12px;margin:4px 0}
.guide{background:#FFF8E6;border:2px solid #EFD89A;border-radius:14px;padding:10px 14px;font-size:1.08rem;width:100%}
.guide > b:first-child{display:block;color:var(--brass-d);margin-bottom:4px}
.safety{background:#FDEDEC;border:2px solid #EBB4B0;border-radius:14px;padding:10px 14px;font-size:1.05rem}
.safety b{color:var(--danger)}

/* checklists */
.checks{display:grid;gap:8px}
.check{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 12px;min-height:58px;font-size:1.1rem}
.check .box{flex:none;width:34px;height:34px;border-radius:8px;border:3px solid var(--mint);display:grid;place-items:center;font-weight:700;color:#fff}
.check.on{border-color:var(--mint);background:#EEF8F5}
.check.on .box{background:var(--mint)}
.check .ic{width:42px;height:42px}

/* chips and targets */
.tray{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.tray.center{justify-content:center}
.card{display:inline-flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--plum);border-radius:14px;padding:8px 14px;min-height:56px;font-weight:700;font-size:1.05rem;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 4px 0 #D9C3D3;cursor:grab;text-align:left}
.card.word{background:#F7EEF3}
.teachcard{display:inline-flex;align-items:center;gap:8px;background:#F7F3FA;border:2px solid #E3D6EC;border-radius:14px;padding:8px 14px;min-height:56px;font-weight:700;font-size:1.05rem}
.card.sel{outline:4px solid var(--brass);transform:translateY(-2px)}
.card.lifted{opacity:.35}
.card.gone{display:none}
.card.placed{cursor:default;box-shadow:none;border-color:var(--good);background:var(--good-bg);font-size:.98rem;min-height:46px;padding:4px 10px}
.dragghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-60%) rotate(-3deg);opacity:.95;box-shadow:0 10px 24px rgba(0,0,0,.25)!important}
.ic{display:inline-grid;place-items:center;width:38px;height:38px;flex:none}
.ic svg{width:100%;height:100%}
.ic.lg{width:72px;height:72px}
.lab-done{background:var(--good-bg);border:2px solid var(--good);color:var(--good);border-radius:12px;padding:6px 12px;font-weight:700}
.target.glow{filter:drop-shadow(0 0 6px #F2C14E)}
.target.over{filter:drop-shadow(0 0 8px #D9667E)}
.lspot circle{fill:rgba(255,255,255,.85);stroke:var(--plum);stroke-width:3;stroke-dasharray:5 4}
.lspot.full circle{fill:#E3F3E7;stroke:#1F7A45;stroke-dasharray:none}
.ltxt{font:700 16px var(--body);fill:#1F7A45;text-anchor:middle}

/* bins */
.sorter{display:grid;gap:14px;width:100%}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bins.line{grid-template-columns:repeat(4,minmax(0,1fr))}
.bins.board{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:700px){.bins.line,.bins.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bin{background:#F7F3FA;border:3px dashed #C9AFC2;border-radius:16px;min-height:120px;padding:8px;display:grid;align-content:start;gap:8px}
.bin-h{display:flex;gap:6px;align-items:center;justify-content:center;font-weight:700;font-size:1.05rem;color:var(--plum);text-align:center}
.bin.for{background:#EEF8F1;border-color:#9FCDB0}.bin.against{background:#FCEFEE;border-color:#E3ABA6}
.bins.line .bin:nth-child(1){background:#FCEDEA;border-color:#E9A698}.bins.line .bin:nth-child(2){background:#FFF4E2;border-color:#ECC686}
.bins.line .bin:nth-child(3){background:#EEF6E4;border-color:#B5D38F}.bins.line .bin:nth-child(4){background:#E6F2F8;border-color:#93C1DA}
.bin-body{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bin.shake{animation:shake .45s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* ordering slots */
.slots{display:grid;gap:8px;width:100%}
.slots.across{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.slot{display:flex;gap:10px;align-items:center;background:#F7F3FA;border:3px dashed #C9AFC2;border-radius:14px;padding:6px 10px;min-height:64px}
.slots.across .slot{flex-direction:column;align-items:stretch;min-height:120px}
.slot-n{flex:none;font-weight:700;color:var(--plum);font-size:.95rem;min-width:30px}
.slot-b{flex:1;display:flex;justify-content:center}
.slot.full{border-style:solid;border-color:var(--good);background:var(--good-bg)}

/* options */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.opts.wide{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:3px solid var(--plum);border-radius:16px;padding:10px 14px;min-height:60px;font-weight:700;font-size:1.08rem;box-shadow:0 4px 0 #D9C3D3}
.opt.no{opacity:.4;box-shadow:none;border-color:#B9B2A2;text-decoration:line-through}
.opt.right{background:var(--good-bg);border-color:var(--good);box-shadow:0 4px 0 #A6D3B2}
.opt.picked{background:#F7EEF3;border-color:var(--brass)}
.qcount{font-size:.95rem;color:var(--muted);font-weight:700}

/* the acid clock */
.clock{width:100%;display:grid;gap:10px}
.chart{background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px}
.chart svg{width:100%;height:auto;display:block}
.chart h3{font-size:1.05rem;color:var(--plum);margin:2px 6px}
.ax{font:700 13px var(--body);fill:#625C6E}
.zone-t{font:700 14px var(--body)}
.curve{fill:none;stroke:var(--plum);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.dmins{display:inline-flex;gap:8px;align-items:center;font-weight:700;background:#FDEDEC;border:2px solid #EBB4B0;color:#8E2C27;border-radius:999px;padding:4px 14px;margin:0 6px 4px}
.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:6px;width:100%}
.tslot{background:#F7F3FA;border:3px dashed #C9AFC2;border-radius:12px;min-height:84px;padding:4px;display:grid;align-content:start;justify-items:center;gap:4px}
.tslot .tt{font-size:.85rem;font-weight:700;color:var(--muted)}
.tslot.meal{background:#FFF8E6;border-color:#E3BE5C}
.tslot .chip.card{padding:4px 6px;min-height:40px;font-size:.85rem}
.tok{display:inline-flex;align-items:center;gap:4px}
.tok .ic{width:30px;height:30px}
.tslot .tok .tl{display:none}
.tslot .tok{padding:2px 4px}

/* foods */
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;width:100%}
.food{display:grid;justify-items:center;gap:2px;background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px;min-height:96px;font-weight:700;font-size:.95rem;text-align:center}
.food .ic{width:46px;height:46px}
.food.on{border-color:var(--mint);background:#EEF8F5;box-shadow:0 0 0 3px #BFE3DA}
.labelrow{display:grid;gap:6px;background:#F7F3FA;border:2px solid #E3D6EC;border-radius:14px;padding:10px}
.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer .tv{font-family:var(--display);font-size:2.2rem;min-width:110px;color:var(--plum)}

/* won */
.won{display:flex;gap:12px;align-items:flex-start;background:var(--good-bg);border:3px solid var(--good);border-radius:16px;padding:12px 14px;font-size:1.12rem}
.won .tick{flex:none;width:40px;height:40px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center}
.won .tick svg{width:26px;height:26px}
.won p{margin:0 0 .4em}
.solved{display:grid;gap:8px;width:100%}
.sv{background:#F7F3FA;border:2px solid #E3D6EC;border-radius:14px;padding:10px 14px;font-size:1.15rem}
.sv b{color:var(--plum)}

/* bubbles in the glass */
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
.fizz circle{animation:rise 2.2s infinite ease-in}
.fizz circle:nth-child(2){animation-delay:.4s}.fizz circle:nth-child(3){animation-delay:.9s}.fizz circle:nth-child(4){animation-delay:1.3s}.fizz circle:nth-child(5){animation-delay:1.7s}
@media (prefers-reduced-motion:reduce){.fizz circle{animation:none;opacity:.8}}

/* curiosity cabinet */
.cabinet{display:grid;align-items:start;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:10px}
.cab{text-align:left;background:linear-gradient(160deg,#6B2D5C,#2D5B8A);color:#fff;border:0;border-radius:18px;padding:14px;min-height:90px;box-shadow:0 5px 0 #42173A;display:grid;gap:8px;align-content:start}
.cab-f{display:flex;gap:10px;align-items:center;font-size:1.15rem}
.cab-b{display:none;font-size:1.05rem;line-height:1.45;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
.cab.open .cab-b{display:block}
</style>
</head>

<path d="M134 160 C140 190 136 220 142 246 M166 160 C160 196 166 226 158 250" stroke="#B83A55" stroke-width="2" fill="none"/>`;
    if(hole>=1)b+=`<ellipse cx="112" cy="58" rx="16" ry="8" fill="#F4F1E4" stroke="#C9C1A6" stroke-width="2"/>`;

    if(hole>=3)b+=`<path d="M100 52 C104 92 122 96 128 52 Z" fill="#4A3828"/>`;

/* ---------- drag, or tap then tap ---------- */
function clearSel(){if(SEL){SEL.chip.classList.remove('sel');document.querySelectorAll('.target.glow').forEach(t=>t.classList.remove('glow'));}SEL=null;}
function hitTest(targets,x,y){const ok=t=>t&&targets.includes(t)&&!t.classList.contains('full');
  let el=document.elementFromPoint(x,y);while(el&&el!==document.body){if(el.classList&&el.classList.contains('target')){if(ok(el))return el;break;}el=el.parentNode;}
  let best=null,ba=Infinity;for(const t of targets){if(!ok(t))continue;const r=t.getBoundingClientRect();if(x>=r.left-6&&x<=r.right+6&&y>=r.top-6&&y<=r.bottom+6){const a=r.width*r.height;if(a<ba){ba=a;best=t;}}}return best;}
function draggable(chip,targets,drop,o){o=o||{};chip.classList.add('chip');chip.setAttribute('role','button');chip.tabIndex=0;
  chip.addEventListener('pointerdown',e=>{if(chip.classList.contains('used'))return;e.preventDefault();
    const sx=e.clientX,sy=e.clientY;let ghost=null,moved=false;try{chip.setPointerCapture(e.pointerId);}catch(_){}
    const move=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>9){moved=true;clearSel();ghost=chip.cloneNode(true);ghost.classList.add('dragghost');document.body.appendChild(ghost);chip.classList.add('lifted');}
      if(moved){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';const t=hitTest(targets(),ev.clientX,ev.clientY);targets().forEach(x=>x.classList.toggle('over',x===t));}};
    const up=ev=>{chip.removeEventListener('pointermove',move);chip.removeEventListener('pointerup',up);chip.removeEventListener('pointercancel',up);
      if(moved){ghost.remove();chip.classList.remove('lifted');targets().forEach(x=>x.classList.remove('over'));if(ev.type==='pointerup'){const t=hitTest(targets(),ev.clientX,ev.clientY);if(t)drop(chip,t);}}
      else if(ev.type==='pointerup'){const was=SEL&&SEL.chip===chip;clearSel();if(!was){SEL={chip,drop,targets};chip.classList.add('sel');if(o.glow!==false)targets().forEach(t=>{if(!t.classList.contains('full'))t.classList.add('glow');});}}};
    chip.addEventListener('pointermove',move);chip.addEventListener('pointerup',up);chip.addEventListener('pointercancel',up);});
  chip.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();clearSel();SEL={chip,drop,targets};chip.classList.add('sel');}});}
function target(el){el.classList.add('target');el.addEventListener('click',()=>{if(SEL&&SEL.targets().includes(el)){const s=SEL;clearSel();s.drop(s.chip,el);}});return el;}

// Choose one answer. opts: {t, ok, why, icon}
function choose(o){
  const q=ask(o.item,o.concept,o.area);
  const box=h('div',{class:'opts'+(o.wide?' wide':'')});
  (o.shuffle===false?o.opts:shuffle(o.opts)).forEach(op=>{
    const b=h('button',{class:'opt',type:'button'},op.icon?icon(op.icon):null,h('span',null,op.t));
    b.addEventListener('click',()=>{if(b.disabled)return;
      if(op.ok){q.done();box.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add('right');o.then(op);}
      else{q.miss(op.t);b.disabled=true;b.classList.add('no');toast('hmm',op.why||'Not that one. Try another.',4600);}});
    box.appendChild(b);});
  return box;
}

/* ---------- the acid clock: a simple model of plaque acid after eating ---------- */
// Each eating time drops the line, then saliva brings it back. Below the line, enamel loses minerals.
// The numbers are a model, not measurements: one sweet snack keeps the mouth in the danger zone for about half an hour.
const START=7*60, LEN=12*60, BASE=6.8, LINE=5.5;
function evParams(e){const s=Math.min(1,e.s||0),n=e.n||1;let peak=Math.min(2.8,1+1.2*s+0.1*(n-1)),R=30+30*s+5*(n-1);if(e.cheese)R*=0.75;return {peak,R};}
function merge(events){const by={};events.forEach(e=>{if(!e||!(e.s>0))return;const k=e.t;const m=by[k]||(by[k]={t:k,s:0,n:0,cheese:false});m.s=Math.max(m.s,e.s);m.n+=e.n||1;m.cheese=m.cheese||!!e.cheese;});return Object.values(by);}
function simulate(events){const ev=merge(events).map(e=>Object.assign({},e,evParams(e)));const pts=[];let danger=0;
  for(let m=0;m<=LEN;m+=2){let d=0;ev.forEach(e=>{const dt=m-e.t;if(dt<0)return;let v=0;if(dt<5)v=e.peak*dt/5;else if(dt<5+e.R)v=e.peak*(1-(dt-5)/e.R);if(v>d)d=v;});
    const ph=BASE-d;pts.push([m,ph]);if(ph<LINE)danger+=2;}
  return {pts,danger};}
function clockChart(title,showPH){
  const W=700,H=250,x0=46,x1=684,y0=24,y1=214;const X=m=>x0+(x1-x0)*m/LEN,Y=ph=>y0+(y1-y0)*(7.0-ph)/3.0;
  const ly=Y(LINE);let ticks='';for(let hr=7;hr<=19;hr+=2){const x=X((hr-7)*60);ticks+=`<path d="M${x} ${y1} v6" stroke="#9A93A6" stroke-width="2"/><text x="${x}" y="${y1+22}" text-anchor="middle" class="ax">${hr<12?hr+'am':(hr===12?'12pm':(hr-12)+'pm')}</text>`;}
  const svg=`<svg viewBox="0 0 ${W} ${H+14}" role="img" aria-label="${title}">
<defs><pattern id="hatch${title.length}" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FDEDEC"/><path d="M0 0 V10" stroke="#F2C3BF" stroke-width="4"/></pattern></defs>
<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${ly-y0}" fill="#EEF8F1"/><rect x="${x0}" y="${ly}" width="${x1-x0}" height="${y1-ly}" fill="url(#hatch${title.length})"/>
<path d="M${x0} ${ly} H${x1}" stroke="#C2443E" stroke-width="3" stroke-dasharray="8 6"/>
<text x="${x1-6}" y="${ly-10}" text-anchor="end" class="zone-t" fill="#1F7A45">Safe: minerals go back in</text>
<text x="${x1-6}" y="${y1-8}" text-anchor="end" class="zone-t" fill="#8E2C27">Danger: acid takes minerals out</text>
${showPH?`<text x="${x0-6}" y="${ly+5}" text-anchor="end" class="ax">pH 5.5</text><text x="${x0-6}" y="${Y(7)+12}" text-anchor="end" class="ax">7</text><text x="${x0-6}" y="${Y(4.2)}" text-anchor="end" class="ax">4</text>`:''}
<path d="M${x0} ${y1} H${x1}" stroke="#9A93A6" stroke-width="2"/>${ticks}<g class="marks"></g><path class="curve" d=""/></svg>`;
  const dm=h('span',{class:'dmins',hidden:true});
  const el=h('div',{class:'chart'},h('h3',null,title,' ',dm),h('div',{svg}));
  const path=el.querySelector('.curve'),marks=el.querySelector('.marks');
  return {el,run(events,iconName){const r=simulate(events);path.setAttribute('d','M'+r.pts.map(p=>X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' L'));
      let mk='';merge(events).forEach(e=>{mk+=`<circle cx="${X(e.t)}" cy="${y0-10}" r="7" fill="${e.s>=1?'#E2557A':'#B8862B'}" stroke="#fff" stroke-width="2"/>`;});marks.innerHTML=mk;
      try{const L=path.getTotalLength();path.style.transition='none';path.style.strokeDasharray=L;path.style.strokeDashoffset=L;path.getBoundingClientRect();path.style.transition='stroke-dashoffset 1.6s ease-out';path.style.strokeDashoffset='0';}catch(e){}
      dm.hidden=false;dm.textContent='Danger time: about '+r.danger+' minutes';return r;}};
}
function tm(label){const [hh,mm]=label.split(':').map(Number);return (hh-7)*60+(mm||0);}
function clockLabel(t){const hh=7+Math.floor(t/60),mm=t%60;const h12=hh>12?hh-12:hh;return h12+(mm?':'+String(mm).padStart(2,'0'):'')+(hh<12?'am':'pm');}

function sisterPlate(){const other=PLAYER==='maeve'?'maggie':'maeve';

T.plate=function(F){const M=isM();

  const btns={};keys.forEach(k=>{const b=h('button',{class:'food'+(sel.has(k)?' on':''),type:'button','aria-pressed':String(sel.has(k))},icon(k),FOODS[k].t);btns[k]=b;
    b.addEventListener('click',()=>{if(sel.has(k))sel.delete(k);else sel.add(k);b.classList.toggle('on',sel.has(k));b.setAttribute('aria-pressed',String(sel.has(k)));go.disabled=!sel.size;});grid.appendChild(b);});
  if(sis&&!sel.size)F.pic.append(h('div',{class:'row'},h('button',{class:'btn ghost',type:'button',on:{click:()=>{sis.forEach(k=>{sel.add(k);if(btns[k]){btns[k].classList.add('on');btns[k].setAttribute('aria-pressed','true');}});go.disabled=false;}}},'Use the plate '+SIS()+' recorded')));
  const go=h('button',{class:'btn plum',type:'button',disabled:!sel.size,on:{click:test}},'Test our plate on the acid clock');
  F.pic.append(grid,h('div',{class:'next-row'},go));
  const out=h('div',{style:'width:100%;display:grid;gap:10px'});F.pic.append(out);
  function test(){S.plate=[...sel];save();
    G.write({game:GAME,part:'Tooth-friendly snack',area:'HPE',prompt:'Our snack plate',text:S.plate.map(k=>FOODS[k].t).join(', ')});
    out.textContent='';const foods=S.plate.map(k=>FOODS[k]);const s=Math.max(0,...foods.map(f=>f.s));const cheese=foods.some(f=>f.cheese);
    const t0=tm('10:00');const A=clockChart('Eaten in one go at 10am, then water',!M),B=clockChart('Nibbled bit by bit all morning',!M);
    const sweetish=foods.filter(f=>f.s>0);
    out.append(A.el,B.el);const ra=A.run(s>0?[{t:t0,s,n:Math.max(1,sweetish.length),cheese}]:[]);
    const nib=sweetish.length?[0,40,80,120,160].map(d=>({t:t0+d,s,n:1,cheese})):[];const rb=B.run(nib);
    const flags=foods.filter(f=>f.note);const crunchy=foods.some(f=>f.group==='crunchy'),dairy=foods.some(f=>f.group==='dairy'),drink=foods.some(f=>f.t==='Water'||f.t==='Plain milk');

    const q=ask('Snack plate: eat in one go','How often you eat sugar matters','HPE');
    out.append(h('div',{class:'guide'},h('b',null,'Our plate'),P(msg),tips.length?P(tips.join(' ')):null),
      P(M?'Should you eat it all at once, or nibble it all morning?':'Why eat it in one go, rather than nibbling all morning?'),
      (()=>{const box=h('div',{class:'opts wide'});[{t:M?'All at once, then water':'One acid attack is better than many',ok:true},{t:M?'Nibble it all morning':'Nibbling gives saliva more to do',why:'Nibbling means one acid attack after another. Saliva never gets a break.'}].forEach(op=>{

  const cards=[
    ['The worm’s wish','In the Babylonian story, the worm is offered a ripe fig and an apricot to eat. It refuses them, and asks to live between the tooth and the gum instead. The story was copied onto a clay tablet, now in the British Museum.'],
