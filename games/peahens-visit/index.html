<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>The Peahen's Visit</title>
<script src="../../results.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
/* A spring garden with a peacock's colours: teal, peacock blue, emerald, gold and warm brown. */
:root{
  --paper:#FBF6EA; --paper-2:#F1E8D2; --ink:#1E2A3A; --muted:#5D6470; --line:#E2D8BF;
  --teal:#0E6E6A; --blue:#1D4E89; --emerald:#1F8A5B; --gold:#D9A21B; --gold-d:#9E7410; --brown:#8B5E3C; --coral:#E0674A;
  --good:#1F7A45; --good-bg:#E3F3E7; --hmm-bg:#FFF3D4;
  --display:"Fraunces",Georgia,serif; --body:"Andika","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:1.15rem;line-height:1.45;background:var(--paper);
  background-image:radial-gradient(circle at 12% 8%,rgba(38,179,194,.10) 0 120px,transparent 121px),radial-gradient(circle at 92% 30%,rgba(217,162,27,.10) 0 160px,transparent 161px),radial-gradient(circle at 30% 96%,rgba(31,138,91,.10) 0 180px,transparent 181px);background-attachment:fixed}
#app{max-width:1120px;margin:0 auto;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(86px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0 0 .55em}
.note{font-size:.98rem;color:var(--muted)}
.center{text-align:center;justify-content:center}

.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:4px 0 10px;margin-bottom:12px;border-bottom:4px solid transparent;border-image:linear-gradient(90deg,var(--teal),var(--blue),var(--emerald),var(--gold)) 1}
.brand{display:flex;gap:10px;align-items:center}
.bface svg{width:48px;height:48px;display:block}
.brand h1{font-size:clamp(1.5rem,4.2vw,2.2rem);color:var(--teal)}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:1rem}
.chip-t{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;min-height:44px;display:inline-flex;align-items:center}
.chip-t[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}

.panel{background:#fff;border:2px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);padding:14px 16px 20px}
.head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.head h2{font-size:clamp(1.3rem,3.8vw,1.85rem);color:var(--blue)}
.back{background:#fff;border:2px solid var(--blue);color:var(--blue);border-radius:999px;padding:6px 16px;min-height:46px;font-size:1rem;font-weight:700}
.dots{display:flex;gap:7px;margin-left:auto}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--paper-2);border:2px solid var(--line)}
.dots i.on{background:var(--emerald);border-color:var(--emerald)}
.dots i.now{background:var(--gold);border-color:var(--gold-d)}

.bubble{display:flex;gap:10px;align-items:center;min-height:58px}
.bubble .face{flex:none;width:58px;height:58px}
.bubble .face svg{width:58px;height:58px;display:block}
.bubble p{flex:1;margin:0;font-size:1.28rem;line-height:1.32;font-weight:700;background:#EEF7F4;border-radius:16px;padding:9px 15px;border:2px solid #CFE6DE}
.bubble p b{color:var(--teal)}
.qbtn{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--gold-d);background:var(--hmm-bg);font-weight:700;font-size:1.4rem}
.qbtn[disabled]{opacity:.3;cursor:default}
.clue{margin:8px 0 0 68px;background:var(--hmm-bg);border-radius:12px;padding:8px 14px;font-size:1.08rem;border:2px solid #EFD89A}

.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:14px}
.stage.one{grid-template-columns:1fr}
.stage.plan{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.stage,.stage.plan{grid-template-columns:1fr}}
.pic{position:relative;display:grid;gap:10px;justify-items:center;min-width:0}
.side{min-width:0;display:grid;gap:12px;align-content:start}
.artbox{width:100%;display:grid;place-items:center}
.artbox svg{width:100%;height:auto;display:block}
.artbox.big svg{max-width:440px}
.artbox.mid svg{max-width:300px}
.artbox.wide svg{max-width:760px;border-radius:16px;border:3px solid #fff;box-shadow:0 3px 0 var(--line)}
.artbox.map svg{max-width:820px;border-radius:14px;border:3px solid #fff;box-shadow:0 3px 0 var(--line)}
.artbox.feather{width:min(280px,100%)}
.artbox.feather svg{width:100%}
.artbox.small svg{max-width:420px}
.svgt{font:700 18px var(--body);fill:#1E2A3A}
.svgt.sm{font-size:15px}
.svgt.zl{font-size:16px;fill:#2B3A2A;opacity:.85;pointer-events:none}

.toast{position:absolute;left:50%;top:6px;transform:translateX(-50%);max-width:94%;width:max-content;padding:10px 18px;border-radius:16px;font-weight:700;font-size:1.15rem;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.16);z-index:20;pointer-events:none}
.toast.yes{background:var(--good-bg);color:var(--good);border:3px solid var(--good)}
.toast.hmm{background:var(--hmm-bg);color:#6d4410;border:3px solid #E3BE5C}

.btn{font-family:var(--body);font-weight:700;font-size:1.15rem;background:var(--teal);color:#fff;border:0;border-radius:999px;padding:.45em 1.35em;min-height:54px;box-shadow:0 4px 0 #084744;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #084744}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.big{font-size:1.6rem;min-width:200px;min-height:80px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.next-row{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.sub{font-size:1.2rem;color:var(--teal);margin:10px 0 4px}
input[type=text]{border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-height:52px;flex:1;min-width:180px}
textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1.12rem;line-height:1.5;background:#FFFDF7;resize:vertical}

/* home */
.intro{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:20px;align-items:center}
@media (max-width:760px){.intro{grid-template-columns:1fr}}
.intro h2{font-size:clamp(1.6rem,4.5vw,2.3rem);color:var(--blue);margin-bottom:8px}
.stops{display:grid;gap:10px;margin:12px 0}
.stop{display:flex;gap:14px;align-items:center;text-align:left;background:#fff;border:3px solid var(--c);border-radius:18px;padding:10px 14px;min-height:64px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 45%,white)}
.stop .num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.3rem}
.stop .st{display:grid}.stop small{color:var(--muted);font-size:.98rem}
.stop.done{background:color-mix(in srgb,var(--c) 10%,white)}
.stop.locked{opacity:.45;cursor:default;box-shadow:none}
.big-tick{width:92px;height:92px;border-radius:50%;background:var(--c);color:#fff;font-size:3rem;display:grid;place-items:center;margin:10px auto}
.panel.center h2{margin-bottom:8px}

/* family and slots */
.family{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.family figure{margin:0;background:#F6FBF8;border:2px solid #D5EAE2;border-radius:16px;padding:8px;display:grid;gap:4px;text-align:center}
.family figcaption{font-size:1.1rem}
.slot .tagspot{min-height:46px;border:3px dashed #9CC8B8;border-radius:12px;display:grid;place-items:center;font-weight:700;color:var(--teal);font-size:1.15rem}
.slot.full .tagspot{border-style:solid;background:var(--good-bg);border-color:var(--good)}
.facts{display:grid;gap:4px;font-size:1.15rem;background:#F6FBF8;border:2px solid #D5EAE2;border-radius:16px;padding:12px 16px}
.facts p b{color:var(--teal)}
.guide,.cluebox{background:#FFF8E6;border:2px solid #EFD89A;border-radius:14px;padding:10px 14px;font-size:1.08rem;width:100%}
.cluebox > b:first-child{display:block;color:var(--gold-d);margin-bottom:4px}
.study > b{display:block;color:var(--gold-d)}
.cluebox.small{font-size:1rem}
.studies{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media (max-width:600px){.studies{grid-template-columns:1fr}}
.study{background:#fff;border:2px solid #EFD89A;border-radius:12px;padding:8px 12px}
.story{background:#F7F1FB;border:2px solid #DCCBEB;border-radius:16px;padding:12px 16px}
.story blockquote{margin:6px 0 8px;padding:8px 14px;border-left:5px solid #A23B72;background:#fff;border-radius:8px;font-family:var(--display);font-size:1.15rem}
.solved{display:grid;gap:8px;width:100%}
.sv{background:#F6FBF8;border:2px solid #D5EAE2;border-radius:14px;padding:10px 14px;font-size:1.2rem}
.sv b{color:var(--teal)}

/* chips and targets */
.tray{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.tray.center{justify-content:center}
.card{display:inline-flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--blue);border-radius:14px;padding:8px 14px;min-height:56px;font-weight:700;font-size:1.08rem;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 4px 0 #B8C8DE;cursor:grab}
.card.word{background:#EEF3FB}
.card.token{border-color:var(--teal)}
.card.sel{outline:4px solid var(--gold);transform:translateY(-2px)}
.card.lifted{opacity:.35}
.card.gone{display:none}
.card.placed{cursor:default;box-shadow:none;border-color:var(--good);background:var(--good-bg);font-size:1rem;min-height:46px;padding:4px 10px}
.card.crossed{opacity:.5;text-decoration:line-through;cursor:default;border-color:#B9B2A2;box-shadow:none}
.dragghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-60%) rotate(-3deg);opacity:.95;box-shadow:0 10px 24px rgba(0,0,0,.25)!important}
.ic{display:inline-grid;place-items:center;width:38px;height:38px;flex:none}
.ic svg{width:100%;height:100%}
.ic.lg{width:72px;height:72px}
.lab-done{background:var(--good-bg);border:2px solid var(--good);color:var(--good);border-radius:12px;padding:6px 12px;font-weight:700}
.target.glow{filter:drop-shadow(0 0 6px #F2C14E)}
.target.over{filter:drop-shadow(0 0 8px #E0674A)}
.lspot circle{fill:rgba(255,255,255,.75);stroke:#1D4E89;stroke-width:3;stroke-dasharray:5 4}
.lspot.full circle{fill:#E3F3E7;stroke:#1F7A45;stroke-dasharray:none}
.ltxt{font:700 16px var(--body);fill:#1F7A45;text-anchor:middle}
.pin circle{fill:#E0674A;stroke:#fff;stroke-width:4;cursor:pointer}
.pin text{font:700 26px var(--body);fill:#1E2A3A;paint-order:stroke;stroke:#fff;stroke-width:6px;pointer-events:none}
.pin.small text{font-size:17px;stroke-width:5px}
.pin.full circle{fill:var(--good)}
.map .india{cursor:pointer}

/* bins */
.sorter{display:grid;gap:14px;width:100%}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bins.line{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.bins.line{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bin{background:#F6FBF8;border:3px dashed #9CC8B8;border-radius:16px;min-height:130px;padding:8px;display:grid;align-content:start;gap:8px}
.bin-h{display:flex;gap:6px;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;color:var(--teal)}
.bins.line .bin:nth-child(1){background:#FCEDEA;border-color:#E9A698}.bins.line .bin:nth-child(2){background:#FFF4E2;border-color:#ECC686}
.bins.line .bin:nth-child(3){background:#EEF6E4;border-color:#B5D38F}.bins.line .bin:nth-child(4){background:#E6F2F8;border-color:#93C1DA}
.bin-body{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bin.shake{animation:shake .45s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* options */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.opts.wide{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:3px solid var(--blue);border-radius:16px;padding:10px 14px;min-height:60px;font-weight:700;font-size:1.1rem;box-shadow:0 4px 0 #B8C8DE}
.opt.no{opacity:.4;box-shadow:none;border-color:#B9B2A2;text-decoration:line-through}
.opt.right{background:var(--good-bg);border-color:var(--good);box-shadow:0 4px 0 #A6D3B2}
.q{display:grid;gap:10px;justify-items:center}
.q .opts{width:100%}

/* scenes */
.tappable{cursor:pointer}
.spot.nope{animation:nope .55s}
@keyframes nope{30%{opacity:.4}}
.spot.picked{filter:drop-shadow(0 0 10px #F2C14E)}
.branch.lit{stroke:#F2C14E}
.eyeslot{cursor:pointer}

/* day */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;width:100%;max-width:760px}
.dslot{background:#fff;border:3px dashed #ECC686;border-radius:14px;min-height:118px;padding:6px;display:grid;align-content:start;gap:6px}
.dslot-h{display:flex;gap:4px;align-items:center;justify-content:center;font-weight:700;color:var(--gold-d);font-size:1rem}
.dnum{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#F2C14E;color:#1E2A3A;font-size:.9rem;margin-right:4px}
.dslot.full{border-style:solid;border-color:var(--good)}
.dslot-b .card{font-size:.98rem}

/* estimate */
.est{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.pie{--p:50;width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--coral) calc(var(--p)*1%),#7DBE5A 0);border:4px solid #fff;box-shadow:0 3px 0 var(--line)}
.est-l{font-size:1.2rem;margin-bottom:6px}.big-num{font-size:1.5rem;color:var(--coral)}
input[type=range]{width:100%;height:44px;accent-color:var(--teal)}
.tilt{display:flex;gap:12px;align-items:center;font-weight:700;background:#EEF7F4;border-radius:14px;padding:6px 14px}

/* calendar */
.cal{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:820px}
@media (max-width:640px){.cal{grid-template-columns:1fr}}
.month{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px}
.mname{font-family:var(--display);font-weight:700;color:var(--blue);font-size:1.25rem;margin-bottom:6px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dname{font-size:.85rem;text-align:center;color:var(--muted);font-weight:700}
.day{position:relative;min-height:46px;border-radius:10px;border:2px solid #E8E1CF;background:#FFFDF7;font-weight:700;font-size:1.02rem;padding:0}
.day.egg,.day.hatch{background:#FFF3D4;border-color:var(--gold)}
.day.hatch{background:var(--good-bg);border-color:var(--good)}
.day .mk{position:absolute;right:2px;bottom:2px;width:20px;height:20px}
.day .mk svg{width:100%;height:100%}

/* plan */
.needs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.need{display:flex;align-items:center;gap:6px;background:#F2F2F0;border:2px solid #D8D6CF;border-radius:999px;padding:4px 12px 4px 6px;font-weight:700;opacity:.55;filter:grayscale(1)}
.need .ic{width:30px;height:30px}
.need.lit{opacity:1;filter:none;background:var(--good-bg);border-color:var(--good);color:var(--good)}
.place .zone{cursor:pointer}
.place .zone.glow{filter:drop-shadow(0 0 6px #F2C14E) brightness(1.06)}
.place .zone.over{filter:brightness(1.12) drop-shadow(0 0 6px #E0674A)}
.plan-tray .card{font-size:.95rem;min-height:48px;padding:5px 10px;gap:6px}
.plan-tray .ic{width:30px;height:30px}
.artbox.day svg{max-width:520px}

/* finale */
.notebook-cover{width:160px}
.notebook-cover svg{width:100%;display:block}
.cabinet{display:grid;align-items:start;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:10px}
.cab{text-align:left;background:linear-gradient(160deg,#10406E,#0E6E6A);color:#fff;border:0;border-radius:18px;padding:14px;min-height:96px;box-shadow:0 5px 0 #0A3550;display:grid;gap:8px;align-content:start}
.cab-f{display:flex;gap:10px;align-items:center;font-size:1.15rem}
.cab-eye svg{width:34px;height:40px;display:block}
.cab-b{display:none;font-size:1.05rem;line-height:1.45;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
.cab.open .cab-b{display:block}

/* won */
.won{display:flex;gap:12px;align-items:flex-start;background:var(--good-bg);border:3px solid var(--good);border-radius:16px;padding:12px 14px;font-size:1.12rem}
.won .tick{flex:none;width:40px;height:40px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center}
.won .tick svg{width:26px;height:26px}
.won p{margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

  function eyespot(x,y,s,rot){
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(0)}) scale(${s})"><ellipse rx="11" ry="14" fill="#C9A646"/><ellipse rx="8.6" ry="11" fill="#2E9E6B"/><ellipse rx="6.2" ry="8" fill="#26B3C2"/><ellipse rx="4" ry="5.4" fill="#13235C"/></g>`;

  // A peacock displaying his train, from the front.
  function cock(o){ o=o||{};
    const cx=160, cy=196; let fr='', st='', es='';
    for(let a=192;a<=348;a+=6){const r=a*Math.PI/180;

    [[148,192,348,12,1],[116,198,342,13,.88],[84,205,335,16,.74]].forEach(([R,a0,a1,step,s],k)=>{
      for(let a=a0+(k%2?step/2:0);a<=a1;a+=step){const r=a*Math.PI/180; es+=eyespot(cx+Math.cos(r)*R,cy+Math.sin(r)*R,s,a+90);}});
    fr=`<path d="M${cx-158} ${cy} A158 158 0 0 1 ${cx+158} ${cy} Z" fill="url(#fan${o.id||''})"/>`;

      ${fr}${st}${es}

    for(let i=0;i<46;i++){const y=34+i*6.4; const top=i<16; const w=top?(58+Math.sin(i/16*Math.PI)*16):Math.max(8,62*(1-(i-16)/34));

    return `<svg viewBox="0 0 300 360" class="art" role="img" aria-label="A peacock train feather">

/* tiny DOM helpers: text always goes in as text nodes; innerHTML only for the SVG strings authored in art.js */
function h(tag,a,...kids){const e=document.createElement(tag);if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;
  if(k==='class')e.className=v;else if(k==='on')for(const ev in v)e.addEventListener(ev,v[ev]);else if(k==='svg')e.innerHTML=v;else if(k==='style')e.style.cssText=v;else e.setAttribute(k,v===true?'':v);}
  kids.flat().forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);});return e;}
function rich(s){const f=document.createDocumentFragment();String(s).split(/(\*\*[^*]+\*\*)/).forEach(p=>{if(!p)return;if(p.startsWith('**')&&p.endsWith('**'))f.appendChild(h('b',null,p.slice(2,-2)));else f.appendChild(document.createTextNode(p));});return f;}
function P(s,cls){const p=h('p',{class:cls||null});p.appendChild(rich(s));return p;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- drag, or tap then tap ---------- */
function clearSel(){if(SEL){SEL.chip.classList.remove('sel');document.querySelectorAll('.target.glow').forEach(t=>t.classList.remove('glow'));}SEL=null;}
// What is actually under her finger wins. If nothing is, the smallest nearby target does (so a drop on the house isn't taken as the yard around it).
function hitTest(targets,x,y){const ok=t=>t&&targets.includes(t)&&!t.classList.contains('full');
  let el=document.elementFromPoint(x,y);while(el&&el!==document.body){if(el.classList&&el.classList.contains('target')){if(ok(el))return el;break;}el=el.parentNode;}
  let best=null,ba=Infinity;for(const t of targets){if(!ok(t))continue;const r=t.getBoundingClientRect();if(x>=r.left-6&&x<=r.right+6&&y>=r.top-6&&y<=r.bottom+6){const a=r.width*r.height;if(a<ba){ba=a;best=t;}}}return best;}
function draggable(chip,targets,drop,o){o=o||{};chip.classList.add('chip');chip.setAttribute('role','button');chip.tabIndex=0;
  chip.addEventListener('pointerdown',e=>{if(chip.classList.contains('used'))return;e.preventDefault();
    const sx=e.clientX,sy=e.clientY;let ghost=null,moved=false;try{chip.setPointerCapture(e.pointerId);}catch(_){}
    const move=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>9){moved=true;clearSel();ghost=chip.cloneNode(true);ghost.classList.add('dragghost');document.body.appendChild(ghost);chip.classList.add('lifted');}
      if(moved){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';const t=hitTest(targets(),ev.clientX,ev.clientY);targets().forEach(x=>x.classList.toggle('over',x===t));}};
    const up=ev=>{chip.removeEventListener('pointermove',move);chip.removeEventListener('pointerup',up);chip.removeEventListener('pointercancel',up);
      if(moved){ghost.remove();chip.classList.remove('lifted');targets().forEach(x=>x.classList.remove('over'));if(ev.type==='pointerup'){const t=hitTest(targets(),ev.clientX,ev.clientY);if(t)drop(chip,t);}}
      else if(ev.type==='pointerup'){const was=SEL&&SEL.chip===chip;clearSel();if(!was){SEL={chip,drop,targets};chip.classList.add('sel');if(o.glow!==false)targets().forEach(t=>{if(!t.classList.contains('full'))t.classList.add('glow');});}}};
    chip.addEventListener('pointermove',move);chip.addEventListener('pointerup',up);chip.addEventListener('pointercancel',up);});
  chip.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();clearSel();SEL={chip,drop,targets};chip.classList.add('sel');}});}
function target(el){el.classList.add('target');el.addEventListener('click',()=>{if(SEL&&SEL.targets().includes(el)){const s=SEL;clearSel();s.drop(s.chip,el);}});return el;}

/* ---------- reusable task shapes ---------- */
// Choose one answer. opts: {t, ok, why, icon}
function choose(o){
  const q=ask(o.item,o.concept,o.area);
  const box=h('div',{class:'opts'+(o.wide?' wide':'')});
  (o.shuffle===false?o.opts:shuffle(o.opts)).forEach(op=>{
    const b=h('button',{class:'opt',type:'button'},op.icon?icon(op.icon):null,h('span',null,op.t));
    b.addEventListener('click',()=>{if(b.disabled)return;
      if(op.ok){q.done();box.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add('right');o.then(op);}
      else{q.miss(op.t);b.disabled=true;b.classList.add('no');toast('hmm',op.why||'Not that one. Try another.',4200);}});
    box.appendChild(b);});
  return box;
}
// Choose several. Finished once every right answer is picked.
function chooseMany(o){
  const box=h('div',{class:'opts'+(o.wide?' wide':'')});const need=o.opts.filter(x=>x.ok).length;let got=0;
  const qs={};o.opts.filter(x=>x.ok).forEach(op=>{qs[op.t]=ask(o.item+': '+op.t,o.concept,o.area);});
  shuffle(o.opts).forEach(op=>{
    const b=h('button',{class:'opt',type:'button'},op.icon?icon(op.icon):null,h('span',null,op.t));
    b.addEventListener('click',()=>{if(b.disabled)return;b.disabled=true;
      if(op.ok){b.classList.add('right');qs[op.t].done();got++;if(op.why)toast('yes',op.why,2600);if(got===need){Object.values(qs).forEach(q=>q.done());o.then();}}
      else{Object.values(qs).forEach(q=>q.miss(op.t));b.classList.add('no');toast('hmm',op.why||'Not that one.',4200);}});
    box.appendChild(b);});
  return box;
}
// Sort cards into bins. items: {id,t,icon,bin,no:{binId:msg}}
function sorter(o){
  const bins=o.bins.map(b=>target(h('div',{class:'bin','data-bin':b.id},h('div',{class:'bin-h'},b.icon?icon(b.icon):null,h('span',null,b.t)),h('div',{class:'bin-body'}))));
  const tray=h('div',{class:'tray'});let left=o.items.length;
  shuffle(o.items).forEach(it=>{const q=ask(it.item||it.t,o.concept,o.area);
    const c=h('div',{class:'card'},it.icon?icon(it.icon):null,h('span',null,it.t));
    draggable(c,()=>bins,(chip,bin)=>{const id=bin.getAttribute('data-bin');
      if(id===it.bin){q.done();chip.classList.add('used','placed');bin.querySelector('.bin-body').appendChild(chip);left--;if(left===0)o.then();}
      else{q.miss(id);bin.classList.add('shake');setTimeout(()=>bin.classList.remove('shake'),500);toast('hmm',(it.no&&it.no[id])||o.no||'Not that one. Have another look.',4600);}});
    tray.appendChild(c);});
  const wrap=h('div',{class:'sorter'},h('div',{class:'bins '+(o.binsCls||'')},bins),tray);
  return wrap;
}
// Tap a spot in a scene. spots: {id, ok, why}
function tapScene(host,o){

  o.spots.forEach(sp=>{const el=host.querySelector(`[data-spot="${sp.id}"]`);if(!el)return;el.classList.add('tappable');

      else{q.miss(sp.id);el.classList.add('nope');setTimeout(()=>el.classList.remove('nope'),600);toast('hmm',sp.why,4600);}});});
}

  let items=[

T.eggs=function(F){
  const M=isM(),E=easy();

  const cal=h('div',{class:'cal'});
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const cells={};
  function month(name,first,len){const m=h('div',{class:'month'},h('div',{class:'mname'},name),h('div',{class:'grid'},days.map(d=>h('div',{class:'dname'},d)),...Array.from({length:first},()=>h('div',{class:'blank'})),
    ...Array.from({length:len},(_,i)=>{const id=name[0]+(i+1);const c=h('button',{class:'day',type:'button','data-d':id},String(i+1));cells[id]=c;return c;})));return m;}
  cal.append(month('November',6,30),month('December',1,13));
  F.pic.appendChild(cal);F.one();
  const egg='<svg viewBox="0 0 24 24"><ellipse cx="12" cy="13" rx="7" ry="9" fill="#F3EAD3" stroke="#B9A27A" stroke-width="1.5"/></svg>';
  const mark=(id,cls,svg)=>{const c=cells[id];c.classList.add(cls);if(svg){const s=h('span',{class:'mk',svg});c.appendChild(s);}};
  if(M){
    mark('N2','egg',egg);
    F.say('She lays **one egg every second day**. Her first egg was on Monday 2 November. Tap the days she lays the next eggs.');
    const want=E?['N4','N6']:['N4','N6','N8','N10'];let k=0;const q=ask('Egg every second day','Counting days on a calendar','MA');
    Object.entries(cells).forEach(([id,c])=>c.addEventListener('click',()=>{if(k>=want.length)return;
      if(id===want[k]){mark(id,'egg',egg);k++;if(k===want.length){q.done();setTimeout(hatch,700);}}
      else if(!c.classList.contains('egg')){q.miss(id);toast('hmm',`Count on two days from her last egg.`,2600);}}));
    F.help(['Every second day means skip one day, then lay.','From Monday 2, skip Tuesday 3. The next egg is Wednesday 4.','The eggs come on the 2nd, 4th, 6th, 8th and 10th.']);
    function hatch(){const last=want[want.length-1];const lastN=+last.slice(1);
      const hid='D'+(lastN+28-30);
      F.say(`Her last egg came on ${lastN} November. Suppose she sits on the eggs for **28 days**. That’s **4 weeks**. Tap the day the chicks hatch.`);
      F.help(['28 days is 4 whole weeks.','Each row of the calendar is one week. Go down 4 rows on the same day.',`Start on ${lastN} November and count down four rows.`]);
      const q2=ask('Hatching day, 28 days on','Counting days on a calendar','MA');let done=false;
      Object.entries(cells).forEach(([id,c])=>c.addEventListener('click',()=>{if(done||k<want.length)return;
        if(id===hid){done=true;q2.done();mark(id,'hatch','<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="#E3C48A"/><circle cx="15" cy="11" r="1.4" fill="#222"/></svg>');
          win(`Hatching day! Peachicks can walk as soon as they hatch, and follow their mum everywhere. Peahens sit for about 28 to 30 days.`);}
        else if(!c.classList.contains('egg')){q2.miss(id);toast('hmm','Four weeks is four rows down, on the same day of the week.',3000);}}));}
  } else {
    mark('N2','egg',egg);
    F.say('She lays 5 eggs, **one every second day**, the first on Monday 2 November. Suppose she starts sitting the day she lays her last egg. Eggs hatch **28 to 30 days** later. Tap every day the chicks could hatch.');
    const want=['D8','D9','D10'];const got=new Set();const q=ask('Hatching window, 28 to 30 days','Counting days on a calendar','MA');
    Object.entries(cells).forEach(([id,c])=>c.addEventListener('click',()=>{if(got.size===3||id==='N2')return;
      if(want.includes(id)){if(got.has(id))return;got.add(id);mark(id,'hatch');if(got.size===3){q.done();win('8, 9 or 10 December. Her eggs come on the 2nd, 4th, 6th, 8th and 10th of November, so she starts sitting on the 10th. 28 days on is 8 December, 30 days on is 10 December.');}}
      else{q.miss(id);const m=id[0],d=+id.slice(1);
        if((m==='N'&&d===30)||(m==='D'&&d<=2))toast('hmm','That counts from her **first** egg. She starts sitting once the **last** egg is laid.',4200);
        else if(m==='D'&&d<8)toast('hmm','Too early. Work out the day of her last egg first, then add 28.',3600);
        else toast('hmm','Too late. That’s more than 30 days after her last egg.',3200);}}));
    F.help(['First find the day of her 5th egg.','Eggs on the 2nd, 4th, 6th, 8th and 10th November. Then count on 28 to 30 days.','28 days is exactly 4 weeks: four rows down from 10 November. Then add one and two more days.']);
  }
};

  shrubs:{t:'Plant a clump of shrubs',icon:'shrub',zones:['paddock','orchard','yard','garden'],needs:['nest'],ok:'Shrubs give cover for a nest.'},

const NEEDS={roost:['Roost','tree'],water:['Water','water'],food:['Food','food'],nest:['Nest cover','nest'],dust:['Dust bath','dust'],safety:['Safety','dog'],garden:['Garden safe','garden']};
const ZONEN={gums:'the tall gums',paddock:'the paddock',orchard:'the orchard',yard:'the yard',garden:'the veggie garden',house:'the house',chooks:'the chook pen'};
function planNeeds(){const M=isM(),E=easy();return E?['roost','water','food','nest']:(M?['roost','water','food','nest','dust','safety']:['roost','water','food','nest','dust','safety','garden']);}
function planItems(){const M=isM(),E=easy();return E?['gums','water','grass','dogs','bread']:(M?['gums','water','grass','shrubs','dust','dogs','wire','bread']:['gums','water','grass','shrubs','dust','dogs','wire','bread','chookfeed']);}
function drawPlan(svg,placed){const NS='http://www.w3.org/2000/svg';svg.querySelectorAll('.placed-ic').forEach(x=>x.remove());
  const A={gums:[14,8],paddock:[200,96],chooks:[40,150],orchard:[22,272],yard:[240,350],house:[392,300],garden:[446,272]};
  const count={};placed.forEach(p=>{if(!A[p.zone])return;count[p.zone]=(count[p.zone]||0)+1;const n=count[p.zone]-1;
    const g=document.createElementNS(NS,'g');g.setAttribute('class','placed-ic');const s=40;
    const x=A[p.zone][0]+(n%4)*(s+8),y=A[p.zone][1]+Math.floor(n/4)*(s+8);
    g.innerHTML=`<rect x="${x-3}" y="${y-3}" width="${s+6}" height="${s+6}" rx="10" fill="#fff" stroke="#1E2A3A" stroke-width="2"/><svg x="${x}" y="${y}" width="${s}" height="${s}">${ART.ICON[ITEMS[p.item].icon].replace('<svg ','<svg width="100%" height="100%" ')}</svg>`;svg.appendChild(g);});}

T.plan=function(F){
  const M=isM(),E=easy();
  F.say(M?'Drag each idea onto our place. Light up all her needs!':'Plan our place. Drag each idea to the best spot. Some ideas aren’t good ones: decide for yourself. Light up all her needs.');
  const box=pic(ART.place(),'wide placebox');F.pic.appendChild(box);F.stage.classList.add('plan');
  const svg=box.querySelector('svg');
  const zones=[...svg.querySelectorAll('[data-zone]')].map(z=>target(z));
  const want=planNeeds();
  const met=new Set();let won=false;
  const bar=h('div',{class:'needs'},want.map(n=>h('div',{class:'need','data-n':n},icon(NEEDS[n][1]),h('span',null,NEEDS[n][0]))));
  F.pic.insertBefore(bar,box);
  // Keep what she has already placed, if she left part-way and came back
  const items=planItems();
  S.plan=(S.plan||[]).filter(p=>items.includes(p.item)&&ITEMS[p.item].zones.includes(p.zone));save();
  const already=new Set(S.plan.map(p=>p.item));
  const lightUp=k=>ITEMS[k].needs.forEach(n=>{met.add(n);const el=bar.querySelector(`[data-n="${n}"]`);if(el)el.classList.add('lit');});
  drawPlan(svg,S.plan);S.plan.forEach(p=>lightUp(p.item));
  const tray=h('div',{class:'tray plan-tray'});
  const qBread=ask('Choosing natural food over scraps','Making a place peafowl-friendly','SC');
  let qChook=null;if(!M&&!E)qChook=ask('Keeping peafowl and chooks apart','Making a place peafowl-friendly','SC');
  items.forEach(k=>{const it=ITEMS[k];if(already.has(k))return;const q=it.zones.length?ask('Plan: '+it.t,'Making a place peafowl-friendly','SC'):null;
    const c=h('div',{class:'card'},icon(it.icon),h('span',null,it.t));
    if(!it.zones.length){c.addEventListener('click',()=>{if(c.classList.contains('used'))return;tryBad();});}
    function tryBad(){c.classList.add('used','crossed');(k==='bread'?qBread:qChook).miss(k);toast('hmm',it.no,5200);}
    draggable(c,()=>zones,(chip,z)=>{const zone=z.getAttribute('data-zone');
      if(!it.zones.length){tryBad();return;}
      if(it.zones.includes(zone)){q.done();chip.classList.add('used','gone');S.plan.push({item:k,zone});save();drawPlan(svg,S.plan);
        lightUp(k);toast('yes',it.ok,3000);check();}
      else{q.miss(zone);toast('hmm',zoneMsg(k,zone),4200);}},{glow:M});
    tray.appendChild(c);});
  F.side.appendChild(tray);
  if(S.plan.length)toast('yes','Welcome back! Your plan is just as you left it.',3000);
  check();
  F.help(['Look at the needs at the top. Which idea lights up each one?','Long grass helps with two needs at once. Where on our place could grass grow long?',M?'Tall gums → the gums. Long grass → the paddock. Dogs inside → the house.':'Some ideas sound kind but cause problems. Think about the garden and the chooks.']);
  function zoneMsg(k,zone){
    if(k==='gums')return 'The tall gums are along the fence line, at the top of the map.';
    if(k==='dogs')return 'Dogs inside means… in the house!';
    if(k==='wire')return 'The wire goes over the veggie seedlings.';
    if(k==='grass'&&zone==='garden')return 'We need the veggie garden for veggies. Where could grass grow long without getting in the way?';
    if(k==='grass')return `Long grass in ${ZONEN[zone]}? It’s mown or busy there. Try the paddock or the orchard.`;
    if(zone==='chooks')return 'Keep her things out of the chook pen. Peafowl and chooks are best kept apart.';
    if(zone==='house'||zone==='gums')return `That doesn’t fit in ${ZONEN[zone]}. Try somewhere out on the ground.`;
    return 'Try another spot.';}
  function check(){if(!won&&want.every(n=>met.has(n))){won=true;qBread.done();if(qChook)qChook.done();
    setTimeout(()=>win(M?'Every need is lit up! Our place would suit a peafowl.':'Every need is lit up. Our place could welcome a peafowl, and the veggies and chooks are looked after too.'),900);}}
};

T.recall=function(F){
  const M=isM(),E=easy();
  const Qs=M?[
    {q:'Where did peafowl first come from?',item:'Recall: homeland',concept:'Peafowl come from India',area:'HSS',opts:[{t:'India',ok:true},{t:'England',why:'Remember her family name: the Indian peafowl.'},{t:'Africa',why:'Remember her family name: the Indian peafowl.'}]},
    {q:'Where does she sleep at night?',item:'Recall: roost',concept:'Roosting high in trees',opts:[{t:'High in a tall tree',icon:'tree',ok:true},{t:'On the ground',icon:'grass',why:'That’s where her nest is, not where she sleeps.'},{t:'Under a bush',icon:'shrub',why:'Too easy for a fox to reach.'}]},
    {q:'How long does a peahen sit on her eggs?',item:'Recall: sitting time',concept:'Peahen sits 28 to 30 days',opts:[{t:'About 4 weeks',ok:true},{t:'About 1 week',why:'Much longer: we counted 4 rows down the calendar.'},{t:'About 4 months',why:'Not that long! We counted 4 rows down the calendar.'}]},
    {q:'What kind of bath does she take?',item:'Recall: dust bath',concept:'Dust baths, not water baths',opts:[{t:'A dust bath',icon:'dust',ok:true},{t:'A water bath',icon:'water',why:'Wet feathers are heavy. She avoids water.'}]}
  ]:[
    {q:'Why do we think she lives near us?',item:'Recall: where she lives',concept:'Reasoning from evidence',opts:[{t:'Peafowl stay close to home, and many country people keep them',ok:true},{t:'Peafowl migrate south in spring',why:'Peafowl don’t migrate. They stay close to home.'},{t:'She came in on the wind',why:'Peafowl only fly short, low hops.'}]},
    {q:'Where does a peacock’s blue come from?',item:'Recall: structural colour',concept:'Colour from feather structure',opts:[{t:'Tiny shapes in the feather that bend light',ok:true},{t:'Blue pigment, like paint',why:'There’s no blue pigment. Remember the tilting feather.'},{t:'The sky reflecting',why:'Close, it is about light, but the shapes are in the feather itself.'}]},
    {q:'Another peahen starts sitting on Tuesday 1 December. What’s the earliest her chicks could hatch?',item:'Recall: apply 28 days',concept:'Counting days on a calendar',area:'MA',opts:[{t:'Tuesday 29 December',ok:true},{t:'Thursday 31 December',why:'That’s the latest, 30 days. What’s the earliest?'},{t:'Tuesday 8 December',why:'That’s only one week.'},{t:'Friday 1 January',why:'That’s 31 days, a day too late.'}]},
    {q:'Which idea on our plan gives her a hidden nest?',item:'Recall: nest cover',concept:'Where peahens nest',opts:[{t:'Long grass and shrubs',ok:true},{t:'The tall gums',why:'The gums are where she sleeps. Her nest is on the ground.'},{t:'The water trough',why:'That’s for drinking.'}]}
  ];
  const list=E?Qs.slice(0,3):Qs;let i=0;
  F.pic.appendChild(h('div',{class:'notebook-cover',svg:ART.face()}));
  function show(){F.side.textContent='';const Q=list[i];F.say(`Field notebook, ${i+1} of ${list.length}: ${Q.q}`);F.help(['Think back to what you found out.','Picture the stop where you learnt it.']);
    F.side.appendChild(choose({item:Q.item,concept:Q.concept,area:Q.area||'SC',opts:Q.opts,wide:true,then:()=>{i++;if(i<list.length)setTimeout(show,700);else win('Notebook complete. That’s a lot to remember about one visiting bird!');}}));}
  show();
};

function sisterPlan(){const other=PLAYER==='maeve'?'maggie':'maeve';
  try{const k=SAVE+'::'+(G.testing&&G.testing()?'test-':'')+other;const o=JSON.parse(localStorage.getItem(k)||'{}');return o.plan&&o.plan.length?{who:other==='maeve'?'Maeve':'Maggie',plan:o.plan}:null;}catch(e){return null;}}

T.debrief=function(F){
  const M=isM();
  F.say('Mystery solved!');F.one();
  F.pic.appendChild(pic(ART.hen({id:'db'}),'mid'));
  F.pic.appendChild(h('div',{class:'solved'},
    h('div',{class:'sv'},h('b',null,'Who? '),'An Indian peafowl hen.'),
    h('div',{class:'sv'},h('b',null,'Where from? '),'Most likely a property near us.'),
    h('div',{class:'sv'},h('b',null,'Why now? '),'It’s nesting season, September to January.')));
  const sis=sisterPlan();
  if(sis){const box=pic(ART.place(),'wide placebox small');drawPlan(box.querySelector('svg'),sis.plan);
    F.pic.append(h('h3',{class:'sub'},sis.who+'’s plan'),box,P(`Compare your plans together. What did ${sis.who} think of that you didn’t?`,'note'));}
  const parts2=[
    h('h3',{class:'sub'},'Tell it back'),
    P(M?'Tell Mum or Dad three things about our visitor: one from the start, one from the middle, one from the end.':'Tell Mum or Dad which piece of evidence convinced you most about where she lives, and why.'),
    h('h3',{class:'sub'},'Now go outside together'),
    P('Find the tallest tree on our place she could roost in, and one spot where she could hide a nest. If you ever find a real nest, leave it alone and watch from far away.'),
    h('h3',{class:'sub'},'A question for another day'),
    P('Will she come back? If she does, watch at dusk which way she goes.')];
  F.side.append(...parts2);
  const ta=h('textarea',{rows:3,maxlength:500,placeholder:M?'If you like, type a question you still have.':'What would you most like to find out next?','aria-label':'A question I still have'});ta.value=S.writing.question||'';
  ta.addEventListener('input',()=>{S.writing.question=ta.value;save();G.write({game:GAME,part:'Field notebook',area:'SC',prompt:'A question I still have about peafowl',text:ta.value});});
  F.side.append(ta,h('div',{class:'next-row'},
    h('button',{class:'btn ghost',type:'button',on:{click:()=>{cabinet();}}},'Curiosity cabinet'),
    h('button',{class:'btn',type:'button',on:{click:()=>{finishGame();}}},'Finish')));
};
function finishGame(){const ps=parts(),p=ps[S.part];if(!S.done[p.id]){S.done[p.id]=true;G.partDone(p.title);}
  if(!S.finished){S.finished=true;G.finish();}S.part=null;save();render();}

/* ---------- curiosity cabinet: extra true stories, read if you like ---------- */
function cabinet(){app.textContent='';
  const cards=[
    ['Juno and Argus','In Ovid’s Metamorphoses, the goddess Juno sets the hundred eyes of her watchman Argus in her peacock’s tail: “Saturn’s daughter spread their glister on the feathers of her bird, emblazoning its tail with starry gems.” (Book 1, translated by Brookes More, 1922)'],
    ['Augustine’s peacock','About 1,600 years ago, Saint Augustine kept a slice of roast peacock to see if it would go bad. After a year it had only dried and shrunk a little. He asked, “who but God the Creator of all things has given to the flesh of the peacock its antiseptic property?” (The City of God, Book 21, translated by Marcus Dods)'],
    ['Solomon’s ships','The Bible says King Solomon’s ships came home every three years “bringing gold, and silver, ivory, and apes, and peacocks.” (1 Kings 10:22, King James Version)'],
    ['Darwin’s puzzle','The train seemed useless for staying alive, which troubled Charles Darwin. It led to his idea that some features grow because they help win a mate.'],
    ['India’s bird','The Indian peafowl is the national bird of India. In Hindu stories the god Kartikeya rides a peacock, and Krishna wears a peacock feather in his crown.'],
    ['White peafowl','Some peafowl are pure white. They aren’t albinos: they have dark eyes.'],
    ['Snake fighters','In India, peafowl eat small snakes. Two were once seen pecking at and teasing a cobra.'],
    ['An Australian word','In colonial Australia, “peacocking” meant buying up the best bits of land, like the spots by a river, so the land around them was worth less to anyone else.']];
  const grid=h('div',{class:'cabinet'},cards.map(([t,b])=>{const c=h('button',{class:'cab',type:'button'},h('div',{class:'cab-f'},h('div',{class:'cab-eye',svg:'<svg viewBox="-14 -17 28 34"><ellipse rx="11" ry="14" fill="#C9A646"/><ellipse rx="8.6" ry="11" fill="#2E9E6B"/><ellipse rx="6.2" ry="8" fill="#26B3C2"/><ellipse rx="4" ry="5.4" fill="#13235C"/></svg>'}),h('b',null,t)),h('div',{class:'cab-b'},b));
    c.addEventListener('click',()=>c.classList.toggle('open'));return c;}));
  app.append(whoBar(),h('div',{class:'panel'},h('div',{class:'head'},h('button',{class:'back',type:'button',on:{click:()=>render()}},'← Back'),h('h2',null,'Curiosity cabinet')),
    P('True stories about peafowl from long ago and far away. Tap a drawer to open it. Read as many as you like.'),grid));
}

/* ---------- screens ---------- */
function whoBar(){const w=h('div',{class:'top'},h('div',{class:'brand',svg:''}),h('div',{class:'who'}));
  const brand=w.firstChild;brand.appendChild(h('span',{class:'bface',svg:ART.face()}));brand.appendChild(h('h1',null,'The Peahen’s Visit'));
  if(PLAYER!=='unknown'){const who=w.lastChild;who.appendChild(h('span',{class:'chip-t'},'Playing: '+(PLAYER==='maeve'?'Maeve':'Maggie')));
    if(isM()){const b=h('button',{class:'chip-t',type:'button','aria-pressed':String(!!S.easy)},S.easy?'Easier version: on':'Easier version: off');
      b.addEventListener('click',()=>{S.easy=!S.easy;save();render();});who.appendChild(b);}}
  return w;}
function whoScreen(){app.textContent='';
  const set=p=>{try{sessionStorage.setItem('gamesroom-player',p);localStorage.setItem('gamesroom-last-player',p);}catch(e){}PLAYER=p;KEY=G.key(SAVE);S=load();render();};
  app.append(whoBar(),h('div',{class:'panel center'},h('h2',null,'Who is playing?'),h('div',{class:'row center'},
    h('button',{class:'btn big',type:'button',style:'background:#E2557A',on:{click:()=>set('maggie')}},'Maggie'),
    h('button',{class:'btn big',type:'button',style:'background:#16A08F',on:{click:()=>set('maeve')}},'Maeve'))));}
function nameScreen(){app.textContent='';
  const names=['Juno','Penny','Hazel','Opal'];
  const inp=h('input',{type:'text',maxlength:16,placeholder:'Or type a name','aria-label':'Type a name for the peahen'});
  const go=n=>{n=String(n||'').trim().slice(0,16);if(!n)return;S.name=n;save();render();};
  app.append(whoBar(),h('div',{class:'panel'},h('div',{class:'intro'},pic(ART.hen({id:'nm'}),'big'),h('div',null,
    h('h2',null,'A peahen came to visit!'),P('Who is she? Where did she come from? And how could we make her want to stay?'),
    h('h3',{class:'sub'},'First, give her a name.'),
    h('div',{class:'row'},names.map(n=>h('button',{class:'btn ghost',type:'button',on:{click:()=>go(n)}},n))),
    h('div',{class:'row'},inp,h('button',{class:'btn',type:'button',on:{click:()=>go(inp.value)}},'Use this name'))))));}
function unlocked(i){const ps=parts();return i===0||S.done[ps[i-1].id]||S.done[ps[i].id];}
function home(){app.textContent='';const ps=parts();
  const list=h('div',{class:'stops'},ps.map((p,i)=>{const open=unlocked(i),done=!!S.done[p.id];
    const b=h('button',{class:'stop'+(done?' done':'')+(open?'':' locked'),type:'button',disabled:!open,style:`--c:${p.col}`},
      h('span',{class:'num'},done?'✓':String(i+1)),h('span',{class:'st'},h('b',null,p.title),h('small',null,p.blurb)));
    if(open)b.addEventListener('click',()=>{S.part=i;S.task=0;save();G.start(GAME);G.part(p.title);render();});return b;}));
  const doneN=ps.filter(p=>S.done[p.id]).length;
  app.append(whoBar(),h('div',{class:'panel'},h('div',{class:'intro'},pic(ART.hen({id:'hm'}),'big'),h('div',null,
    h('h2',null,`${Nm()} came to visit`),P(S.finished?'You solved the mystery and planned our place. Well done!':'Who is she? Where did she come from? And how could we make her want to stay? Six stops to find out.'),
    list,P(doneN&&!S.finished?'Everything is saved. You can stop and come back any time.':'','note'),
    S.finished?h('div',{class:'row'},h('button',{class:'btn ghost',type:'button',on:{click:cabinet}},'Curiosity cabinet')):null))));}
function advance(){const ps=parts(),p=ps[S.part];S.task++;
  if(S.task>=p.tasks.length){if(!S.done[p.id]){S.done[p.id]=true;G.partDone(p.title);}save();return partEnd();}
  save();render();}
function partEnd(){const ps=parts(),i=S.part,p=ps[i],last=i===ps.length-1;app.textContent='';
  app.append(whoBar(),h('div',{class:'panel center'},h('div',{class:'big-tick',style:`--c:${p.col}`},'✓'),h('h2',null,p.title+': done!'),
    P('You can stop here. Everything is saved.','note'),
    h('div',{class:'row center'},h('button',{class:'btn ghost',type:'button',on:{click:()=>{S.part=null;save();render();}}},'All stops'),
      last?null:h('button',{class:'btn',type:'button',on:{click:()=>{S.part=i+1;S.task=0;save();G.part(ps[i+1].title);render();}}},'Next: '+ps[i+1].title+' →'))));}
function playTask(){const ps=parts();const p=ps[S.part];if(!p){S.part=null;return home();}
  if(S.task>=p.tasks.length)S.task=0;G.start(GAME);G.part(p.title);const f=frame();p.tasks[S.task](f);}
function render(){window.scrollTo(0,0);if(PLAYER==='unknown')return whoScreen();if(!S.name)return nameScreen();if(S.part==null)return home();playTask();}
window.PV={state:()=>S,go(part,task){S.part=part;S.task=task||0;save();render();},setEasy(v){S.easy=v;save();render();},parts};
render();
