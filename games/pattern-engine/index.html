<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>The Pattern Engine</title>
<script src="../../results.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
/* An inventor's workshop in 1843: linen cloth, cream punched cards, indigo thread and brass.
   Version 2: one picture per step, one short line from Bobbin, feedback on the picture. */
:root{
  --paper:#F5EFE2; --paper-2:#EADFC8; --ink:#1E2440; --muted:#5E5A52; --line:#DCCFB4;
  --deep:#26306B; --thread:#2F3C8F; --brass:#A87A22; --brass-d:#7C5913; --card:#FFFBF0; --card-edge:#8A7550;
  --madder:#A8322A; --good:#2C7A47; --good-bg:#E4F2E6; --soft:#FBF6EA; --hmm-bg:#FFF4D6;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Andika","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:1.15rem;line-height:1.45;background-color:var(--paper);
  background-image:repeating-linear-gradient(0deg,rgba(120,95,50,.035) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,rgba(120,95,50,.035) 0 1px,transparent 1px 4px)}
.wrap{max-width:1100px;margin:0 auto;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(84px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0 0 .6em}

.top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;padding:4px 0 10px;margin-bottom:12px;border-bottom:3px solid var(--deep)}
.brand{display:flex;gap:12px;align-items:center}
.brand svg{width:46px;height:46px;flex:none}
.brand h1{font-size:clamp(1.5rem,4.2vw,2.2rem);color:var(--deep)}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:1rem}
.chip-t{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;min-height:44px}
.chip-t[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}

.panel{background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);padding:14px 16px 18px}
.head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.head h2{font-size:clamp(1.3rem,3.8vw,1.8rem);color:var(--deep)}
.back{background:#fff;border:2px solid var(--deep);border-radius:999px;padding:6px 16px;min-height:46px;font-size:1rem}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--paper-2);border:2px solid var(--line)}
.dots i.on{background:var(--deep);border-color:var(--deep)}

/* Bobbin says one line */
.bubble{display:flex;gap:10px;align-items:center;min-height:56px}
.bubble .face{flex:none;width:54px;height:54px;border-radius:50%;background:var(--paper);border:2px solid var(--brass);display:grid;place-items:center}
.bubble .face svg{width:44px;height:44px}
.bubble p{flex:1;margin:0;font-size:1.3rem;line-height:1.3;font-weight:700;background:var(--soft);border-radius:14px;padding:8px 14px;border:2px solid var(--line)}
.bubble p b{color:var(--deep)}
.qbtn{flex:none;width:50px;height:50px;border-radius:50%;border:2px solid var(--brass);background:var(--hmm-bg);font-weight:700;font-size:1.35rem;color:var(--ink)}
.qbtn[disabled]{opacity:.3;cursor:default}
.clue{margin:8px 0 0 64px;background:var(--hmm-bg);border-radius:12px;padding:8px 12px;font-size:1.08rem}
.clue .mini{margin-top:6px}

.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start;margin-top:12px}
.stage.one{grid-template-columns:1fr}
@media (max-width:860px){.stage{grid-template-columns:1fr}}
.pic{position:relative;display:grid;justify-items:center;gap:6px}
.side{min-width:0}
.toast{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);max-width:92%;width:max-content;padding:10px 18px;border-radius:16px;font-weight:700;font-size:1.2rem;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.18);z-index:20;pointer-events:none}
.toast.yes{background:var(--good-bg);color:var(--good);border:3px solid var(--good)}
.toast.hmm{background:var(--hmm-bg);color:#6d4410;border:3px solid #E3BE5C}

.btn{font-family:var(--body);font-weight:700;font-size:1.15rem;background:var(--deep);color:#fff;border:0;border-radius:999px;padding:.45em 1.3em;min-height:54px;box-shadow:0 4px 0 #141a40;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #141a40}
.btn.brass{background:var(--brass);box-shadow:0 4px 0 var(--brass-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.small{font-size:1rem;min-height:46px;padding:.3em 1em}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.next-row{margin-top:14px;display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.note{font-size:.95rem;color:var(--muted)}

/* the cloth */
.cloth{--c:6;--r:6;position:relative;display:grid;grid-template-columns:repeat(var(--c),1fr);width:100%;max-width:min(480px,calc(56vh * var(--c) / var(--r)));aspect-ratio:var(--c)/var(--r);
  background:#FBF7EC;border:3px solid var(--card-edge);border-radius:8px;box-shadow:0 4px 0 var(--line)}
.cell{position:relative;border:1px solid #E6DCC5;background:repeating-linear-gradient(45deg,transparent 0 3px,rgba(140,110,60,.05) 3px 4px)}
.cell.t::after{content:"";position:absolute;inset:12%;border:2.5px dotted #8C7A55;border-radius:4px;background:rgba(168,122,34,.09)}
.cell.st{box-shadow:inset 0 0 0 3px rgba(38,48,107,.35)}
.cell svg{position:absolute;inset:14%;width:72%;height:72%;color:var(--thread);z-index:1}
.cell.off svg{color:var(--madder)}
.cell.m::before{content:"";position:absolute;inset:26%;border-radius:50%;border:3px solid #6F6A60;background:rgba(255,255,255,.75);z-index:2}
.cell.no{animation:no .6s}
@keyframes no{30%{background:#F6D7D2}}
.cell.tap{cursor:pointer}
.needle{position:absolute;width:calc(100% / var(--c) * .62);aspect-ratio:1;transform:translate(-50%,-50%);transition:left .3s ease,top .3s ease;z-index:3;pointer-events:none}
.needle .rot{width:100%;height:100%;transform:rotate(var(--rot,0deg));transition:transform .3s ease}
.needle svg{width:100%;height:100%}
.needle.bump{animation:bump .45s}
@keyframes bump{20%{margin-left:-6px}40%{margin-left:6px}60%{margin-left:-4px}80%{margin-left:3px}}
.round{min-height:1.5em;font-size:1rem;color:var(--muted)}

/* punched cards */
.code{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;min-height:96px;padding:10px;border:2px dashed var(--line);border-radius:12px;background:var(--soft)}
.code.empty::before{content:attr(data-empty);color:var(--muted);font-size:1rem;align-self:center}
.card{position:relative;width:70px;min-height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card);border:2px solid var(--card-edge);border-radius:6px;padding:12px 4px 6px;box-shadow:0 3px 0 var(--line);font-size:.78rem;font-weight:700;color:var(--ink);line-height:1.1;text-align:center}
.card::before{content:"";position:absolute;top:4px;left:8px;right:8px;height:4px;background:radial-gradient(circle,#8A7550 1.4px,transparent 1.8px) 0 0/8px 4px repeat-x;opacity:.55}
.card .ic{width:34px;height:34px}
.card .ic svg,.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.card .n{position:absolute;top:-10px;left:-8px;min-width:24px;height:24px;border-radius:12px;background:var(--deep);color:#fff;font-size:.8rem;display:grid;place-items:center;padding:0 5px}
.card.now{border-color:var(--brass);background:#FFF1C9;box-shadow:0 0 0 3px var(--brass)}
.card.sel{border-color:var(--madder);box-shadow:0 0 0 3px var(--madder)}
.card.pick{border-color:var(--good);background:var(--good-bg);box-shadow:0 0 0 3px var(--good)}
.card.turn{background:repeating-linear-gradient(45deg,var(--card) 0 6px,#F3EAD3 6px 8px)}
.card.rep{width:auto;min-width:84px}
.tray{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.tray .card{width:82px;min-height:90px;font-size:.85rem}
.tray .card:active{transform:translateY(2px)}
.tray .card[disabled]{opacity:.35}
.mini{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;vertical-align:middle}
.mini .card{width:42px;min-height:46px;padding:8px 2px 3px;font-size:0}
.mini .card .ic{width:24px;height:24px}
.mini .card::before{display:none}
.mini .repm{display:inline-flex;gap:4px;align-items:center;border:2px solid var(--brass);border-radius:8px;padding:3px 6px;background:#FFF6DD;font-size:.85rem;font-weight:700}
.repblock{display:flex;flex-direction:column;gap:6px;border:3px solid var(--brass);border-radius:10px;padding:6px 8px 8px;background:#FFF6DD}
.repblock.open{box-shadow:0 0 0 3px rgba(168,122,34,.35)}
.rephead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1rem}
.rephead button{width:42px;height:42px;border-radius:50%;border:2px solid var(--brass-d);background:#fff;font-weight:700;font-size:1.25rem}
.rephead .cnt{min-width:1.4em;text-align:center;font-size:1.35rem}
.repbody{display:flex;flex-wrap:wrap;gap:8px;min-height:88px;min-width:120px;padding:6px;border:2px dashed var(--brass);border-radius:8px}
.repbody.empty::before{content:"Tap cards to put them in here";color:var(--brass-d);font-size:.95rem;align-self:center}
.edit{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding:10px;border:2px solid var(--madder);border-radius:12px;background:#FFF4F2}
.edit .card{width:60px;min-height:66px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.budget{font-size:1rem;color:var(--muted);margin-top:6px}
.budget b{color:var(--ink)}

/* picture tiles */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:1.1rem;font-weight:700;box-shadow:0 3px 0 var(--line)}
.opt.no{opacity:.35;box-shadow:none}
.opt.yes{border-color:var(--good);background:var(--good-bg)}
.opt svg.th{width:100%;max-width:170px;height:auto}

/* drag or tap */
.chip{touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border:3px solid var(--deep);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:.95rem;line-height:1.15;text-align:center;box-shadow:0 4px 0 var(--line);position:relative}
.chip.lift{z-index:60;box-shadow:0 10px 18px rgba(0,0,0,.25)}
.chip.sel{box-shadow:0 0 0 4px var(--brass),0 4px 0 var(--line)}
.chip.used{visibility:hidden}
.chip.shake{animation:shake .45s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.slot.cando{outline:3px dashed var(--brass);outline-offset:2px}
.slot.over{outline:4px solid var(--good)}

/* the story strip */
.timeline{display:grid;grid-template-columns:repeat(var(--k),minmax(0,1fr));gap:10px;width:100%;position:relative;padding-top:10px}
.timeline::before{content:"";position:absolute;left:4px;right:4px;top:0;height:4px;background:var(--brass);border-radius:2px}
.slot{min-height:150px;border:3px dashed var(--line);border-radius:14px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;font-weight:700;font-size:.95rem}
.slot .num{font-family:var(--display);font-size:1.6rem;color:var(--line)}
.slot.filled{border-style:solid;border-color:var(--good);background:#fff}
.slot .yr{font-family:var(--display);color:var(--brass-d);font-size:1.15rem}
.slot svg,.chip svg.pn{width:100%;max-width:150px;height:auto}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;width:100%;margin-top:14px}

/* the loom */
.loom{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start;width:100%}
@media (max-width:600px){.loom{grid-template-columns:1fr}}
.chain{display:flex;flex-direction:column;gap:6px;align-items:center;min-width:96px;padding:8px;border:2px dashed var(--line);border-radius:12px;background:var(--soft)}
.chain .lab{font-size:.85rem;color:var(--muted);font-weight:700}
.minicard{display:flex;gap:3px;padding:6px 6px 5px;background:var(--card);border:2px solid var(--card-edge);border-radius:4px}
.minicard i{width:9px;height:9px;border-radius:50%;border:1.5px solid #C9B98F;background:#fff}
.minicard i.h{background:#2a2118;border-color:#2a2118}
button.minicard{cursor:pointer}
.minicard.pick{box-shadow:0 0 0 3px var(--good)}
.frame{display:grid;justify-items:center;gap:8px;width:100%}
.beam{width:min(100%,460px);height:14px;border-radius:4px;background:linear-gradient(#9C7429,#6F4F12)}
.weave{--n:5;--rr:4;display:grid;grid-template-columns:repeat(var(--n),1fr);width:min(100%,430px);aspect-ratio:var(--n)/var(--rr);
  background:repeating-linear-gradient(90deg,#F7F0DE 0 calc(100%/var(--n) - 3px),#B8A77C calc(100%/var(--n) - 3px) calc(100%/var(--n)));border:2px solid #B8A77C}
.wc{position:relative;border-bottom:1px solid #E5D9BB}
.wc.t::after{content:"";position:absolute;inset:14%;border:2.5px dotted #8C7A55;border-radius:3px}
.wc.on{background:repeating-linear-gradient(0deg,var(--thread) 0 5px,#3d4a9e 5px 7px);border-radius:2px}
.wc.bad{outline:3px dashed var(--madder);outline-offset:-5px}
.wc.row-now{box-shadow:inset 0 3px 0 rgba(168,122,34,.0)}
.rowmark{position:absolute;left:-28px;font-size:1.3rem;color:var(--brass-d)}
.pcard{display:flex;gap:10px;justify-content:center;padding:14px 16px 12px;background:var(--card);border:3px solid var(--card-edge);border-radius:8px;box-shadow:0 4px 0 var(--line);width:min(100%,430px)}
.hole{width:52px;height:52px;border-radius:50%;border:3px dashed #B8A77C;background:#fff;display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-weight:700}
.hole[aria-pressed="true"]{background:#2a2118;border:3px solid #2a2118;color:#fff}

/* repeat slider and beads */
.slide{display:flex;align-items:center;gap:12px;background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:6px 16px;margin-top:12px}
.slide input{flex:1;height:48px;accent-color:var(--brass)}
.slide b{font-family:var(--display);font-size:1.6rem;min-width:2.6em;text-align:center;color:var(--deep)}
.pocket{display:flex;gap:6px;align-items:center;min-height:62px;min-width:160px;padding:8px 12px;border:3px solid var(--brass);border-radius:12px;background:#FFF6DD}
.bead{width:46px;height:46px;border-radius:50%;border:2px solid #222;display:inline-block;flex:none;position:relative}
.bead.r{background:#C0392B}
.bead.b{background:#2E5EAA}
.bead.b::after{content:"";position:absolute;left:8px;right:8px;top:20px;height:4px;background:#fff;border-radius:2px}
.beadbtn{background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.string{display:flex;flex-wrap:wrap;gap:3px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--soft);border:2px solid var(--line);min-height:44px}
.string .bead{width:32px;height:32px}
.string .bead.b::after{left:5px;right:5px;top:13px;height:4px}

.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;border:3px solid var(--card-edge)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
details.fallback{margin-top:10px;font-size:1rem;color:var(--muted)}
details.fallback summary{cursor:pointer;font-weight:700}
.overcard{width:100%;max-width:640px;background:#fffaf0;border:3px solid var(--brass);border-radius:16px;padding:14px 18px;box-shadow:0 5px 0 rgba(0,0,0,.12);margin-top:6px}
.quote{font-family:var(--display);font-size:clamp(1.15rem,3vw,1.5rem);line-height:1.35;color:var(--deep);margin:0 0 6px}
.quote cite{display:block;font-family:var(--body);font-size:.95rem;color:var(--muted);font-style:normal;margin-top:4px}
textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:1.15rem;background:#FFFDF8}
.checks{display:grid;gap:10px;margin:12px 0}
.check{display:flex;gap:12px;align-items:center;background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-height:56px;text-align:left;font-size:1.1rem}
.check .bx{width:30px;height:30px;border:3px solid var(--deep);border-radius:6px;display:grid;place-items:center;flex:none;background:#fff}
.check[aria-pressed="true"] .bx::after{content:"";width:14px;height:8px;border-left:4px solid var(--deep);border-bottom:4px solid var(--deep);transform:rotate(-45deg) translate(1px,-2px)}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;margin-top:8px}
.steps3 div{background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-weight:700;font-size:1rem}
.steps3 b{display:block;font-family:var(--display);font-size:1.4rem;color:var(--brass-d)}
.bigpic{width:100%;max-width:640px;height:auto}
.engine .gear{transform-box:fill-box;transform-origin:center}
.engine.go .gear{animation:spin 2.4s linear 2}
.engine.go .g2{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.engine .out{opacity:0;transition:opacity .4s}
.engine.go .out{opacity:1}
.engine .note{opacity:0}
.engine.go .note{animation:float 2.6s ease-out forwards}
@keyframes float{0%{opacity:0;transform:translateY(10px)}30%{opacity:1}100%{opacity:1;transform:translateY(-14px)}}
.engine.go .feed{animation:feed 2.4s linear}
@keyframes feed{to{transform:translateX(26px)}}
@media (prefers-reduced-motion:reduce){.engine.go .gear,.engine.go .feed{animation:none}.engine.go .note{animation:none;opacity:1}}

/* the map */
.intro{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:center;margin-bottom:12px}
@media (max-width:760px){.intro{grid-template-columns:1fr}}
.sess{margin:16px 0 8px;font-family:var(--display);font-size:1.2rem;color:var(--deep)}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.part{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:center;text-align:left;background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px;min-height:86px;box-shadow:0 3px 0 var(--line)}
.part .pp{width:80px;height:60px;border-radius:10px;overflow:hidden;position:relative;background:var(--soft)}
.part .pp svg{width:100%;height:100%}
.part .tick{position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:.85rem}
.part.next{border-color:var(--brass)}
.part.locked{opacity:.45;cursor:default}
.part b{font-size:1.08rem;display:block}
.colours{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.sw{width:50px;height:50px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.endicons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.endicons div{background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-weight:700}
.endicons .ic{display:block;width:44px;height:44px;margin:0 auto 4px;color:var(--deep)}
</style>
</head>
<body>
<div class="wrap">

function Cloth(t){

  const cells=[];for(let y=0;y<r;y++)for(let x=0;x<c;x++){const d=h('div',{class:'cell','data-x':x,'data-y':y});el.appendChild(d);cells.push(d);}
  const needle=h('div',{class:'needle',html:REL()?NEEDLE_REL:NEEDLE_ABS});el.appendChild(needle);
  const api={el,target:null,cells,
    cell:(x,y)=>cells[y*c+x],
    setTarget(set){api.target=set;cells.forEach(d=>d.classList.toggle('t',set.has(key(+d.dataset.x,+d.dataset.y))));},
    clear(){cells.forEach(d=>{d.classList.remove('s','off');d.innerHTML='';});},
    stitch(x,y){const d=api.cell(x,y);if(!d)return;const off=!!(api.target&&!api.target.has(key(x,y)));d.classList.add('s');d.classList.toggle('off',off);d.innerHTML=off?STITCH_OFF:STITCH;},
    needle(x,y,dir){needle.style.left=((x+.5)/c*100)+'%';needle.style.top=((y+.5)/r*100)+'%';needle.firstChild.style.setProperty('--rot',((dir||0)*90)+'deg');},
    bump(){needle.classList.remove('bump');void needle.offsetWidth;needle.classList.add('bump');},
    show(set,end){api.clear();set.forEach(k=>{const [x,y]=k.split(',').map(Number);api.stitch(x,y);});if(end)api.needle(end.x,end.y,end.dir);},
    reset(){api.clear();api.stitch(t.start.x,t.start.y);api.needle(t.start.x,t.start.y,t.start.dir);}
  };
  api.cell(t.start.x,t.start.y).classList.add('st');

}

/* ---------- running a code ---------- */
function speed(n){const base=isMaeve()?(S.easy?650:560):480;return n>20?Math.round(base*.62):base;}
function Runner(cloth,t,getItems,cb){
  let sim=null,i=-1,timer=null,running=false;
  function stop(){clearTimeout(timer);running=false;cb.busy&&cb.busy(false);}
  function begin(){stop();sim=simulate(getItems(),t);i=-1;cloth.reset();cb.reset&&cb.reset();}
  function apply(){const s=sim.steps[i];if(s.bump)cloth.bump();else{cloth.needle(s.x,s.y,s.dir);if(s.stitch)cloth.stitch(s.x,s.y);}cb.step&&cb.step(s);}
  function end(){running=false;cb.busy&&cb.busy(false);cb.end&&cb.end(sim);}
  return {
    run(){begin();if(!sim.steps.length){cb.empty&&cb.empty();return;}running=true;cb.busy&&cb.busy(true);
      const tick=()=>{i++;apply();if(i>=sim.steps.length-1)end();else timer=setTimeout(tick,speed(sim.steps.length));};timer=setTimeout(tick,300);},
    step(){if(running)return;if(!sim||i>=sim.steps.length-1){begin();if(!sim.steps.length){cb.empty&&cb.empty();return;}}i++;apply();if(i>=sim.steps.length-1)end();},
    reset(){stop();sim=null;i=-1;cloth.reset();cb.reset&&cb.reset();},
    stop
  };
}

/* ---------- drag, or tap then tap ---------- */
function dnd(chips,targets,attempt){
  let sel=null;const open=t=>!t.classList.contains('filled');
  const mark=on=>targets.forEach(t=>t.classList.toggle('cando',on&&open(t)));
  function at(x,y){for(const t of targets){if(!open(t))continue;const r=t.getBoundingClientRect();if(x>=r.left-10&&x<=r.right+10&&y>=r.top-10&&y<=r.bottom+10)return t;}return null;}
  chips.forEach(ch=>{let sx=0,sy=0,on=false,moved=false;
    ch.addEventListener('pointerdown',e=>{if(ch.classList.contains('used'))return;on=true;moved=false;sx=e.clientX;sy=e.clientY;try{ch.setPointerCapture(e.pointerId);}catch(_){}ch.classList.add('lift');e.preventDefault();});
    ch.addEventListener('pointermove',e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>8)moved=true;ch.style.transform='translate('+dx+'px,'+dy+'px)';const t=at(e.clientX,e.clientY);targets.forEach(x=>x.classList.toggle('over',x===t));});
    ch.addEventListener('pointerup',e=>{if(!on)return;on=false;ch.classList.remove('lift');ch.style.transform='';targets.forEach(x=>x.classList.remove('over'));
      if(!moved){sel=sel===ch?null:ch;chips.forEach(c=>c.classList.toggle('sel',c===sel));mark(!!sel);return;}
      const t=at(e.clientX,e.clientY);if(t)attempt(ch,t);});
    ch.addEventListener('pointercancel',()=>{on=false;ch.classList.remove('lift');ch.style.transform='';});
  });
  targets.forEach(t=>t.addEventListener('click',()=>{if(!sel||!open(t))return;const c=sel;sel=null;c.classList.remove('sel');mark(false);attempt(c,t);}));
}

      if(tray){trayBox.appendChild(h('div',{class:'tray'},tray.map(it=>cardEl(it.op,{tag:'button',on:{click:()=>fromTray(it)}}))));}
      else{const inRep=tgt!=='main';
        trayBox.appendChild(h('div',{class:'tray'},t.ops.map(op=>cardEl(op,{tag:'button',disabled:full(),on:{click:()=>add(op)}})),
          (t.allowRepeat&&!inRep)?h('button',{class:'card rep',type:'button',disabled:full(),on:{click:addRep}},h('span',{class:'ic',html:ICON.rep}),h('span',null,'Repeat')):null));
        if(inRep&&!t.preRepeat)trayBox.appendChild(h('button',{class:'btn ghost small',type:'button',on:{click:()=>{tgt='main';draw();}}},'Finish the Repeat'));}
    }
    const n=countCards(items);budget.textContent='';
    if(t.budget)budget.append('Cards used: ',h('b',null,String(n)),' (aim: '+t.budget+' or fewer)');
    else if(t.max)budget.append('Cards used: ',h('b',null,String(n)),' of '+t.max);
  }
  view.append(codeBox,editBox,trayBox,budget);draw();
  return {el:view,items:()=>items,lock(v){o.locked=v;sel=null;draw();},
    undo(){if(tray){const it=items.pop();if(it){tray.push(it);changed();}return;}const id=history.pop();if(id){removeId(id);if(tgt===id)tgt='main';changed();}},
    clear(){if(tray){tray=tray.concat(items);items=[];}else if(t.preRepeat){items[0].body=[];tgt=items[0].id;}else{items=[];tgt='main';}history.length=0;changed();}};
}
SCREENS.build=(t)=>{
  frame(t.say);
  const q=G.ask({item:t.item,concept:t.concept,area:t.area});
  const target=targetOf(t);const cloth=Cloth(t);cloth.setTarget(target);
  const round=h('div',{class:'round'});let solved=false,edited=false;
  const ed=Editor(t,{changed:()=>{edited=true;run&&run.reset();},say:s=>toast('hmm',s)});
  let hl;const run=Runner(cloth,t,()=>ed.items(),{
    step:s=>hl.step(s),reset:()=>hl&&hl.clear(),
    busy:b=>{runB.disabled=b||solved;stepB.disabled=b||solved;},
    empty:()=>toast('hmm','Add some cards first.'),
    end:sim=>{if(solved)return;const items=ed.items();const n=countCards(items);const exact=!sim.bumped&&eqSet(sim.seen,target);
      if(exact&&t.budget&&n>t.budget){q.miss('right pattern, '+n+' cards: '+codeText(items));toast('hmm','Right pattern! But that\'s **'+n+' cards**. Can you do it in **'+t.budget+'**?',3200);return;}
      if(exact&&t.mustRepeat&&!hasRepeat(items)){toast('hmm','That works! Now use the **Repeat** card.',3000);return;}
      if(exact){solved=true;q.done();ed.lock(true);runB.disabled=stepB.disabled=true;
        win(t.debug?'Bug fixed!':(t.budget?'Done in '+n+' cards!':'Every dot stitched. Well coded!'),2000);return;}
      if(t.debug&&!edited){toast('hmm','There\'s the bug at work. Tap **Step** to find the wrong card.',3000);return;}
      if(sim.bumped){const last=sim.steps[sim.steps.length-1];q.miss('bump at card '+last.num+': '+codeText(items));toast('hmm','Bump! **Card '+last.num+'** goes off the cloth.');return;}
      if(!subset(sim.seen,target)){q.miss(codeText(items));toast('hmm','Some stitches missed the dots. Tap **Step** to find the first wrong card.',3000);return;}
      toast('hmm','So far so good! What comes next?');}});
  const runB=h('button',{class:'btn brass',type:'button',on:{click:()=>run.run()}},'Run');
  const stepB=h('button',{class:'btn ghost',type:'button','aria-label':'Step'},h('span',{class:'ic',style:'width:22px;height:22px;display:inline-block;vertical-align:-4px;margin-right:4px',html:ICON.step}),'Step');stepB.addEventListener('click',()=>run.step());
  const extra=t.debug?[]:[h('button',{class:'btn ghost small',type:'button',on:{click:()=>{if(!solved)ed.undo();}}},'Undo'),h('button',{class:'btn ghost small',type:'button',on:{click:()=>{if(!solved)ed.clear();}}},'Clear')];
  F.pic.append(cloth.el,round);
  F.side.append(ed.el,h('div',{class:'controls'},runB,stepB,extra),t.optional?h('div',{class:'next-row'},h('button',{class:'btn ghost',type:'button',on:{click:advance}},'Skip the challenge')):null);
  hl=highlighter(F.side,round);setHelp(t.hints,q);
};
SCREENS.choose=(t,p)=>{
  const c=S.choice[t.key];
  if(c!=null&&t.options[c]){const inner=Object.assign({},t.options[c].t);if(S.easy&&isMaeve()&&inner.easy)Object.assign(inner,inner.easy);return SCREENS.build(inner,p);}
  frame(t.say,true);const box=h('div',{class:'opts',style:'width:100%;max-width:560px'});
  t.options.forEach((o,i)=>{const tt=Object.assign({},o.t);if(S.easy&&isMaeve()&&tt.easy)Object.assign(tt,tt.easy);
    box.appendChild(h('button',{class:'opt',type:'button',on:{click:()=>{S.choice[t.key]=i;save();render();}}},thumb(tt,tt.solution),o.label));});
  F.pic.appendChild(box);
};

/* ---- Part 6: find the repeat, then slide ---- */
SCREENS.unit=(t)=>{
  const mv=isMaeve();const long=[];for(let i=0;i<t.rep;i++)long.push(...t.unit);
  const tt=Object.assign({},t,{solution:[{rep:t.rep,body:t.unit}]});const target=targetOf(tt);
  frame(mv?'This long code stitches the stairs. **Tap the cards that make one stair.**':'This long program stitches the steps. **Tap the cards that make one step.**');
  const q=G.ask({item:t.item+': spot the repeat',concept:'repeating-unit',area:t.area});
  const cloth=Cloth(t);cloth.setTarget(target);const round=h('div',{class:'round'});
  const longItems=toItems(long);numberCards(longItems);let picked=new Set();
  const cards=longItems.map(it=>cardEl(it.op,{tag:'button',num:it.num,on:{click:()=>{if(phase!==1)return;const e=cards[it.num-1];if(picked.has(it.num)){picked.delete(it.num);e.classList.remove('pick');}else{picked.add(it.num);e.classList.add('pick');}}}}));
  const box=h('div',{class:'code'},cards);let phase=1;
  const hl=highlighter(box,round);const run=Runner(cloth,t,()=>toItems(long),{step:hl.step,reset:hl.clear});
  const okB=h('button',{class:'btn brass',type:'button'},'These ones');
  const watchB=h('button',{class:'btn ghost',type:'button',on:{click:()=>run.run()}},'Watch it run');
  const ctl=h('div',{class:'controls'},okB,watchB);
  okB.addEventListener('click',()=>{if(phase!==1)return;const k=t.unit.length;const want=[...Array(k)].map((_,i)=>i+1);
    if(picked.size===k&&want.every(n=>picked.has(n))){q.done();toast('yes',mv?'Yes! One stair.':'Yes! That\'s the bit that repeats.',1400);setTimeout(slider,1500);}
    else{q.miss([...picked].sort((a,b)=>a-b).join(','));toast('hmm','Not quite. Start at card 1. Where does it start again?',2800);picked.forEach(n=>cards[n-1].classList.remove('pick'));picked.clear();}});
  F.pic.append(cloth.el,round);F.side.append(box,ctl);
  setHelp(mv?['Read the cards in pairs.','Do cards 3 and 4 match cards 1 and 2?']:['Find where the cards start again.','Cards 5 to 8 match cards 1 to 4.'],q);
  function slider(){phase=2;run.stop();
    const q2=G.ask({item:t.item+': how many times',concept:'repeat-loop',area:t.area});
    say(mv?'Now slide to repeat the stair. Match the dots!':'Now slide to set how many times. Match the dots!');
    const body=t.unit;let n=1;
    const blk=h('div',{class:'repblock'},h('div',{class:'rephead'},h('span',{class:'ic',style:'width:26px;height:26px;display:inline-block',html:ICON.rep}),'Repeat'),h('div',{class:'repbody'},body.map(op=>cardEl(op))));
    const val=h('b',null,'1×');const rng=h('input',{type:'range',min:1,max:6,value:1,'aria-label':'How many times'});
    const show=()=>{const sim=simulate(toItems([{rep:n,body}]),t);cloth.show(sim.seen,sim.end);val.textContent=n+'×';blk.querySelector('.rephead').lastChild.textContent='Repeat '+n+' times';};
    blk.querySelector('.rephead').lastChild.textContent='Repeat 1 time';
    rng.addEventListener('input',()=>{n=+rng.value;show();});
    const go=h('button',{class:'btn brass',type:'button'},'That\'s it');
    go.addEventListener('click',()=>{if(winning)return;if(n===t.rep){q2.done();win('A loop! '+long.length+' cards became '+(body.length+1)+'.',2400);}
      else{q2.miss(String(n));toast('hmm',n<t.rep?'Some dots still need stitching. More times!':'Too many! The needle went past the dots.',2600);}});
    F.side.textContent='';F.side.append(h('p',{class:'note'},'The long code:'),miniStrip(long),h('div',{style:'margin-top:10px'},blk),h('div',{class:'slide'},rng,val),h('div',{class:'controls'},go));
    show();setHelp(['Each round of the Repeat stitches one '+(mv?'stair':'step')+'.','Count the '+(mv?'stairs':'steps')+' in the dots.'],q2);
  }
};

/* ---- Part 7: design, then show ---- */
SCREENS.design=(t)=>{
  frame('Make a pattern for **'+SIS()+'**. Tap **Run** to see it.');const cloth=Cloth(t);const round=h('div',{class:'round'});
  const tt=Object.assign({},t,{allowRepeat:true});if(S.design)tt.prog=S.design;
  const ed=Editor(tt,{changed:()=>{run&&run.reset();S.design=toSpec(ed.items());save();},say:s=>toast('hmm',s)});
  let hl;const run=Runner(cloth,t,()=>ed.items(),{step:s=>hl.step(s),reset:()=>hl&&hl.clear(),empty:()=>toast('hmm','Add some cards first.'),
    end:sim=>{if(sim.bumped){const l=sim.steps[sim.steps.length-1];toast('hmm','Bump! Card '+l.num+' goes off the cloth.');}else toast('yes','There\'s your pattern!',1500);}});
  const colours=[['#2F3C8F','Indigo'],['#A8322A','Madder red'],['#3F6B3A','Moss green']];
  const sw=h('div',{class:'colours'},colours.map(([c,n])=>{const b=h('button',{class:'sw',type:'button','aria-label':n+' thread','aria-pressed':String(S.colour===c),style:'background:'+c});
    b.addEventListener('click',()=>{S.colour=c;save();document.body.style.setProperty('--thread',c);sw.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});return b;}));
  const fin=h('button',{class:'btn',type:'button',on:{click:()=>{const items=ed.items();const sim=simulate(items,t);
    if(countCards(items)<3){toast('hmm','Use at least 3 cards.');return;}
    if(sim.bumped){toast('hmm','It bumps off the cloth. Fix it first.');return;}
    S.design=toSpec(items);save();G.write({game:GAME,part:'A pattern for your sister',area:'ICTDT',prompt:'My pattern code for my sister',text:codeText(items)});advance();}}},"I'm finished");
  F.pic.append(cloth.el,round,sw);
  F.side.append(ed.el,h('div',{class:'controls'},h('button',{class:'btn brass',type:'button',on:{click:()=>run.run()}},'Run'),h('button',{class:'btn ghost small',type:'button',on:{click:()=>ed.undo()}},'Undo'),h('button',{class:'btn ghost small',type:'button',on:{click:()=>ed.clear()}},'Clear')),
    h('div',{class:'next-row'},fin));
  hl=highlighter(F.side,round);
};
SCREENS.show=()=>{
  frame('Show **'+SIS()+'** your code. She shades her guess on paper. Then **Run**!');
  const d=parts().find(p=>p.id==='sister').tasks[0];const spec=S.design||[];
  const cloth=Cloth(d);const s=strip(spec,{numbered:true});const round=h('div',{class:'round'});const hl=highlighter(s,round);
  const run=Runner(cloth,d,()=>toItems(spec),{step:hl.step,reset:hl.clear,end:()=>toast('yes','Did her guess match?',2200)});
  F.pic.append(cloth.el,round);
  F.side.append(s,h('div',{class:'controls'},h('button',{class:'btn brass',type:'button',on:{click:()=>run.run()}},'Run')),
    h('div',{class:'next-row'},h('button',{class:'btn ghost',type:'button',on:{click:()=>{S.task--;save();render();}}},'Change it'),h('button',{class:'btn',type:'button',on:{click:advance}},"We've checked it")));
};

/* ---- Part 8: what Ada saw ---- */
SCREENS.ada=()=>{
  frame('Tap the **Engine** to start it.',true);
  const pic=svgEl(engineSVG());pic.style.cursor='pointer';let went=false;
  const goOn=h('button',{class:'btn',type:'button',hidden:true,on:{click:advance}},'Go on');
  pic.addEventListener('click',()=>{if(went)return;went=true;pic.classList.add('go');say('Patterns, and even music!');
    setTimeout(()=>{F.pic.appendChild(h('div',{class:'overcard'},h('p',{class:'quote'},'"… the Analytical Engine weaves algebraical patterns just as the Jacquard-loom weaves flowers and leaves."',h('cite',null,'Ada Lovelace, Note A, 1843')),
      P(M('Ada saw that machines could one day make patterns and music, not just sums.','Ada saw that such machines could one day work with music, words and pictures, not only numbers.')),
      isMaeve()?null:P('Babbage sketched programs too, but Ada\'s was the first one published. His Engine was never finished. Real computers came about a hundred years later.'),
      h('div',{class:'row',style:'justify-content:flex-end'},goOn)));goOn.hidden=false;},2600);});
  F.pic.appendChild(pic);
};
SCREENS.beads=(t)=>{
  const mv=isMaeve();const target=[];for(let i=0;i<t.rep;i++)target.push(...t.unit);
  frame(mv?'Make this bead string with a Repeat. Tap beads into the pocket, then slide.':'Make this bead string with a Repeat: fill the pocket, then slide.');
  const q=G.ask({item:t.item,concept:t.concept,area:t.area});
  const pocket=[];let n=1;
  const strBead=b=>h('span',{class:'bead '+b,'aria-label':b==='r'?'red':'blue'});
  const goal=h('div',{class:'string'},target.map(strBead));
  const mine=h('div',{class:'string'});const pk=h('div',{class:'pocket','aria-label':'Repeat pocket'});
  const val=h('b',null,'1×');const rng=h('input',{type:'range',min:1,max:6,value:1,'aria-label':'How many times'});
  const draw=()=>{pk.textContent='';pocket.forEach(b=>pk.appendChild(strBead(b)));if(!pocket.length)pk.appendChild(h('span',{class:'note'},'Empty pocket'));
    mine.textContent='';for(let i=0;i<n;i++)pocket.forEach(b=>mine.appendChild(strBead(b)));val.textContent=n+'×';};
  rng.addEventListener('input',()=>{n=+rng.value;draw();});
  const add=b=>{if(pocket.length>=4||winning)return;pocket.push(b);draw();};
  const go=h('button',{class:'btn brass',type:'button'},'That\'s it');
  go.addEventListener('click',()=>{if(winning)return;const made=[];for(let i=0;i<n;i++)made.push(...pocket);
    if(made.join()===target.join()){q.done();win(mv?'Yes! Bead and crochet patterns are codes too.':'Yes! Knitting, beading and music all repeat. Ada saw a machine could follow any of them.',2800);}
    else{q.miss('Repeat '+n+' ('+pocket.join(' ')+')');toast('hmm',pocket.join()!==t.unit.join()?'Look at the pocket. What is the bit that repeats?':'Right beads! Now check how many times.',2800);}});
  F.pic.append(h('p',{class:'note',style:'margin:0'},'Make this:'),goal,h('p',{class:'note',style:'margin:8px 0 0'},'Yours:'),mine);
  F.side.append(h('div',{class:'row'},h('button',{class:'beadbtn',type:'button','aria-label':'Add a red bead',on:{click:()=>add('r')}},h('span',{class:'bead r'}),'red'),
      h('button',{class:'beadbtn',type:'button','aria-label':'Add a blue bead',on:{click:()=>add('b')}},h('span',{class:'bead b'}),'blue'),
      h('button',{class:'btn ghost small',type:'button',on:{click:()=>{pocket.pop();draw();}}},'Take one out')),
    h('div',{class:'rephead',style:'margin-top:12px'},h('span',{class:'ic',style:'width:26px;height:26px;display:inline-block',html:ICON.rep}),'Repeat this pocket:'),pk,
    h('div',{class:'slide'},rng,val),h('div',{class:'controls'},go));
  draw();setHelp(['Find the beads that repeat.',mv?'Red, blue is one round. Count the rounds.':'Count the blue beads. Each round has one.'],q);
};
SCREENS.tell=()=>{
  frame('Tell a grown-up: what is a **bug**? How did you find one?',true);
  F.pic.appendChild(h('div',{class:'endicons',style:'max-width:520px;width:100%'},h('div',null,h('span',{class:'ic',html:BUGPIC}),'A bug'),h('div',null,h('span',{class:'ic',html:ICON.step}),'Step'),h('div',null,h('span',{class:'ic',html:ICON.rep}),'Repeat')));
  const ta=h('textarea',{'aria-label':'Type a sentence if you like',placeholder:'Type a sentence, if you like.',style:'min-height:70px'});ta.value=S.writing.tellback||'';
  ta.addEventListener('input',()=>{S.writing.tellback=ta.value;save();G.write({game:GAME,part:'What Ada saw',area:'EN',prompt:'Tell-back: what is a bug, and how did you find one?',text:ta.value});});
  F.side.append(ta,h('div',{class:'next-row'},h('button',{class:'btn',type:'button',on:{click:advance}},'We talked about it')));
};
SCREENS.write=(t)=>{
  frame(t.say,true);
  if(t.pic)F.pic.appendChild(h('div',{html:TILEPIC[t.pic],style:'width:160px'}));
  const ta=h('textarea',{'aria-label':t.say,placeholder:t.example||''});ta.value=S.writing[t.wkey]||'';
  const nx=h('button',{class:'btn',type:'button'},'Next');
  const upd=()=>{nx.disabled=words(ta.value)<(t.min||1);};
  const send=(k,area,prompt,text)=>{S.writing[k]=text;save();G.write({game:GAME,part:parts()[S.part].title,area,prompt,text});};
  ta.addEventListener('input',()=>{send(t.wkey,t.area,t.say,ta.value);upd();});
  let ta2=null;if(t.extra){ta2=h('textarea',{'aria-label':t.extra.prompt,style:'min-height:70px'});ta2.value=S.writing[t.extra.wkey]||'';ta2.addEventListener('input',()=>send(t.extra.wkey,t.extra.area,t.extra.prompt,ta2.value));}
  nx.addEventListener('click',advance);upd();
  F.side.append(P(t.sub||''),ta,t.extra?h('p',{class:'note',style:'margin:12px 0 4px'},t.extra.prompt):null,ta2,h('div',{class:'next-row'},nx));
};
SCREENS.end=()=>{
  if(!S.finished){S.finished=true;save();}
  const p=parts()[S.part];if(!S.done[p.id]){S.done[p.id]=true;G.partDone(p.title);save();}
  if(!finishedNow){finishedNow=true;G.finish();}
  frame('You finished the Pattern Engine!',true);
  F.pic.append(h('div',{class:'endicons',style:'max-width:620px;width:100%'},
    h('div',null,h('span',{class:'ic',html:ICON.right}),'A code is steps a machine follows exactly.'),
    h('div',null,h('span',{class:'ic',html:BUGPIC}),'A bug is a mistake. Step through to find it.'),
    h('div',null,h('span',{class:'ic',html:ICON.rep}),'A Repeat runs cards again and again.')));
  F.side.append(h('div',{class:'next-row'},h('button',{class:'btn ghost',type:'button',on:{click:()=>{S.part=null;save();render();}}},'Map'),h('a',{class:'btn',href:'../../index.html',style:'text-decoration:none;display:inline-flex;align-items:center'},'Games Room')));
};

window.PE={simulate,toItems,parts,targetOf,state:()=>S,go(part,task){S.part=part;S.task=task||0;save();render();},setEasy(v){S.easy=v;save();whoBar();render();}};
whoBar();render();
</script>
