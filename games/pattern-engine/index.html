<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>The Pattern Engine</title>
<script src="../../results.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
/* An inventor's workshop in 1843: linen cloth, cream punched cards, indigo thread and brass. */
:root{
  --paper:#F5EFE2; --paper-2:#EADFC8; --ink:#1E2440; --muted:#5E5A52; --line:#DCCFB4;
  --deep:#26306B; --thread:#2F3C8F; --brass:#A87A22; --brass-d:#7C5913; --card:#FFFBF0; --card-edge:#8A7550;
  --madder:#A8322A; --good:#2C7A47; --good-bg:#E4F2E6; --soft:#FBF6EA;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Andika","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:1.15rem;line-height:1.5;background-color:var(--paper);
  background-image:repeating-linear-gradient(0deg,rgba(120,95,50,.035) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,rgba(120,95,50,.035) 0 1px,transparent 1px 4px)}
.wrap{max-width:1100px;margin:0 auto;padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(84px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0 0 .7em}

.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:6px 0 12px;margin-bottom:16px;border-bottom:3px solid var(--deep)}
.brand{display:flex;gap:12px;align-items:center}
.brand svg{width:50px;height:50px;flex:none}
.brand h1{font-size:clamp(1.6rem,4.4vw,2.3rem);color:var(--deep)}
.brand p{margin:0;font-size:.95rem;color:var(--muted)}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:1rem}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;min-height:44px}
.chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}

.panel{background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);padding:20px}
.eyebrow{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--brass-d);font-weight:700;margin:0 0 4px}
.head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.head h2{font-size:clamp(1.45rem,4vw,2rem);color:var(--deep)}
.back{background:#fff;border:2px solid var(--deep);border-radius:999px;padding:6px 16px;min-height:46px;font-size:1rem}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--paper-2);border:2px solid var(--line)}
.dots i.on{background:var(--deep);border-color:var(--deep)}

.btn{font-family:var(--body);font-weight:700;font-size:1.15rem;background:var(--deep);color:#fff;border:0;border-radius:999px;padding:.5em 1.35em;min-height:52px;box-shadow:0 4px 0 #141a40;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #141a40}
.btn.brass{background:var(--brass);box-shadow:0 4px 0 var(--brass-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.small{font-size:1rem;min-height:46px;padding:.35em 1em}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.next-row{margin-top:18px;display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}

.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:1fr}}
.prompt{font-size:1.25rem;margin-bottom:12px}
.prompt b{color:var(--deep)}
.note{font-size:.95rem;color:var(--muted)}

/* the cloth */
.cloth-wrap{display:grid;justify-items:center;gap:8px}
.cloth{--c:6;--r:6;position:relative;display:grid;grid-template-columns:repeat(var(--c),1fr);width:100%;max-width:min(500px,calc(62vh * var(--c) / var(--r)));aspect-ratio:var(--c)/var(--r);
  background:#FBF7EC;border:3px solid var(--card-edge);border-radius:8px;box-shadow:0 4px 0 var(--line);overflow:visible}
.cell{position:relative;border:1px solid #E6DCC5;background:repeating-linear-gradient(45deg,transparent 0 3px,rgba(140,110,60,.05) 3px 4px)}
.cell.t::after{content:"";position:absolute;inset:12%;border:2.5px dotted #8C7A55;border-radius:4px;background:rgba(168,122,34,.08)}
.cell.st{box-shadow:inset 0 0 0 3px rgba(38,48,107,.35)}
.cell svg{position:absolute;inset:14%;width:72%;height:72%;color:var(--thread);z-index:1}
.cell.off svg{color:var(--madder)}
.cell.m::before{content:"";position:absolute;inset:26%;border-radius:50%;border:3px solid #6F6A60;background:rgba(255,255,255,.7);z-index:2}
.cell.mark-able{cursor:pointer}
.needle{position:absolute;width:calc(100% / var(--c) * .62);aspect-ratio:1;transform:translate(-50%,-50%);transition:left .3s ease,top .3s ease;z-index:3;pointer-events:none}
.needle .rot{width:100%;height:100%;transform:rotate(var(--rot,0deg));transition:transform .3s ease}
.needle svg{width:100%;height:100%}
.needle.bump{animation:bump .45s}
@keyframes bump{20%{margin-left:-6px}40%{margin-left:6px}60%{margin-left:-4px}80%{margin-left:3px}}
.round{min-height:1.6em;font-size:1rem;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.92rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{display:inline-block;width:20px;height:20px;border:2.5px dotted #8C7A55;border-radius:3px}

/* punched cards */
.code{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;min-height:96px;padding:10px;border:2px dashed var(--line);border-radius:12px;background:var(--soft)}
.code+p{margin-top:12px}
.code.empty::before{content:attr(data-empty);color:var(--muted);font-size:1rem;align-self:center}
.card{position:relative;width:72px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card);border:2px solid var(--card-edge);border-radius:6px;padding:12px 4px 6px;box-shadow:0 3px 0 var(--line);font-size:.78rem;font-weight:700;color:var(--ink);line-height:1.1;text-align:center}
.card::before{content:"";position:absolute;top:4px;left:8px;right:8px;height:4px;background:radial-gradient(circle,#8A7550 1.4px,transparent 1.8px) 0 0/8px 4px repeat-x;opacity:.55}
.card .ic{width:34px;height:34px}
.card .ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.card .n{position:absolute;top:-10px;left:-8px;min-width:24px;height:24px;border-radius:12px;background:var(--deep);color:#fff;font-size:.8rem;display:grid;place-items:center;padding:0 5px}
.card.now{border-color:var(--brass);background:#FFF1C9;box-shadow:0 0 0 3px var(--brass)}
.card.sel{border-color:var(--madder);box-shadow:0 0 0 3px var(--madder)}
.card.turn{background:repeating-linear-gradient(45deg,var(--card) 0 6px,#F3EAD3 6px 8px)}
.card.rep{width:auto;min-width:84px}
.tray{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.tray .card{width:84px;min-height:92px;font-size:.85rem}
.tray .card:active{transform:translateY(2px)}
.tray .card[disabled]{opacity:.35}
.mini{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;vertical-align:middle}
.mini .card{width:44px;min-height:48px;padding:8px 2px 3px;font-size:0}
.mini .card .ic{width:24px;height:24px}
.mini .card::before{display:none}
.mini .repm{display:inline-flex;gap:4px;align-items:center;border:2px solid var(--brass);border-radius:8px;padding:3px 6px;background:#FFF6DD;font-size:.85rem;font-weight:700}

.repblock{display:flex;flex-direction:column;gap:6px;border:3px solid var(--brass);border-radius:10px;padding:6px 8px 8px;background:#FFF6DD}
.repblock.open{box-shadow:0 0 0 3px rgba(168,122,34,.35)}
.rephead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1rem}
.rephead button{width:40px;height:40px;border-radius:50%;border:2px solid var(--brass-d);background:#fff;font-weight:700;font-size:1.2rem}
.rephead .cnt{min-width:1.4em;text-align:center;font-size:1.3rem}
.repbody{display:flex;flex-wrap:wrap;gap:8px;min-height:88px;min-width:120px;padding:6px;border:2px dashed var(--brass);border-radius:8px}
.repbody.empty::before{content:"Tap cards to put them in here";color:var(--brass-d);font-size:.95rem;align-self:center}
.edit{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding:10px;border:2px solid var(--madder);border-radius:12px;background:#FFF4F2}
.edit .card{width:60px;min-height:66px}

.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.msg{min-height:1.5em;margin-top:12px;font-size:1.12rem;padding:0}
.msg.show{padding:12px 14px;border-radius:12px;background:var(--soft);border:2px solid var(--line)}
.msg.good{background:var(--good-bg);border-color:#A9D5B3}
.budget{font-size:1rem;color:var(--muted);margin-top:6px}
.budget b{color:var(--ink)}

.help{margin-top:12px}
.help .hint{margin-top:8px;padding:10px 14px;border-left:5px solid var(--brass);background:var(--soft);border-radius:0 10px 10px 0}

/* choices */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border:3px solid var(--line);border-radius:14px;padding:12px;min-height:64px;text-align:center;font-size:1.1rem;box-shadow:0 3px 0 var(--line)}
.opt.no{border-color:#D9B3AE;background:#FBF1EF;opacity:.7}
.opt.yes{border-color:var(--good);background:var(--good-bg)}
.opt svg.th{width:100%;max-width:170px;height:auto}

.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;border:3px solid var(--card-edge)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.quote{font-family:var(--display);font-size:clamp(1.3rem,3.4vw,1.75rem);line-height:1.35;color:var(--deep);border-left:6px solid var(--brass);padding:6px 0 6px 18px;margin:8px 0 16px}
.quote cite{display:block;font-family:var(--body);font-size:1rem;color:var(--muted);font-style:normal;margin-top:6px}
textarea{width:100%;min-height:130px;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:1.15rem;background:#FFFDF8}
.checks{display:grid;gap:10px;margin:12px 0}
.check{display:flex;gap:12px;align-items:center;background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-height:56px;text-align:left;font-size:1.1rem}
.check .bx{width:30px;height:30px;border:3px solid var(--deep);border-radius:6px;display:grid;place-items:center;flex:none;background:#fff}
.check[aria-pressed="true"] .bx::after{content:"";width:14px;height:8px;border-left:4px solid var(--deep);border-bottom:4px solid var(--deep);transform:rotate(-45deg) translate(1px,-2px)}

/* the map */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center;margin-bottom:18px}
@media (max-width:760px){.intro{grid-template-columns:1fr}}
.sess{margin:18px 0 8px;font-family:var(--display);font-size:1.25rem;color:var(--deep)}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.part{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;text-align:left;background:#fff;border:3px solid var(--line);border-radius:14px;padding:12px;min-height:88px;box-shadow:0 3px 0 var(--line)}
.part .num{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);font-family:var(--display);font-weight:700;font-size:1.4rem;color:var(--deep)}
.part.done .num{background:var(--good-bg);color:var(--good)}
.part.next{border-color:var(--brass)}
.part.locked{opacity:.45;cursor:default}
.part b{font-size:1.1rem;display:block}
.part small{color:var(--muted);font-size:.92rem;display:block;line-height:1.3}
.stopnote{margin-top:16px;font-size:1rem;color:var(--muted)}
.colours{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.sw{width:52px;height:52px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.beads{display:inline-flex;gap:3px;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 50 50" aria-hidden="true"><rect x="7" y="6" width="36" height="40" rx="4" fill="#FFFBF0" stroke="#26306B" stroke-width="3"/><g fill="#26306B"><circle cx="16" cy="15" r="2.6"/><circle cx="25" cy="15" r="2.6"/><circle cx="34" cy="22" r="2.6"/><circle cx="16" cy="29" r="2.6"/><circle cx="25" cy="29" r="2.6"/><circle cx="34" cy="36" r="2.6"/><circle cx="16" cy="36" r="2.6"/></g></svg>
      <div><h1>The Pattern Engine</h1><p>Ada Lovelace and the punched cards</p></div>
    </div>
    <div class="who" id="who"></div>
  </header>
  <main id="app" aria-live="polite"></main>
</div>
<script>
'use strict';
const G=window.GR||{player:()=>'unknown',key:k=>k,testing:()=>false,start(){},part(){},partDone(){},finish(){},ask(){return {miss(){},hint(){},done(){},giveUp(){},missed:()=>0};},write(){}};
const GAME='pattern-engine', SAVE='pattern-engine-v1';
let PLAYER=G.player(), KEY=G.key(SAVE), S=load();
const app=document.getElementById('app');

/* ---------- small helpers ---------- */
function h(tag,a,...kids){const e=document.createElement(tag);if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='on')for(const ev in v)e.addEventListener(ev,v[ev]);else if(k==='html')e.innerHTML=v;else if(k==='style')e.style.cssText=v;else e.setAttribute(k,v===true?'':v);}
  kids.flat(9).forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);});return e;}
/* rich(): plain text with **bold** only. Built from text nodes, never parsed as HTML. */
function rich(s){const f=document.createDocumentFragment();String(s).split(/(\*\*[^*]+\*\*)/).forEach(p=>{if(!p)return;if(p.startsWith('**')&&p.endsWith('**'))f.appendChild(h('b',null,p.slice(2,-2)));else f.appendChild(document.createTextNode(p));});return f;}
const P=s=>h('p',null,rich(s));
const isMaeve=()=>PLAYER==='maeve';
const REL=()=>!isMaeve();
const NAME=()=>isMaeve()?'Maeve':'Maggie';
const SIS=()=>isMaeve()?'Maggie':'Maeve';
let _id=0; const uid=()=>'c'+(++_id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const words=s=>(String(s||'').trim().match(/\S+/g)||[]).length;

function defaults(){return {easy:false,done:{},part:null,task:0,colour:'#2F3C8F',design:null,writing:{},choice:{},finished:false,started:false};}
function load(){try{return Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){return defaults();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- card faces ---------- */
const ICON={
  up:'<svg viewBox="0 0 24 24"><path d="M12 20V5M6 11l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M12 4v15M6 13l6 6 6-6"/></svg>',
  left:'<svg viewBox="0 0 24 24"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>',
  fwd:'<svg viewBox="0 0 24 24"><path d="M12 21V5M6 11l6-6 6 6"/></svg>',
  tl:'<svg viewBox="0 0 24 24"><path d="M17 20v-7a5 5 0 0 0-5-5H6M10 4 6 8l4 4"/></svg>',
  tr:'<svg viewBox="0 0 24 24"><path d="M7 20v-7a5 5 0 0 1 5-5h6M14 4l4 4-4 4"/></svg>',
  rep:'<svg viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h11M15 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H6M9 21l-3-3 3-3"/></svg>'
};
const LABEL={up:'up',down:'down',left:'left',right:'right',fwd:'Forward',tl:'Turn left',tr:'Turn right'};
const TXT={up:'↑',down:'↓',left:'←',right:'→',fwd:'F',tl:'L',tr:'R'};
const STITCH='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="4.2" stroke-linecap="round"/></svg>';
const STITCH_OFF='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';
const NEEDLE_ABS='<div class="rot"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="14" fill="#C9A44E" stroke="#5E4410" stroke-width="3"/><circle cx="20" cy="20" r="5" fill="#fff" stroke="#5E4410" stroke-width="2"/></svg></div>';
const NEEDLE_REL='<div class="rot"><svg viewBox="0 0 40 40"><path d="M20 2 29 19h-5v17h-8V19h-5z" fill="#C9A44E" stroke="#5E4410" stroke-width="2.4" stroke-linejoin="round"/><ellipse cx="20" cy="29" rx="1.8" ry="4" fill="#fff"/></svg></div>';

function cardEl(op,o={}){const turn=(op==='tl'||op==='tr');
  return h(o.tag||'div',{class:'card'+(turn?' turn':'')+(o.cls?' '+o.cls:''),'data-num':o.num||null,'aria-label':LABEL[op]+(o.num?', card '+o.num:''),type:o.tag==='button'?'button':null,on:o.on,disabled:o.disabled},
    o.num?h('span',{class:'n'},String(o.num)):null,h('span',{class:'ic',html:ICON[op]}),h('span',null,LABEL[op]));}

/* ---------- programs ---------- */
function toItems(spec){return (spec||[]).map(s=>typeof s==='string'?{id:uid(),op:s}:{id:uid(),rep:s.rep,body:toItems(s.body)});}
function toSpec(items){return items.map(it=>it.rep?{rep:it.rep,body:toSpec(it.body)}:it.op);}
function numberCards(items){let n=0;const walk=a=>a.forEach(it=>{if(it.rep)walk(it.body);else it.num=++n;});walk(items);return n;}
function countCards(items){return items.reduce((a,it)=>a+(it.rep?1+countCards(it.body):1),0);}
function hasRepeat(items){return items.some(it=>it.rep&&it.rep>1&&it.body.length);}
function codeText(items){return items.map(it=>it.rep?('Repeat '+it.rep+' ('+codeText(it.body)+')'):TXT[it.op]).join(' ');}
function expand(items,rounds,out){items.forEach(it=>{if(it.rep){for(let r=1;r<=it.rep;r++)expand(it.body,rounds.concat([[r,it.rep]]),out);}else out.push({num:it.num,op:it.op,rounds});});return out;}
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const MOVE={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const key=(x,y)=>x+','+y;
function simulate(items,t){
  numberCards(items);
  const ops=expand(items,[],[]);const [c,r]=t.grid;
  let x=t.start.x,y=t.start.y,d=t.start.dir||0;const seen=new Set([key(x,y)]);const steps=[];let bumped=false;
  for(const o of ops){
    if(steps.length>500)break;
    if(o.op==='tl'){d=(d+3)%4;steps.push({num:o.num,op:o.op,rounds:o.rounds,x,y,dir:d,turn:true});continue;}
    if(o.op==='tr'){d=(d+1)%4;steps.push({num:o.num,op:o.op,rounds:o.rounds,x,y,dir:d,turn:true});continue;}
    const v=o.op==='fwd'?DIRS[d]:MOVE[o.op];const nx=x+v[0],ny=y+v[1];
    if(nx<0||ny<0||nx>=c||ny>=r){bumped=true;steps.push({num:o.num,op:o.op,rounds:o.rounds,x,y,dir:d,bump:true});break;}
    x=nx;y=ny;seen.add(key(x,y));steps.push({num:o.num,op:o.op,rounds:o.rounds,x,y,dir:d,stitch:true});
  }
  return {steps,seen,bumped};
}

/* ---------- the cloth ---------- */
function Cloth(t){
  const [c,r]=t.grid;const el=h('div',{class:'cloth',style:'--c:'+c+';--r:'+r,role:'img','aria-label':'The cloth, '+c+' squares across and '+r+' down'});
  const cells=[];for(let y=0;y<r;y++)for(let x=0;x<c;x++){const d=h('div',{class:'cell','data-x':x,'data-y':y});el.appendChild(d);cells.push(d);}
  const needle=h('div',{class:'needle',html:REL()?NEEDLE_REL:NEEDLE_ABS});el.appendChild(needle);
  const api={el,target:null,
    cell:(x,y)=>cells[y*c+x],
    setTarget(set){api.target=set;cells.forEach(d=>d.classList.toggle('t',set.has(key(+d.dataset.x,+d.dataset.y))));},
    clear(){cells.forEach(d=>{d.classList.remove('s','off');d.innerHTML='';});},
    stitch(x,y){const d=api.cell(x,y);if(!d)return;const off=!!(api.target&&!api.target.has(key(x,y)));d.classList.add('s');d.classList.toggle('off',off);d.innerHTML=off?STITCH_OFF:STITCH;},
    needle(x,y,dir){needle.style.left=((x+.5)/c*100)+'%';needle.style.top=((y+.5)/r*100)+'%';needle.firstChild.style.setProperty('--rot',((dir||0)*90)+'deg');},
    bump(){needle.classList.remove('bump');void needle.offsetWidth;needle.classList.add('bump');},
    reset(){api.clear();api.stitch(t.start.x,t.start.y);api.needle(t.start.x,t.start.y,t.start.dir);}
  };
  api.cell(t.start.x,t.start.y).classList.add('st');
  api.reset();

}

/* ---------- running a code ---------- */
function speed(n){const base=isMaeve()?(S.easy?650:560):480;return n>20?Math.round(base*.62):base;}
function Runner(cloth,t,getItems,cb){
  let sim=null,i=-1,timer=null,running=false;
  function stop(){clearTimeout(timer);running=false;cb.busy&&cb.busy(false);}
  function begin(){stop();sim=simulate(getItems(),t);i=-1;cloth.reset();cb.reset&&cb.reset();}
  function apply(){const s=sim.steps[i];if(s.bump)cloth.bump();else{cloth.needle(s.x,s.y,s.dir);if(s.stitch)cloth.stitch(s.x,s.y);}cb.step&&cb.step(s);}
  function end(){running=false;cb.busy&&cb.busy(false);cb.end&&cb.end(sim);}
  return {
    run(){begin();if(!sim.steps.length){cb.empty&&cb.empty();return;}running=true;cb.busy&&cb.busy(true);
      const tick=()=>{i++;apply();if(i>=sim.steps.length-1)end();else timer=setTimeout(tick,speed(sim.steps.length));};timer=setTimeout(tick,300);},
    step(){if(running)return;if(!sim||i>=sim.steps.length-1){begin();if(!sim.steps.length){cb.empty&&cb.empty();return;}}i++;apply();if(i>=sim.steps.length-1)end();},
    reset(){stop();sim=null;i=-1;cloth.reset();cb.reset&&cb.reset();},
    stop
  };
}

}

      return cardEl(it.op,{tag:'button',num:it.num,cls:sel===it.id?'sel':null,on:{click:e=>{e.stopPropagation();if(o.locked)return;
        if(tray){removeId(it.id);tray.push(it);changed();return;}sel=sel===it.id?null:it.id;draw();}}});});
    const main=h('div',{class:'code'+(items.length?'':' empty'),'data-empty':tray?'Tap the cards below to put them in order.':'Tap a card below to add it to your code.'},drawList(items,false));
    if(!o.locked)main.addEventListener('click',()=>{if(tgt!=='main'&&!t.preRepeat){tgt='main';draw();}});
    codeBox.appendChild(main);
    if(sel){const it=find(sel);if(it){editBox.appendChild(h('div',{class:'edit'},h('span',null,'Card '+it.num+': change to'),
      t.ops.filter(op=>op!==it.op).map(op=>cardEl(op,{tag:'button',on:{click:()=>{it.op=op;changed();}}})),
      h('button',{class:'btn ghost small',type:'button',on:{click:()=>{removeId(it.id);changed();}}},'Take it out'),
      h('button',{class:'btn ghost small',type:'button',on:{click:()=>{sel=null;draw();}}},'Cancel')));}}
    if(!o.locked&&!t.debug){
      if(tray){trayBox.appendChild(h('div',{class:'tray'},tray.map(it=>cardEl(it.op,{tag:'button',on:{click:()=>fromTray(it)}}))));}
      else{const inRep=tgt!=='main';
        trayBox.appendChild(h('div',{class:'tray'},t.ops.map(op=>cardEl(op,{tag:'button',disabled:full(),on:{click:()=>add(op)}})),
          (t.allowRepeat&&!inRep)?h('button',{class:'card rep',type:'button',disabled:full(),on:{click:addRep}},h('span',{class:'ic',html:ICON.rep}),h('span',null,'Repeat')):null));
        if(inRep&&!t.preRepeat)trayBox.appendChild(h('button',{class:'btn ghost small',type:'button',on:{click:()=>{tgt='main';draw();}}},'Finish the Repeat'));
        if(inRep&&t.preRepeat)trayBox.appendChild(h('p',{class:'note'},'Cards go inside the Repeat. Use − and + to set how many times.'));}
    }
    const n=countCards(items);budget.textContent='';
    if(t.budget)budget.append('Cards used: ',h('b',null,String(n)),' (aim: '+t.budget+' or fewer)');
    else if(t.max)budget.append('Cards used: ',h('b',null,String(n)),' of '+t.max);
  }
  view.append(codeBox,editBox,trayBox,budget);draw();
  return {el:view,items:()=>items,redraw:draw,lock(v){o.locked=v;sel=null;draw();},
    undo(){if(tray){const it=items.pop();if(it){tray.push(it);changed();}return;}const id=history.pop();if(id){removeId(id);if(tgt===id)tgt='main';changed();}},
    clear(){if(tray){tray=tray.concat(items);items=[];}else if(t.preRepeat){items[0].body=[];tgt=items[0].id;}else{items=[];tgt='main';}history.length=0;changed();}};
}

SCREENS.build=(t,panel)=>{
  const q=G.ask({item:t.item,concept:t.concept,area:t.area});const msg=h('div',{class:'msg',role:'status'});
  const target=targetOf(t);const cloth=Cloth(t);cloth.setTarget(target);
  const round=h('div',{class:'round'});let solved=false;
  const nx=h('button',{class:'btn',type:'button',disabled:true,on:{click:advance}},'Next');
  let edited=false;
  const ed=Editor(t,{changed:()=>{edited=true;run&&run.reset();say(msg,'');},say:s=>say(msg,s)});
  let hl;const run=Runner(cloth,t,()=>ed.items(),{
    step:s=>hl.step(s),reset:()=>hl&&hl.clear(),
    busy:b=>{runB.disabled=b||solved;stepB.disabled=b||solved;},
    empty:()=>say(msg,'Add some cards first.'),
    end:sim=>{if(solved)return;const items=ed.items();const n=countCards(items);const exact=!sim.bumped&&eqSet(sim.seen,target);
      if(exact&&t.budget&&n>t.budget){q.miss('right pattern, '+n+' cards: '+codeText(items));say(msg,'Right pattern! But that\'s **'+n+' cards**. Can you make it with **'+t.budget+' or fewer**? Look for cards that repeat.');return;}
      if(exact&&t.mustRepeat&&!hasRepeat(items)){say(msg,'That works! Now make it **using the Repeat card**.');return;}
      if(exact){solved=true;q.done();ed.lock(true);runB.disabled=stepB.disabled=true;
        say(msg,t.debug?'Bug fixed! The needle stitches every dotted square.':(t.budget?'Done in '+n+' cards. That\'s the power of a loop.':'Every dotted square is stitched. Well coded!'),true);nx.disabled=false;return;}
      if(t.debug&&!edited){say(msg,'There\'s the bug at work: the needle doesn\'t follow the dotted squares. Tap **Step** to find the first card that goes wrong, then tap that card to fix it.');return;}
      if(sim.bumped){const last=sim.steps[sim.steps.length-1];q.miss('bump at card '+last.num+': '+codeText(items));say(msg,'Bump! **Card '+last.num+'** would take the needle off the cloth.');return;}
      if(!subset(sim.seen,target)){q.miss(codeText(items));say(msg,'Some stitches landed off the dotted squares (the ones with dashed circles). Tap **Step** to watch one card at a time and find the first card that goes wrong.');return;}
      say(msg,'So far so good. Some dotted squares still need stitching. What comes next?');}});
  const runB=h('button',{class:'btn brass',type:'button',on:{click:()=>{say(msg,'');run.run();}}},'Run');
  const stepB=h('button',{class:'btn ghost',type:'button',on:{click:()=>run.step()}},'Step');
  const extra=t.debug?[]:[h('button',{class:'btn ghost small',type:'button',on:{click:()=>{if(!solved)ed.undo();}}},'Undo'),h('button',{class:'btn ghost small',type:'button',on:{click:()=>{if(!solved)ed.clear();}}},'Clear')];
  const side=h('div',null,h('p',{class:'prompt'},rich(t.prompt)),
    t.long?h('div',{style:'margin-bottom:10px'},h('p',{class:'note',style:'margin-bottom:4px'},'The long program:'),miniStrip(t.long)):null,
    ed.el,h('div',{class:'controls'},runB,stepB,extra),msg,helpBox(t.hints,q),
    h('div',{class:'next-row'},t.optional?h('button',{class:'btn ghost',type:'button',on:{click:advance}},'Skip the challenge'):null,nx));
  hl=highlighter(side,round);
  panel.appendChild(h('div',{class:'stage'},h('div',{class:'cloth-wrap'},cloth.el,round,legend(true)),side));
};

SCREENS.write=(t,panel)=>{
  const ta=h('textarea',{'aria-label':t.prompt,placeholder:t.example||''});ta.value=S.writing[t.wkey]||'';
  const nx=h('button',{class:'btn',type:'button',on:{click:()=>{S.writing[t.wkey]=ta.value;save();if(ta.value.trim())G.write({game:GAME,part:parts()[S.part].title,area:t.area,prompt:t.prompt,text:ta.value});advance();}}},'Next');
  const upd=()=>{nx.disabled=!t.optional&&words(ta.value)<(t.min||1);};
  ta.addEventListener('input',()=>{S.writing[t.wkey]=ta.value;save();G.write({game:GAME,part:parts()[S.part].title,area:t.area,prompt:t.prompt,text:ta.value});upd();});
  upd();
  panel.append(h('p',{class:'prompt'},rich('**'+t.prompt+'**')),P(t.sub||''),ta,h('div',{class:'next-row'},nx));
};

SCREENS.design=(t,panel)=>{
  const msg=h('div',{class:'msg',role:'status'});const cloth=Cloth(t);const round=h('div',{class:'round'});
  const tt=Object.assign({},t,{allowRepeat:true});if(S.design)tt.prog=S.design;
  const ed=Editor(tt,{changed:()=>{run&&run.reset();say(msg,'');S.design=toSpec(ed.items());save();},say:s=>say(msg,s)});
  let hl;let ran=false;const run=Runner(cloth,t,()=>ed.items(),{step:s=>hl.step(s),reset:()=>hl&&hl.clear(),empty:()=>say(msg,'Add some cards first.'),
    end:sim=>{ran=true;if(sim.bumped){const l=sim.steps[sim.steps.length-1];say(msg,'Bump! Card '+l.num+' takes the needle off the cloth. Change it so your sister\'s pattern fits.');}else{say(msg,'There\'s your pattern. Change anything you like, or tap **I\'m finished**.',true);}}});
  const colours=[['#2F3C8F','Indigo'],['#A8322A','Madder red'],['#3F6B3A','Moss green']];
  const sw=h('div',{class:'colours'},colours.map(([c,n])=>{const b=h('button',{class:'sw',type:'button','aria-label':n+' thread','aria-pressed':String(S.colour===c),style:'background:'+c});
    b.addEventListener('click',()=>{S.colour=c;save();document.body.style.setProperty('--thread',c);sw.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});return b;}));
  const fin=h('button',{class:'btn',type:'button',on:{click:()=>{const items=ed.items();const sim=simulate(items,t);
    if(countCards(items)<3){say(msg,'Use at least 3 cards, so there\'s something to predict.');return;}
    if(sim.bumped){say(msg,'Your code bumps off the cloth. Run it and fix it first.');return;}
    S.design=toSpec(items);save();G.write({game:GAME,part:'A pattern for your sister',area:'ICTDT',prompt:'My pattern code for my sister',text:codeText(items)});advance();}}},"I'm finished");
  const side=h('div',null,h('p',{class:'prompt'},rich('Design a pattern for **'+SIS()+'**. Use any cards, and a Repeat if you like. Run it to see what it makes.')),
    ed.el,h('div',{class:'controls'},h('button',{class:'btn brass',type:'button',on:{click:()=>run.run()}},'Run'),h('button',{class:'btn ghost',type:'button',on:{click:()=>run.step()}},'Step'),
      h('button',{class:'btn ghost small',type:'button',on:{click:()=>ed.undo()}},'Undo'),h('button',{class:'btn ghost small',type:'button',on:{click:()=>ed.clear()}},'Clear')),
    h('p',{class:'note',style:'margin:14px 0 0'},'Thread colour:'),sw,msg,h('div',{class:'next-row'},fin));
  hl=highlighter(side,round);
  panel.appendChild(h('div',{class:'stage'},h('div',{class:'cloth-wrap'},cloth.el,round,legend(false)),side));
};

SCREENS.show=(t,panel)=>{
  const d=parts().find(p=>p.id==='sister').tasks[0];const spec=S.design||[];
  const cloth=Cloth(d);const s=strip(spec,{numbered:true});const round=h('div',{class:'round'});const hl=highlighter(s,round);
  const run=Runner(cloth,d,()=>toItems(spec),{step:hl.step,reset:hl.clear});
  panel.appendChild(h('div',{class:'stage'},h('div',{class:'cloth-wrap'},cloth.el,round,legend(false)),
    h('div',null,h('p',{class:'prompt'},rich('Show **'+SIS()+'** your code. She reads the cards and **shades her guess** on the paper grid (or squared paper). No peeking at the screen!')),
      s,P('When she\'s ready, tap **Run** and check her guess together.'),
      h('div',{class:'controls'},h('button',{class:'btn brass',type:'button',on:{click:()=>run.run()}},'Run'),h('button',{class:'btn ghost',type:'button',on:{click:()=>run.step()}},'Step')),
      h('div',{class:'next-row'},h('button',{class:'btn ghost',type:'button',on:{click:()=>{S.task--;save();render();}}},'Change my design'),nextBtn("We've checked it")))));
};

SCREENS.end=(t,panel)=>{
  if(!S.finished){S.finished=true;save();}
  const p=parts()[S.part];if(!S.done[p.id]){S.done[p.id]=true;G.partDone(p.title);save();}
  if(!finishedNow){finishedNow=true;G.finish();}
  panel.append(h('h3',{style:'color:var(--deep);font-size:1.5rem;margin-bottom:10px'},'You finished the Pattern Engine'),
    P('You read codes, wrote your own, found bugs and used a loop, just as Ada imagined people would one day.'),
    h('ul',null,h('li',null,rich('A **code** (or program) is a list of steps a machine follows exactly.')),h('li',null,rich('A **bug** is a mistake in the code. Step through it to find where it goes wrong.')),h('li',null,rich('A **Repeat** runs the same cards again and again.'))),
    h('div',{class:'next-row'},h('button',{class:'btn ghost',type:'button',on:{click:()=>{S.part=null;save();render();}}},'Back to the map'),h('a',{class:'btn',href:'../../index.html',style:'text-decoration:none;display:inline-flex;align-items:center'},'Back to the Games Room')));
};

window.PE={simulate,toItems,parts,targetOf,state:()=>S,go(part,task){S.part=part;S.task=task||0;save();render();},setEasy(v){S.easy=v;save();whoBar();render();}};
whoBar();render();
