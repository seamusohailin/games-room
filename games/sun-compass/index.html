<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Captain Hale’s Sun Compass</title>
<script src="../../results.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fraunces:opsz,wght@9..144,700&display=swap">
<style>
/* Captain Hale's Sun Compass: find north with only the Sun. Pictures first, one short line of text, hands-on moves. Maeve's teal for every action. */
:root{
  --bg:#10263a; --bg-deep:#091726; --glow:#f2c75c; --parch:#f8efdc; --parch-2:#e8d9b6; --parch-3:#d6c193;
  --ink:#2a2118; --muted:#6d5c44; --teal:#16A08F; --teal-deep:#0c6b5f; --wax:#a5302a; --rope:#b0864f;
  --ok:#2f7d4f; --ok-bg:#e1f1e2; --hmm-bg:#fbecd2; --clue-bg:#fff4d6; --on-dark:#f4ead6;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Andika","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:radial-gradient(ellipse at 90% -5%,rgba(242,199,92,.22),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(22,160,143,.14),transparent 50%);
  color:var(--on-dark);font-family:var(--body);font-size:1.15rem;line-height:1.4;min-height:100vh;-webkit-text-size-adjust:100%}
.wrap{max-width:960px;margin:0 auto;padding:max(12px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(90px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
svg text{font-family:var(--body)}

.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding-bottom:10px;margin-bottom:12px;border-bottom:2px dashed rgba(242,199,92,.35)}
.brand h1{color:var(--glow);font-size:clamp(1.6rem,5vw,2.3rem);line-height:1.05}
.status{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pips{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.pips li{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;border:2px solid var(--parch-3);color:var(--parch-3)}
.pips li.done{background:var(--teal);border-color:var(--teal);color:#fff}
.pips li.now{background:var(--glow);border-color:var(--glow);color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:8px;background:var(--bg-deep);border:2px solid var(--parch-3);border-radius:999px;padding:6px 14px;min-height:46px;cursor:pointer;font-size:.95rem}
.toggle .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--parch-3);display:grid;place-items:center}
.toggle[aria-pressed="true"]{border-color:var(--teal)}
.toggle[aria-pressed="true"] .box{background:var(--teal);border-color:var(--teal)}
.toggle[aria-pressed="true"] .box::after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px)}

.panel{background:var(--parch);color:var(--ink);border-radius:14px;padding:14px 16px 16px;box-shadow:0 6px 0 var(--bg-deep)}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.phead h2{color:var(--wax);font-size:clamp(1.3rem,4vw,1.7rem)}
.dots{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.dots li{width:16px;height:16px;border-radius:50%;border:2px solid var(--parch-3);background:#fff}
.dots li.on{background:var(--teal);border-color:var(--teal)}
.bubble{display:flex;gap:10px;align-items:center;margin:10px 0 0;min-height:52px}
.bubble .who{flex:none;width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;border:2px solid var(--rope)}
.bubble .who svg{width:38px;height:38px}
.bubble p{flex:1;margin:0;font-size:1.3rem;line-height:1.35;font-weight:700;background:#fff;border-radius:14px;padding:8px 14px;border:2px solid var(--parch-2)}
.qbtn{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid #E3BE5C;background:var(--clue-bg);font-weight:700;font-size:1.3rem;cursor:pointer;color:var(--ink)}
.qbtn[disabled]{opacity:.35;cursor:default}
.clue{margin:8px 0 0 60px;background:var(--clue-bg);border-radius:12px;padding:8px 12px;font-size:1.1rem}

.sw{position:relative;margin-top:10px;border-radius:14px;background:#0b1c2c;padding:5px;box-shadow:inset 0 0 0 2px rgba(176,134,79,.45)}
.sw>svg{display:block;width:100%;height:auto;border-radius:10px;touch-action:manipulation}
.ov{position:absolute;inset:5px;pointer-events:none}
.ov>*{pointer-events:auto}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:88%;padding:8px 18px;border-radius:999px;font-weight:700;font-size:1.2rem;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.25);z-index:5;pointer-events:none}
.toast.yes{background:var(--ok-bg);color:var(--ok);border:3px solid var(--ok)}
.toast.hmm{background:var(--hmm-bg);color:#7a4a12;border:3px solid #E3BE5C}
.toast.info{background:#fff;color:var(--ink);border:3px solid var(--rope)}
.tray{margin-top:12px;min-height:60px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.btn{font-family:var(--body);font-weight:700;font-size:1.25rem;background:var(--teal);color:#fff;border:0;border-radius:999px;padding:.5em 1.5em;min-height:58px;cursor:pointer;box-shadow:0 4px 0 var(--teal-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-deep)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink),0 4px 0 var(--parch-3)}
.btn[disabled]{opacity:.5}

/* picture tiles */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:#fff;border:3px solid var(--parch-2);border-radius:16px;padding:8px 8px 10px;cursor:pointer;box-shadow:0 4px 0 var(--parch-2);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:1.15rem;color:var(--ink)}
.tile svg{width:96px;height:72px}
.tile.yes{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok)}
.tile.no{opacity:.35;box-shadow:none}

/* things to drag */
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border:3px solid var(--teal);border-radius:16px;padding:6px 14px;min-height:58px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:1.2rem;color:var(--ink);cursor:grab;box-shadow:0 4px 0 var(--teal-deep);position:relative}
.chip svg{width:40px;height:40px;flex:none}
.chip.lift{z-index:60;cursor:grabbing;box-shadow:0 10px 18px rgba(0,0,0,.3)}
.chip.sel{background:#e9f7f5;box-shadow:0 0 0 4px var(--glow),0 4px 0 var(--teal-deep)}
.chip.used{visibility:hidden}
.chip.shake{animation:shake .45s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.chip.float{position:absolute;border-color:#1f5fa8;box-shadow:0 4px 0 #154a86;background:#e9f2fb;padding:4px 8px;min-height:52px}
.chip.float svg{width:52px;height:52px}
svg .drop{cursor:pointer}
svg .drop.cando{fill:rgba(242,199,92,.25);stroke:#f2c75c;stroke-width:3;stroke-dasharray:8 6}
svg .drop.over{fill:rgba(22,160,143,.35);stroke:#16A08F;stroke-width:4}
#ara path.drop.cando{fill:#efe3bd;stroke:#f2c75c;stroke-width:4}
#ara path.drop.over{fill:#cdeee8;stroke:#16A08F;stroke-width:5}

/* slider */
.slide{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--parch-2);border-radius:999px;padding:6px 16px}
.slide svg{width:44px;height:44px;flex:none}
.slide input{flex:1;height:48px;accent-color:var(--teal)}
.monthbox{display:flex;align-items:center;gap:12px;justify-content:center;margin:0 0 8px}
.monthbox b{font-family:var(--display);font-size:1.8rem;color:var(--wax);min-width:6.5em;text-align:center}
.monthbox span{width:52px;height:52px;display:inline-block}
.monthbox svg{width:52px;height:52px}

/* poem */
.poem{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;background:#fffaf0;border:2px solid var(--parch-2);border-radius:12px;padding:10px 14px;margin-top:10px}
.poem p{margin:0;font-size:1.15rem;line-height:1.6;transition:opacity .5s}
.poem p.dim{opacity:.2}
.poem .cite{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
.gap{display:inline-block;min-width:96px;border-bottom:3px dashed var(--teal);text-align:center;color:var(--teal-deep);font-weight:700;padding:0 4px;border-radius:6px;cursor:pointer}
.gap.cando{background:#fff4d6}
.gap.over{background:#d9f1ed}
.gap.filled{border-bottom-style:solid;border-color:var(--ok);color:var(--ok)}
@media (max-width:640px){.poem{grid-template-columns:1fr}}

/* chance line */
.chance{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chance .drop{background:#fff;border:3px solid var(--parch-2);border-radius:14px;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:1.05rem;text-align:center;color:var(--ink);cursor:pointer}
.chance .drop svg{width:34px;height:34px}
.chance .drop.cando{border-color:var(--glow);border-style:dashed}
.chance .drop.over{border-color:var(--teal);background:#e9f7f5}
.chance .drop.filled{border-color:var(--ok);background:var(--ok-bg)}

/* sorting cards */
.sorts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sorts .drop{background:#fff;border:3px solid var(--parch-2);border-radius:14px;padding:6px;text-align:center;min-height:140px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.sorts .drop svg{width:100%;height:auto;max-height:110px}
.sorts .drop b{font-size:1.05rem;min-height:1.4em;color:var(--ok)}
.sorts .drop.cando{border-color:var(--glow);border-style:dashed}
.sorts .drop.over{border-color:var(--teal);background:#e9f7f5}
.sorts .drop.filled{border-color:var(--ok);background:var(--ok-bg)}

/* true-story card over the picture */
.card{position:absolute;inset:5px;background:rgba(9,23,38,.72);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:12px;z-index:8}
.card .in{background:#fffaf0;border:3px double var(--rope);border-radius:14px;padding:14px 16px;max-width:560px;width:100%;position:relative}
.card .ribbon{position:absolute;top:-14px;left:14px;background:var(--wax);color:#fff;font-weight:700;font-size:.9rem;padding:3px 12px;border-radius:999px}
.card h3{color:var(--wax);font-size:1.25rem;margin:4px 0 6px}
.card svg{width:100%;height:auto;display:block;margin:4px 0 8px}
.card p{margin:0 0 4px;font-size:1.2rem;font-weight:700}
.card .row{margin-top:8px}

/* end of a part */
.donebox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;background:#fff;border:3px solid var(--ok);border-radius:16px;padding:10px 14px}
.donebox .stamp{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:1.8rem;font-weight:700;flex:none}
.donebox p{margin:0;font-size:1.2rem;font-weight:700;flex:1;min-width:200px}

/* contents */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:700px){.hero{grid-template-columns:1fr}}
.hero p{font-size:1.25rem;margin:0 0 8px}
.hero .note{font-size:.9rem;color:var(--muted)}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.part{text-align:center;border:0;cursor:pointer;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;box-shadow:0 4px 0 var(--parch-3)}
.part svg{width:100%;max-width:150px;height:auto}
.part[disabled]{opacity:.45;cursor:default}
.part h3{font-size:1.05rem;color:var(--ink)}
.part .tag{font-size:.85rem;font-weight:700;color:var(--muted)}
.part.next{box-shadow:0 0 0 4px var(--glow),0 4px 0 var(--parch-3)}
.part.next .tag{color:var(--teal-deep)}

/* the end */
.endgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.endgrid div{background:#fffaf0;border:2px solid var(--parch-2);border-radius:12px;padding:8px;text-align:center;font-size:1rem;font-weight:700}
.endgrid svg{width:70px;height:56px;display:block;margin:0 auto 4px}
.tell{background:#fff;border:2px solid var(--parch-2);border-radius:12px;padding:10px 14px;margin-top:10px}
.tell h3{color:var(--wax);font-size:1.15rem;margin-bottom:4px}
.tell ul{margin:0;padding-left:1.2em}
textarea{width:100%;min-height:64px;font:inherit;font-size:1.15rem;border:2px solid var(--parch-3);border-radius:12px;padding:10px;background:#fff;color:var(--ink);margin-top:6px}


.smoke{animation:smoke 3s ease-out infinite}
@keyframes smoke{0%{transform:translate(0,0);opacity:.8}100%{transform:translate(10px,-26px);opacity:0}}
.half{cursor:pointer}
.half.tappable{fill:rgba(242,199,92,.25);stroke:#f2c75c;stroke-width:3;stroke-dasharray:8 6}
.half.no{fill:rgba(20,20,20,.3)}
.half.yes{fill:rgba(22,160,143,.35);stroke:#16A08F;stroke-width:4}
.readout{display:flex;align-items:center;gap:16px;justify-content:center;margin-top:10px;background:#fff;border:2px solid var(--parch-2);border-radius:14px;padding:8px 14px;color:var(--ink)}
.readout svg{width:34px;height:90px;flex:none}
.readout b{font-family:var(--display);font-size:2.3rem;color:var(--wax);display:block;line-height:1.05}
.readout span{font-weight:700;font-size:1.2rem}
.slide .end{font-weight:700;font-size:1rem;color:var(--muted);min-width:3.2em;text-align:center}
.chip.big{padding:6px 10px}
.chip.big svg{width:84px;height:62px}
.chip.badge svg{width:46px;height:46px}
.sorts.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:640px){.sorts.four{grid-template-columns:repeat(2,1fr)}}
.clockbox{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 8px}
.clockbox b{font-family:var(--display);font-size:1.8rem;color:var(--wax);min-width:6.5em;text-align:center}
.clockbox svg{width:52px;height:52px}
.todo{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.todo li button{width:100%;display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--parch-2);border-radius:16px;padding:8px 12px;cursor:pointer;text-align:left;font-weight:700;font-size:1.25rem;color:var(--ink);min-height:76px;box-shadow:0 4px 0 var(--parch-2)}
.todo li button svg.pic{width:78px;height:60px;flex:none}
.todo li button small{display:block;font-weight:400;font-size:1rem;color:var(--muted)}
.todo .box2{width:38px;height:38px;border-radius:10px;border:3px solid var(--parch-3);flex:none;display:grid;place-items:center;margin-left:auto}
.todo button[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok)}
.todo button[aria-pressed="true"] .box2{background:var(--ok);border-color:var(--ok)}
.todo button[aria-pressed="true"] .box2::after{content:"";width:14px;height:8px;border:solid #fff;border-width:0 0 4px 4px;transform:rotate(-45deg) translate(1px,-2px)}
.todo li.mum button{border-color:var(--teal);box-shadow:0 4px 0 var(--teal-deep)}
.bigq{font-family:var(--display);color:var(--wax);font-size:clamp(1.4rem,4.4vw,1.9rem);margin:14px 0 2px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.inst{text-align:center;font-weight:700;font-size:1.1rem;color:var(--muted);margin:0 0 8px}
.cand{cursor:pointer}
.cand .vis{stroke:#f2c75c;stroke-width:5;stroke-dasharray:10 6;fill:none}
.cand .hitp{stroke:transparent;stroke-width:44;fill:none}
.cand.no .vis{stroke:#8a7a62;opacity:.45}
.cand.ring .vis{stroke:#16A08F;stroke-width:7}
.cand.yes .vis{stroke:#16A08F;stroke-dasharray:none;stroke-width:6}
.grown{margin-top:24px;padding-top:12px;border-top:2px dashed rgba(244,234,214,.25);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.95rem;opacity:.85}
.grown button{background:transparent;border:2px solid rgba(244,234,214,.5);border-radius:999px;padding:6px 14px;min-height:44px;cursor:pointer;font-size:.95rem}

/* ---- Sun compass: sky, globe, island, beach and sea ---- */
.sw>svg{max-height:62vh}
@media (orientation:landscape){.sw>svg{max-height:50vh}}
svg .drop{fill:transparent}
.readout2{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:10px;background:#fff;border:2px solid var(--parch-2);border-radius:14px;padding:8px 14px;color:var(--ink);min-height:66px}
.readout2 b{font-family:var(--display);font-size:clamp(1.15rem,3.6vw,1.45rem);color:var(--wax);text-align:center;line-height:1.2}
.readout2 svg{width:46px;height:46px;flex:none}
.ticks{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;list-style:none;padding:0}
.ticks li{background:#fff;border:2px solid var(--parch-3);color:var(--muted);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.95rem}
.ticks li.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seq{display:grid;gap:8px;grid-template-columns:repeat(var(--n),minmax(0,1fr));margin-bottom:12px}
.seq .drop{background:#fff;border:3px dashed var(--parch-3);border-radius:14px;min-height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;color:var(--ink);font-size:.95rem;padding:4px;cursor:pointer}
.seq .drop .n{font-family:var(--display);font-size:1.6rem;color:var(--parch-3)}
.seq .drop.cando{border-color:var(--glow)}
.seq .drop.over{border-color:var(--teal);background:#e9f7f5}
.seq .drop.filled{border:3px solid var(--ok);background:var(--ok-bg)}
.seq .drop svg{width:100%;max-width:96px;height:auto}
.seqhead{display:flex;justify-content:space-between;font-weight:700;color:var(--muted);font-size:1rem;margin:0 4px 4px}
.chip.sky{padding:4px 6px 4px;flex-direction:column;gap:0;font-size:1rem}
.chip.sky svg{width:88px;height:66px}
.turnrow .btn{display:inline-flex;align-items:center;gap:8px}
.turnrow .btn svg{width:30px;height:30px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices .tile svg{width:120px;height:90px}
svg .ed{cursor:pointer}
svg .ed circle.ring{fill:rgba(255,255,255,.18);stroke:#fff;stroke-width:3;stroke-dasharray:7 5}
svg .ed text{pointer-events:none}
svg .ed.tappable circle.ring{fill:rgba(242,199,92,.3);stroke:#f2c75c;stroke-width:4}
svg .ed.no{opacity:.35}
svg .ed.yes circle.ring,svg .ed.ring circle.ring{fill:rgba(22,160,143,.5);stroke:#16A08F;stroke-width:5;stroke-dasharray:none}
svg .sc{cursor:pointer}
svg .sc .vis{fill:rgba(42,33,24,.12);stroke:#fff;stroke-width:3;stroke-dasharray:8 6}
svg .sc .hitp{fill:transparent;stroke:transparent;stroke-width:30}
svg .sc.tappable .vis{stroke:#f2c75c;stroke-width:4}
svg .sc.no{opacity:.3}
svg .sc.yes .vis,svg .sc.ring .vis{fill:rgba(42,33,24,.6);stroke:#16A08F;stroke-width:4;stroke-dasharray:none}
.hidden{opacity:0;transition:opacity .6s}
.shown{opacity:1!important;transition:opacity .6s}
.glowpulse{animation:gp 1.4s ease-in-out infinite}
@keyframes gp{50%{opacity:.35}}
.bobship{animation:bobs 3s ease-in-out infinite}
@keyframes bobs{50%{transform:translateY(-2px)}}
.letter{font-family:var(--display);font-weight:700}
.letterbox{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chip.let{font-family:var(--display);font-size:1.6rem;min-width:64px;justify-content:center}
.wbox{background:#fff;border:2px solid var(--parch-2);border-radius:12px;padding:10px 14px;margin-top:12px;color:var(--ink)}
.wbox label{font-weight:700;color:var(--wax);display:block}

<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Captain Hale’s Sun Compass</h1></div>
    <div class="status">
      <ol class="pips" id="pips" aria-label="Parts"></ol>
      <button class="toggle" id="easy" aria-pressed="false"><span class="box"></span>Calm seas (easier)</button>
    </div>
  </header>
  <main id="main"></main>
  <footer class="grown">
    <span>Your place is saved after each part. You can stop any time.</span>
    <button id="home">Contents</button>
    <button id="reset">Start again</button>
  </footer>
</div>
<script>
'use strict';
const G=window.GR||{player:()=>'unknown',key:k=>k,start(){},part(){},partDone(){},finish(){},ask(){return {miss(){},hint(){},done(){},giveUp(){},missed:()=>0};},write(){}};
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const GAME='sun-compass';
const RM=(()=>{try{return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}})();
const main=$('#main');
let runId=0;
const sleep=ms=>{const r=runId;return new Promise(res=>setTimeout(()=>{if(r===runId)res();},ms));};
function toTop(){try{window.scrollTo({top:0,behavior:'auto'});}catch(e){window.scrollTo(0,0);}}

/* ---------- saved progress, separate for each girl ---------- */
const KEY=G.key('sun-compass-v1');
function blank(){return {done:[],easy:false,ticks:[],write:''};}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&Array.isArray(v.done))return Object.assign(blank(),v);}catch(e){}return blank();}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ================= maths and colour helpers ================= */
const D2R=Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const f1=v=>(+v).toFixed(1);
const norm=a=>((a%360)+360)%360;
const sameDir=(a,b)=>norm(a-b)<1||norm(a-b)>359;
const pick=a=>a[Math.floor(Math.random()*a.length)];
/* a point at screen angle a (degrees, anticlockwise from the right) */
const PT=(cx,cy,rx,a,ry)=>[cx+rx*Math.cos(a*D2R),cy-(ry==null?rx:ry)*Math.sin(a*D2R)];
function hex(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));}
function mix(a,b,k){k=clamp(k,0,1);const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],k)).toString(16).padStart(2,'0')).join('');}
/* sky colours from the height of the Sun (s: -1 deep night to 1 high) */
function skyCols(s){
  if(s<-0.25)return ['#0b1630','#1a2a52'];
  if(s<0){const k=(s+0.25)/0.25;return [mix('#0b1630','#3b4a86',k),mix('#1a2a52','#f2a26e',k)];}
  if(s<0.3){const k=s/0.3;return [mix('#3b4a86','#5aa6e0',k),mix('#f2a26e','#c4e6f8',k)];}
  return ['#5aa6e0','#c4e6f8'];
}
function setA(sel,k,v){const e=typeof sel==='string'?$(sel):sel;if(e)e.setAttribute(k,v);}
function svgPoint(svg,e){const m=svg.getScreenCTM();if(!m)return null;const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(m.inverse());}
function tween(ms,fn){return new Promise(res=>{if(RM||!ms){fn(1);res();return;}const r=runId,t0=performance.now();const st=t=>{if(r!==runId)return;const k=Math.min(1,(t-t0)/ms);fn(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2);if(k<1)requestAnimationFrame(st);else res();};requestAnimationFrame(st);});}
/* drag on an svg element: calls move(point) while a finger is down */
function dragOn(el,svg,move,up){
  let on=false,live=true;el.style.touchAction='none';
  el.addEventListener('pointerdown',e=>{if(!live)return;on=true;try{el.setPointerCapture(e.pointerId);}catch(_){}const p=svgPoint(svg,e);if(p)move(p,true);e.preventDefault();});
  el.addEventListener('pointermove',e=>{if(!on)return;const p=svgPoint(svg,e);if(p)move(p,false);});
  const stop=()=>{if(on){on=false;if(up)up();}};
  el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop);
  return {off(){live=false;on=false;el.style.touchAction='';}};
}

/* ================= pictures ================= */
const NUTMEG='<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 15L9 3l9 8zM33 15L31 3l-9 8z" fill="#e08a3c"/><path d="M10 13l1-6 4 4zM30 13l-1-6-4 4z" fill="#f6c7a0"/><circle cx="20" cy="22" r="14" fill="#e08a3c"/><path d="M14 12q2 3 0 6M20 10v6M26 12q-2 3 0 6" stroke="#b35f1d" stroke-width="1.8" fill="none" stroke-linecap="round"/><ellipse cx="14.5" cy="22" rx="2.2" ry="3" fill="#1d1a14"/><ellipse cx="25.5" cy="22" rx="2.2" ry="3" fill="#1d1a14"/><circle cx="15.2" cy="21" r=".8" fill="#fff"/><circle cx="26.2" cy="21" r=".8" fill="#fff"/><path d="M18.6 27h2.8l-1.4 1.8z" fill="#d6577a"/><path d="M20 28.8v1.2M20 30q-2.2 1.8-4 .2M20 30q2.2 1.8 4 .2" stroke="#1d1a14" stroke-width="1.1" fill="none" stroke-linecap="round"/><path d="M4 25l8 1M4 29l8-1M36 25l-8 1M36 29l-8-1" stroke="#fff" stroke-width="1" stroke-linecap="round"/></svg>';
const SUNG=(x,y,r,rays)=>`<g transform="translate(${f1(x)} ${f1(y)})"><circle r="${r*1.7}" fill="#ffe08a" opacity=".3"/>${rays?`<g stroke="#ffc93c" stroke-width="${Math.max(2,r/6)}" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a=>{const [x1,y1]=PT(0,0,r*1.25,a),[x2,y2]=PT(0,0,r*1.6,a);return `<path d="M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}"/>`;}).join('')}</g>`:''}<circle r="${r}" fill="#ffc93c" stroke="#f2a51f" stroke-width="2"/></g>`;
const TURNL='<svg viewBox="0 0 30 30" aria-hidden="true"><path d="M22 22A9 9 0 1 1 22 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M17 3l6 5-7 3z" fill="currentColor"/></svg>';
const TURNR='<svg viewBox="0 0 30 30" aria-hidden="true"><path d="M8 22A9 9 0 1 0 8 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M13 3l-6 5 7 3z" fill="currentColor"/></svg>';
const ARROWDEF=(id,col)=>`<marker id="${id}" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto"><path d="M0 0L10 5L0 10z" fill="${col}"/></marker>`;

/* a little sky picture for tiles and chips (t: time of day, as in the harbour) */
function miniSky(t,w,h){
  w=w||96;h=h||72;const s=Math.sin(Math.PI*t);const [top,hor]=skyCols(s);const id='m'+Math.random().toString(36).slice(2,8);
  const hy=h*0.7,x=w/2+w*0.42*Math.cos(Math.PI*t),y=hy-h*0.55*Math.sin(Math.PI*t);
  const glow=clamp(1-Math.abs(s+0.03)/0.22,0,1);
  const stars=clamp(-s*5,0,1);
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${hor}"/></linearGradient><radialGradient id="${id}g"><stop offset="0" stop-color="#ffd08a" stop-opacity=".95"/><stop offset="1" stop-color="#f59a6a" stop-opacity="0"/></radialGradient><clipPath id="${id}c"><rect width="${w}" height="${hy}"/></clipPath></defs>
  <rect width="${w}" height="${h}" rx="8" fill="url(#${id})"/>
  <g fill="#fff" opacity="${stars.toFixed(2)}"><circle cx="${w*.2}" cy="${h*.15}" r="1.3"/><circle cx="${w*.5}" cy="${h*.1}" r="1.1"/><circle cx="${w*.75}" cy="${h*.22}" r="1.3"/><circle cx="${w*.35}" cy="${h*.3}" r="1"/></g>
  <ellipse cx="${f1(clamp(x,6,w-6))}" cy="${hy}" rx="${w*.42}" ry="${h*.3}" fill="url(#${id}g)" opacity="${glow.toFixed(2)}"/>
  ${s>0?`<g clip-path="url(#${id}c)"><circle cx="${f1(x)}" cy="${f1(y)}" r="${h*.13}" fill="#ffc93c"/></g>`:''}
  <rect y="${hy}" width="${w}" height="${h-hy}" fill="${mix('#0e2240','#2f78ad',clamp((s+0.1)/0.35,0,1))}"/>
  <rect width="${w}" height="${h}" rx="8" fill="none" stroke="rgba(0,0,0,.15)"/></svg>`;
}

/* ================= scene 1: the harbour, looking out to sea ================= */
const HZ=250;
const sunXY=t=>[300+250*Math.cos(Math.PI*t),HZ-190*Math.sin(Math.PI*t)];
function harbourSVG(o){
  o=o||{};
  const stars=[[40,30],[120,70],[200,24],[260,90],[330,40],[410,80],[470,28],[540,60],[90,140],[380,150],[170,170],[500,130],[300,120]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="${(1+((x*7+y)%3)*0.4).toFixed(1)}"/>`).join('');
  const kid=o.kid?`<g id="hs-kid">
     <path d="M262 340q2-30 38-32t38 32z" fill="#16A08F"/>
     <circle cx="300" cy="294" r="17" fill="#6b4a2b"/><path d="M285 300q15 10 30 0" stroke="#5a3d22" stroke-width="3" fill="none"/>
     <path id="hs-arest" d="M332 318l8 22" stroke="#e8c9a6" stroke-width="9" stroke-linecap="round"/>
     <path d="M268 318l-8 22" stroke="#e8c9a6" stroke-width="9" stroke-linecap="round"/>
     <g id="hs-arm" class="hidden"><path d="M332 316L382 300" stroke="#e8c9a6" stroke-width="9" stroke-linecap="round"/><circle cx="390" cy="297" r="12" fill="#16A08F" stroke="#fff" stroke-width="2.5"/><text x="390" y="303" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">R</text></g>
     <circle class="drop" data-t="sun" cx="550" cy="232" r="46"/>
   </g>`:'';
  return `<svg id="hs" viewBox="0 0 600 340" role="img" aria-label="Captain Hale's harbour, looking out to sea">
  <defs>
    <linearGradient id="hs-g" x1="0" y1="0" x2="0" y2="1"><stop id="hs-top" offset="0" stop-color="#0b1630"/><stop id="hs-hor" offset="1" stop-color="#1a2a52"/></linearGradient>
    <radialGradient id="hs-glowg"><stop offset="0" stop-color="#ffd08a" stop-opacity=".95"/><stop offset=".5" stop-color="#f59a6a" stop-opacity=".45"/><stop offset="1" stop-color="#f59a6a" stop-opacity="0"/></radialGradient>
    <clipPath id="hs-clip"><rect width="600" height="${HZ}"/></clipPath>
  </defs>
  <rect width="600" height="${HZ}" fill="url(#hs-g)"/>
  <g id="hs-stars" fill="#fff">${stars}</g>
  <ellipse id="hs-glow" cx="550" cy="${HZ}" rx="240" ry="130" fill="url(#hs-glowg)" opacity="0"/>
  <path id="hs-path" d="M50 ${HZ}A250 190 0 0 1 550 ${HZ}" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2.5" stroke-dasharray="6 9"/>
  <g clip-path="url(#hs-clip)"><g id="hs-sun"><circle r="44" fill="#ffe08a" opacity=".3"/><circle r="25" fill="#ffc93c" stroke="#f2a51f" stroke-width="2"/></g></g>
  <rect id="hs-sea" y="${HZ}" width="600" height="${340-HZ}" fill="#0e2240"/>
  <g id="hs-refl" opacity="0" fill="#ffd27a"><ellipse cx="0" cy="${HZ+8}" rx="26" ry="4"/><ellipse cx="0" cy="${HZ+20}" rx="18" ry="3"/><ellipse cx="0" cy="${HZ+32}" rx="11" ry="2.5"/></g>
  <g stroke="rgba(255,255,255,.18)" stroke-width="2" fill="none" stroke-linecap="round"><path d="M40 285q10-5 20 0M150 300q10-5 20 0M470 292q10-5 20 0M520 318q10-5 20 0M90 322q10-5 20 0"/></g>
  <g id="hs-land" fill="#17233a">
    <path d="M120 ${HZ}q30-46 70-48t70 30q16 8 22 18z"/>
    <path d="M370 ${HZ}q20-34 50-36t52 36z"/>
    <rect x="428" y="176" width="14" height="40"/><path d="M424 176h22l-11-14z"/>
    <path d="M196 ${HZ-2}l0-52M196 ${HZ-46}l26 30h-26zM196 ${HZ-40}l-20 24h20z" stroke="#17233a" stroke-width="3"/>
    <path d="M168 ${HZ-2}h56l-8 12h-40z"/>
  </g>
  <rect id="hs-lamp" x="430" y="180" width="10" height="8" fill="#ffd27a" opacity="0"/>
  <path d="M0 ${HZ}H600" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
  <g id="hs-hz" class="hidden"><path d="M0 ${HZ}H600" stroke="#f2c75c" stroke-width="4" stroke-dasharray="10 7"/><text x="300" y="${HZ-10}" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" stroke="#0b1630" stroke-width="5" paint-order="stroke">horizon</text></g>
  <g font-weight="700" text-anchor="middle" fill="#fff" stroke="#0b1630" stroke-width="5" paint-order="stroke">
    <g id="hs-e"><text class="letter" x="566" y="282" font-size="30">E</text><text x="566" y="302" font-size="15">east</text></g>
    <g id="hs-w"><text class="letter" x="34" y="282" font-size="30">W</text><text x="34" y="302" font-size="15">west</text></g>
    <g id="hs-n" class="hidden"><text class="letter" x="300" y="${HZ+28}" font-size="34" fill="#f2c75c">N</text></g>
  </g>
  <g id="hs-s" class="hidden"><rect x="196" y="2" width="208" height="34" rx="17" fill="#fff" opacity=".92"/><text x="300" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#2a2118">South is behind you</text></g>
  ${kid}
</svg>`;
}
function setSky(t){
  const s=Math.sin(Math.PI*t);const [x,y]=sunXY(t);const [top,hor]=skyCols(s);
  setA('#hs-top','stop-color',top);setA('#hs-hor','stop-color',hor);
  setA('#hs-sun','transform',`translate(${f1(x)} ${f1(y)})`);
  setA('#hs-glow','cx',f1(clamp(x,30,570)));setA('#hs-glow','opacity',clamp(1-Math.abs(s+0.03)/0.22,0,1).toFixed(2));
  setA('#hs-stars','opacity',clamp(-s*5,0,1).toFixed(2));
  const k=clamp((s+0.1)/0.35,0,1);
  setA('#hs-land','fill',mix('#17233a','#3f6b45',k));setA('#hs-sea','fill',mix('#0e2240','#2f78ad',k));
  setA('#hs-refl','opacity',(s>0?clamp(s*3,0,0.85):0).toFixed(2));setA('#hs-refl','transform',`translate(${f1(x)} 0)`);
  setA('#hs-lamp','opacity',s<0.02?'1':'0');
}
function dayWord(t){
  if(t<-0.06)return {k:'night0',w:'Night. Morning is coming.'};
  if(t<-0.008)return {k:'glow',w:'First light: the sky begins to glow.'};
  if(t<0.06)return {k:'rise',w:'Sunrise! A golden rim, then the whole Sun.'};
  if(t<0.42)return {k:'morning',w:'Morning: the Sun climbs higher.'};
  if(t<0.58)return {k:'noon',w:'Noon: the middle of the day. The Sun is highest.'};
  if(t<0.94)return {k:'afternoon',w:'Afternoon: the Sun goes lower.'};
  if(t<1.008)return {k:'set',w:'Sunset! The Sun goes down.'};
  if(t<1.07)return {k:'twi',w:'Twilight: a soft glow is left after sunset.'};
  return {k:'night1',w:'Night.'};
}

/* a dawn or dusk horizon, with east and west on either side */
function horizonSVG(eastRight,evening){
  const t=evening?1.03:-0.03;const s=Math.sin(Math.PI*t);const [top,hor]=skyCols(s);
  const L=eastRight?['W','west']:['E','east'],R=eastRight?['E','east']:['W','west'],M=eastRight?'N':'S';
  const glowX=(eastRight!==!!evening)?540:60;
  return `<svg id="hz" viewBox="0 0 600 340" role="img" aria-label="The sky at the edge of the sea">
  <defs><linearGradient id="hz-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${hor}"/></linearGradient>
  <radialGradient id="hz-glowg"><stop offset="0" stop-color="#ffd08a" stop-opacity=".95"/><stop offset="1" stop-color="#f59a6a" stop-opacity="0"/></radialGradient><clipPath id="hz-clip"><rect width="600" height="${HZ}"/></clipPath></defs>
  <rect width="600" height="${HZ}" fill="url(#hz-g)"/>
  <ellipse id="hz-glow" cx="${glowX}" cy="${HZ}" rx="230" ry="120" fill="url(#hz-glowg)" opacity="0"/>
  <g fill="#fff" opacity=".7"><circle cx="300" cy="40" r="1.6"/><circle cx="180" cy="70" r="1.3"/><circle cx="420" cy="60" r="1.4"/><circle cx="250" cy="120" r="1.1"/></g>
  <g clip-path="url(#hz-clip)" id="hz-sun"></g>
  <rect y="${HZ}" width="600" height="${340-HZ}" fill="#1b3c63"/>
  <g stroke="rgba(255,255,255,.18)" stroke-width="2" fill="none" stroke-linecap="round"><path d="M80 285q10-5 20 0M250 305q10-5 20 0M430 292q10-5 20 0"/></g>
  <path d="M0 ${HZ}H600" stroke="rgba(255,255,255,.4)" stroke-width="1.5"/>
  <g font-weight="700" text-anchor="middle" fill="#fff" stroke="#0b1630" stroke-width="5" paint-order="stroke">
    <text class="letter" x="40" y="286" font-size="32">${L[0]}</text><text x="40" y="308" font-size="16">${L[1]}</text>
    <text class="letter" x="560" y="286" font-size="32">${R[0]}</text><text x="560" y="308" font-size="16">${R[1]}</text>
    <text class="letter" x="300" y="290" font-size="30" fill="#d6c193">${M}</text>
  </g>
  <circle class="drop" data-t="L" cx="120" cy="${HZ-14}" r="48"/>
  <circle class="drop" data-t="R" cx="480" cy="${HZ-14}" r="48"/>
</svg>`;
}

/* ================= scene 2: Wren's candle and globe, seen from the top ================= */
const GT={cx:300,cy:182,R:98};
function globeTopSVG(){
  const {cx,cy,R}=GT;
  const land=`<path d="M30 -60q20-20 45-8t10 30q-10 18-30 10t-25-32z" /><path d="M-70 -30q10-30 40-26t20 30q-6 24-30 24t-30-28z"/><path d="M-20 40q20-6 40 6t14 30q-20 14-40 0t-14-36z"/><path d="M55 20q16-4 22 10t-10 20q-18 0-12-30z"/><path d="M60 -6q12 -4 20 4t-2 14q-16 2-18-18z"/>`;
  const hale=`<g transform="translate(${R} 0) scale(1.5)"><path d="M0 0H15" stroke="#1f3b66" stroke-width="6" stroke-linecap="round"/><path d="M8 0l6-8M8 0l6 8" stroke="#1f3b66" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="0" r="5.5" fill="#e8c9a6"/><path d="M24 -8q5 8 0 16l3 0q4-8 0-16z" fill="#1d1a14"/></g>`;
  return `<svg id="gt" viewBox="0 0 600 340" role="img" aria-label="Mistress Wren's globe and candle, seen from above">
  <defs><radialGradient id="gt-cl"><stop offset="0" stop-color="#ffe7a3" stop-opacity=".55"/><stop offset="1" stop-color="#ffe7a3" stop-opacity="0"/></radialGradient>
   <linearGradient id="gt-ig" x1="0" y1="0" x2="0" y2="1"><stop id="gt-top" offset="0" stop-color="#0b1630"/><stop id="gt-hor" offset="1" stop-color="#1a2a52"/></linearGradient>
   <clipPath id="gt-iclip"><rect x="14" y="14" width="190" height="86"/></clipPath>
   ${ARROWDEF('gt-ar','#f2c75c')}</defs>
  <rect width="600" height="340" fill="#1a1626"/>
  <rect y="290" width="600" height="50" fill="#3a2a1c"/><path d="M0 290H600" stroke="#5a4330" stroke-width="3"/>
  <polygon points="520,170 ${cx},${cy-R} ${cx},${cy+R}" fill="#ffe7a3" opacity=".12"/>
  <circle cx="530" cy="168" r="80" fill="url(#gt-cl)"/>
  <rect x="514" y="180" width="32" height="74" rx="4" fill="#f4ead6" stroke="#cbb88f" stroke-width="2"/><path d="M530 180v-8" stroke="#2a2118" stroke-width="2"/>
  <path d="M530 146q12 14 0 26q-12-12 0-26z" fill="#ffc93c"/><path d="M530 156q5 7 0 13q-5-6 0-13z" fill="#fff6c8"/>
  <text x="530" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#f4ead6">the Sun</text>
  <circle cx="${cx}" cy="${cy}" r="${R}" fill="#3f7fae"/>
  <g id="gt-spin" transform="translate(${cx} ${cy})"><g fill="#d8c79a" stroke="#8a7a62" stroke-width="1.5">${land}</g>${hale}</g>
  <path d="M${cx} ${cy-R}A${R} ${R} 0 0 0 ${cx} ${cy+R}Z" fill="#05070f" opacity=".6" pointer-events="none"/>
  <path d="M${cx} ${cy-R}V${cy+R}" stroke="#ffe7a3" stroke-opacity=".4" stroke-width="2" stroke-dasharray="4 5"/>

/* drag things onto the picture. Tapping a thing and then a place works too. */
function drag(o){
  return new Promise(res=>{
    if(o.say)say(o.say);untoast();
    let chips=o.chips.slice();
    if(S.easy&&o.easyDrop)chips=chips.filter(c=>!o.easyDrop.includes(c.v));
    if(!o.keep)chips=shuffle(chips);
    const inTray=chips.filter(c=>c.x==null),floats=chips.filter(c=>c.x!=null);
    const chipHTML=c=>`<button class="chip ${c.cls||''} ${c.x!=null?'float':''}" data-v="${c.v}" ${c.x!=null?`style="left:${c.x}%;top:${c.y}%;translate:-50% -50%"`:''} aria-label="${c.aria||c.label||'drag me'}">${c.pic||''}${c.label?`<span>${c.label}</span>`:''}</button>`;
    tray((o.trayHead||'')+(inTray.length?`<div class="chips">${inTray.map(chipHTML).join('')}</div>`:'<p style="text-align:center;margin:4px 0;font-weight:700;color:#6d5c44">Drag it on the picture.</p>'));
    if(floats.length)$('#ov').insertAdjacentHTML('beforeend',floats.map(chipHTML).join(''));
    const targets=$$(o.targets);
    const decoy=t=>(o.decoys||[]).includes(t.dataset.t);
    const qs={};let firstQ=null;
    if(o.oneAsk){firstQ=ask(o);targets.forEach(t=>{if(!decoy(t))qs[t.dataset.t]=firstQ;});}
    else targets.forEach(t=>{if(decoy(t))return;const k=t.dataset.t;qs[k]=ask(o,'-'+k);if(!firstQ)firstQ=qs[k];});
    const allQ=[...new Set(Object.values(qs))];
    setHelp(o.help,allQ,o.helpExtra);
    const need=o.need||targets.filter(t=>!decoy(t)).length;
    let placed=0,sel=null,finished=false;
    const open=t=>!t.classList.contains('filled');
    function targetAt(x,y){const p=o.pad==null?12:o.pad;let best=null;for(const t of targets){if(!open(t))continue;const r=t.getBoundingClientRect();if(x>=r.left-p&&x<=r.right+p&&y>=r.top-p&&y<=r.bottom+p){if(!best||decoy(best))best=t;}}return best;}
    function mark(on){targets.forEach(t=>t.classList.toggle('cando',on&&open(t)));}
    async function attempt(chip,t){
      const v=chip.dataset.v,k=t.dataset.t,q=qs[k]||firstQ;
      if(!decoy(t)&&o.fits(v,k)){
        if(q&&!q._d){q.done();q._d=1;}
        placed++;if(!o.reuse)chip.classList.add('used');if(!o.multi)t.classList.add('filled');
        if(o.onPlace)o.onPlace(v,k,chip,t);
        if(placed>=need&&!finished){finished=true;mark(false);setHelp(null);allQ.forEach(x=>{if(x&&!x._d){x.done();x._d=1;}});await yes(o.yes,o.ms);stepDone();res();}
        else if(o.each)toast('yes',o.each(v,k),1200);
      }else{
        if(q)q.miss(o.label?o.label(v):v);chip.classList.remove('shake');void chip.offsetWidth;chip.classList.add('shake');
        toast('hmm',o.miss(v,k));
      }
    }
    const reset=chip=>{chip.style.transform='';};
    [...$$('#tray .chip'),...$$('#ov .chip')].forEach(chip=>{
      let sx=0,sy=0,moved=false,on=false;
      chip.addEventListener('pointerdown',e=>{if(chip.classList.contains('used')||finished)return;on=true;moved=false;sx=e.clientX;sy=e.clientY;try{chip.setPointerCapture(e.pointerId);}catch(_){}chip.classList.add('lift');e.preventDefault();});
      chip.addEventListener('pointermove',e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>8)moved=true;chip.style.transform=`translate(${dx}px,${dy}px)`;const over=targetAt(e.clientX,e.clientY);targets.forEach(t=>t.classList.toggle('over',t===over));});
      chip.addEventListener('pointerup',e=>{if(!on)return;on=false;chip.classList.remove('lift');reset(chip);targets.forEach(t=>t.classList.remove('over'));
        if(!moved){sel=sel===chip?null:chip;$$('.chip').forEach(c=>c.classList.toggle('sel',c===sel));mark(!!sel);return;}
        const t=targetAt(e.clientX,e.clientY);if(t)attempt(chip,t);});
      chip.addEventListener('pointercancel',()=>{on=false;chip.classList.remove('lift');reset(chip);});
    });
    targets.forEach(t=>t.addEventListener('click',()=>{if(!sel||finished||!open(t))return;const c=sel;sel=null;c.classList.remove('sel');mark(false);attempt(c,t);}));
  });
}

function sail(ship,path,from,to,ms,flip){
  return new Promise(res=>{
    const L=path.getTotalLength();
    const place=f=>{const p=path.getPointAtLength(L*f);ship.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})${flip?' scale(-1 1)':''}`);};
    if(RM||!ms){place(to);res();return;}
    const r=runId,t0=performance.now();
    const step=t=>{if(r!==runId)return;const k=Math.min(1,(t-t0)/ms);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;place(from+(to-from)*e);if(k<1)requestAnimationFrame(step);else res();};
    requestAnimationFrame(step);
  });
}


/* turn something round (a person or the ship), then press the button to check */
function turnTask(o){
  return new Promise(res=>{
    if(o.say)say(o.say);untoast();
    const step=o.step||90;let ang=norm(o.start);o.set(ang);
    tray(`<div class="row turnrow"><button class="btn ghost" id="tl" aria-label="Turn left">${TURNL}<span>Turn</span></button><button class="btn ghost" id="tr" aria-label="Turn right"><span>Turn</span>${TURNR}</button></div><p class="inst" style="margin:8px 0 0">Or drag round on the picture.</p><div class="row" style="margin-top:10px"><button class="btn" id="tgo">${o.btn||'This way!'}</button></div>`);
    const q=ask(o);setHelp(o.help,q,o.helpExtra);
    let active=true,locked=false;
    const setTo=a=>{a=norm(a);if(a===ang)return;ang=a;o.set(ang);untoast();};
    $('#tl').onclick=()=>{if(active)setTo(ang+step);};
    $('#tr').onclick=()=>{if(active)setTo(ang-step);};
    const svg=$('#sw>svg'),hit=(o.hit&&$(o.hit))||svg;
    hit.style.touchAction='none';
    let on=false,last=null,acc=0,ang0=0;
    const angAt=e=>{const p=svgPoint(svg,e);return p?Math.atan2(-(p.y-o.cy),p.x-o.cx)/D2R:null;};
    hit.addEventListener('pointerdown',e=>{if(!active)return;on=true;last=angAt(e);acc=0;ang0=ang;try{hit.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
    hit.addEventListener('pointermove',e=>{if(!on||!active)return;const a=angAt(e);if(a==null||last==null)return;let d=a-last;if(d>180)d-=360;if(d<-180)d+=360;last=a;acc+=d;setTo(ang0+Math.round(acc/step)*step);});
    const up=()=>{on=false;};hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
    $('#tgo').onclick=async()=>{
      if(locked||!active)return;
      if(o.isRight(ang)){locked=true;active=false;hit.style.touchAction='';q.done();setHelp(null);$$('#tray button').forEach(b=>b.disabled=true);if(o.onRight)await o.onRight(ang);await yes(o.yes,o.ms);stepDone();res(ang);}
      else{q.miss(o.name?o.name(ang):String(ang));toast('hmm',o.why(ang));}
    };
  });
}

function spinTask(){
  return new Promise(res=>{
    const words={night:'Night for Hale. His side faces away from the candle.',rise:'Sunrise for Hale! He is turning into the light.',am:'Morning for Hale. The Sun climbs.',noon:'Noon for Hale. The Sun is highest.',pm:'Afternoon for Hale. The Sun goes lower.',set:'Sunset for Hale. He is turning away from the light.'};
    tray(`<div class="readout2"><b id="spw">${words.night}</b></div><div class="row" style="margin-top:10px"><button class="btn ghost" id="spinme">Spin it for me</button></div>`);
    setHelp(['Put your finger on the globe. Drag it round the way the gold arrow points.','Watch Hale’s little sky in the corner as he turns into the light.','Or tap “Spin it for me”.']);
    const r=runId,start=-150;let th=start,last=null,fin=false,region='night',warned=false;
    const regionOf=a=>{a=thN(a);if(Math.abs(a)>100)return 'night';if(a<-80)return 'rise';if(a<-12)return 'am';if(a<=12)return 'noon';if(a<80)return 'pm';return 'set';};
    const set=v=>{th=v;setGlobe(th);const g=regionOf(th);if(g!==region){region=g;$('#spw').textContent=words[g];}
      if(!fin&&th-start>=360){fin=true;setTimeout(()=>{if(runId===r){dr.off();setHelp(null);res();}},1800);}
      if(!warned&&th<start-25){warned=true;toast('hmm','The real Earth only spins one way. Follow the gold arrow!',2800);}};
    const svg=$('#gt');
    const dr=dragOn($('#gt-hit'),svg,(p,first)=>{const a=Math.atan2(-(p.y-GT.cy),p.x-GT.cx)/D2R;if(first||last==null){last=a;return;}let d=a-last;if(d>180)d-=360;if(d<-180)d+=360;last=a;set(th+d);},()=>{last=null;});
    $('#spinme').onclick=async()=>{$('#spinme').disabled=true;const from=th;await tween(7500,k=>set(from+(start+380-from)*k));};
    set(start);
  });
}

async function trickRound(o){

  const why=a=>{
    if(sameDir(a,o.phi))return `She is looking at the Sun. Turn her so her ${H} points at it.`;
    if(sameDir(a+180,o.phi))return 'The Sun is behind her. Keep turning.';
    return o.mode==='R'?'That’s her left hand (L) pointing at the Sun. Turn her right round.':'That’s her right hand (R) pointing at the Sun. Turn her right round.';

    say:o.mode==='R'?(o.n===1?'Turn the girl until her right hand (R) points at the sunrise.':'A new morning. Turn her so her right hand (R) points at the sunrise.'):'Evening! Hale sees the sunset. Turn her so her LEFT hand (L) points at it.',
    start,step:90,cx:IS.cx,cy:IS.cy,hit:'#isl',
    set:a=>{$('#is-fig').innerHTML=figSVG(a,o.mode);},
    isRight:a=>sameDir(a,need),

    help:o.mode==='R'?['Right hand to the sunrise.','Find the R. Turn her until the R points at the Sun.','Look: when she faces this way, the R points at the Sun.']:['Left hand to the sunset.','Find the L. Turn her until the L points at the Sun.','Look: when she faces this way, the L points at the Sun.'],
    helpExtra:n=>{if(n===2)$('#is-x').innerHTML=figSVG(need,o.mode,true,true);},
    onRight:a=>{$('#is-x').innerHTML='';$('#is-fig').innerHTML=figSVG(a,o.mode,true);$('#is-lbl').innerHTML=isLetter(a,'N');},
    yes:'She is facing north!',ms:1800});

    await card({ribbon:'True fact',title:'The top half of the world',pic:englandSVG(),ps:['England is in the top half of the world.','There, the noon Sun is in the south.','So in England, noon shadows point north.'],go:'Go on'});
    await pics({item:'shadow-england',concept:'Noon shadows point north in the Northern Hemisphere',area:'HSS',say:'Captain Hale is home in England. It is noon. Which way does his shadow point?',
      options:[{v:'n',label:'north',pic:ARROWPIC(90,'N')},{v:'s',label:'south',pic:ARROWPIC(270,'S')},{v:'e',label:'east',pic:ARROWPIC(0,'E')}],answer:'n',easyWrong:'s',
      help:['In England, the noon Sun is in the south.','Shadows point away from the Sun.','The Sun is in the south, so the shadow points north.'],
      miss:v=>v==='s'?'That’s how it is here at home. England is in the other half of the world. Try again.':'At noon the shadow doesn’t point east. Try again.',
      yes:'Yes! In England, noon shadows point north.',ms:1900});
    await pics({item:'shadow-seasons',concept:'The hemispheres have opposite seasons',area:'SC',say:'One more! It is December. We have summer here. What season is Hale having in England?',
      options:[{v:'w',label:'winter',pic:SEASON.winter},{v:'su',label:'summer',pic:SEASON.summer},{v:'sp',label:'spring',pic:SEASON.spring}],answer:'w',easyWrong:'su',
      help:['The two halves of the world have opposite seasons.','What is the opposite of summer?','Winter.'],
      miss:v=>v==='su'?'When we have summer, the top half of the world has the opposite. Try again.':'Spring is an in-between season. Think of the opposite of summer. Try again.',
      yes:'Yes! It is winter in England. Hale might see snow at Christmas.',ms:2200});
    finishPart(3);
    afterPart(3,'Shadows point away from the Sun. Here, a noon shadow points south, so north is the other way.');
  })();
}

/* ===== Part 5: steer for home ===== */
const CLUE={
  rise:{say:'The Sun is coming up over the sea. Turn the ship to point north.',hint:'Right hand to the sunrise, and you face north.',help:['Right hand to the sunrise.','The Sun is in the east. North is a quarter turn round from it.','Look: the dotted arrow shows north.']},
  amsh:{say:'The Sun is too bright to look at, so use the mast’s shadow. Turn the ship to point north.',hint:'In the morning, the Sun is on the other side from the shadow, in the east.',help:['Shadows point away from the Sun.','It is morning, so the Sun is in the east and the shadow points west. Right hand to the east…','Look: the dotted arrow shows north.']},
  noonsh:{say:'Noon. Use the mast’s shadow. Turn the ship to point north.',hint:'At noon here, the shadow points south. North is the other way.',help:['At noon here, shadows point south.','North is the opposite way to the shadow.','Look: the dotted arrow shows north.']},
  set:{say:'The Sun is going down. Turn the ship to point north.',hint:'Left hand to the sunset, and you face north.',help:['Left hand to the sunset.','The Sun is in the west. North is a quarter turn round from it.','Look: the dotted arrow shows north.']},
  pmsh:{say:'Use the mast’s evening shadow. Turn the ship to point north.',hint:'In the evening, the Sun is on the other side from the shadow, in the west.',help:['Shadows point away from the Sun.','It is evening, so the Sun is in the west and the shadow points east. Left hand to the west…','Look: the dotted arrow shows north.']}
};
const seaEdge=a=>PT(SEA.cx,SEA.cy,258,a,138);
function drawClue(clue,rho){
  $('#sea-sun').innerHTML='';setA('#sea-sh','d','');
  const sunAt=(a,w)=>{const [x,y]=seaEdge(a);const [lx,ly]=PT(SEA.cx,SEA.cy,200,a,104);$('#sea-sun').innerHTML=SUNG(x,y,24,true)+`<text x="${f1(lx)}" y="${f1(ly+6)}" text-anchor="middle" font-size="19" font-weight="700" fill="#fff" stroke="#0f2438" stroke-width="5" paint-order="stroke">${w}</text>`;};
  const shadow=(a,len)=>{setA('#sea-sh','d',shadowD(SEA.cx,SEA.cy,a,len,22));};
  if(clue==='rise')sunAt(rho-90,'sunrise');
  if(clue==='set')sunAt(rho+90,'sunset');
  if(clue==='amsh')shadow(rho+90,150);
  if(clue==='pmsh')shadow(rho-90,150);
  if(clue==='noonsh')shadow(rho+180,48);
}
async function voyageLeg(i,leg){
  const rho=pick([0,90,180,270]);
  $('#sea-ghost').innerHTML='';$('#sea-sun').innerHTML='';setA('#sea-sh','d','');
  $('#sea-clock').innerHTML=clockBadge(leg.when);
  let clue=leg.opts[0].v;
  if(leg.opts.length>1){say(`${leg.when}. How will you find north? You choose.`);clue=await choose(leg.opts);}
  drawClue(clue,rho);
  const steps=S.easy?[0,90,180,270]:[0,45,90,135,180,225,270,315];
  const start=pick(steps.filter(a=>!sameDir(a,rho)));
  const nameOf=a=>NAMES8[norm(Math.round((rho-a)/45)*45)];
  await turnTask({item:`voyage-${i+1}-${clue}`,concept:'Finding north from the Sun',area:'HSS',
    say:CLUE[clue].say,start,step:S.easy?90:45,cx:SEA.cx,cy:SEA.cy,hit:'#sea-hit',btn:'Sail this way!',
    set:a=>{$('#sea-ship').innerHTML=shipG(a);},
    isRight:a=>sameDir(a,rho),name:nameOf,
    why:a=>`That way is ${nameOf(a)}. ${CLUE[clue].hint}`,
    help:CLUE[clue].help,
    helpExtra:n=>{if(n===2){const [x,y]=PT(SEA.cx,SEA.cy,150,rho,130);$('#sea-ghost').innerHTML=`<path d="M${SEA.cx} ${SEA.cy}L${f1(x)} ${f1(y)}" stroke="#f2c75c" stroke-width="6" stroke-dasharray="10 7" marker-end="url(#sea-ar)"/><text x="${f1(PT(SEA.cx,SEA.cy,175,rho,150)[0])}" y="${f1(PT(SEA.cx,SEA.cy,175,rho,150)[1]+6)}" text-anchor="middle" font-size="18" font-weight="700" fill="#fff" stroke="#0f2438" stroke-width="4" paint-order="stroke">north</text>`;}},
    onRight:()=>{$('#sea-ghost').innerHTML='';},
    yes:['Full sail, north!','Still heading north!','North again! Nearly home.'][i],ms:1500});
  const dx=-Math.cos(rho*D2R)*110,dy=Math.sin(rho*D2R)*110;
  await tween(1800,k=>setA('#sea-w','transform',`translate(${f1(dx*k)} ${f1(dy*k)})`));
  setA('#sea-w','transform','');
}
function partVoyage(){
  stage({title:'Steer for home',steps:3,scene:seaSVG(),say:'Captain Hale must sail north, home to Mistress Wren.'});
  (async()=>{
    $('#sea-ship').innerHTML=shipG(90);
    await sleep(1800);
    const legs=[
      {when:'Morning',opts:[{v:'rise',label:'Look at the sunrise',pic:PIC.sky(0.02)},{v:'amsh',label:'Look at the mast’s shadow',pic:PIC.mast(180)}]},
      {when:'Noon',opts:[{v:'noonsh'}]},
      {when:'Evening',opts:[{v:'set',label:'Look at the sunset',pic:PIC.sky(0.98)},{v:'pmsh',label:'Look at the mast’s shadow',pic:PIC.mast(0)}]}
    ];
    for(let i=0;i<legs.length;i++)await voyageLeg(i,legs[i]);
    $('#sea-sun').innerHTML='';setA('#sea-sh','d','');$('#sea-clock').innerHTML='';
    $('#sea-hb').innerHTML=harbourTop();
    say('Land ho! There is the harbour, and Mistress Wren!');
    tray('');
    await tween(2200,k=>{$('#sea-ship').innerHTML=`<g transform="translate(0 ${f1(-8*k)})">${shipG(90)}</g>`;});
    await sleep(1800);
    await card({ribbon:'Home!',title:'A new compass',pic:compassPic(),ps:['Mistress Wren has a new compass for Captain Hale.','Its needle points north, the way you steered!'],go:'Hooray!'});
    ending();
  })();
}

  {k:'tell',pic:TI.mum,t:'Tell Mum two ways to find north',s:'with no compass at all'},

function ending(){
  runId++;toTop();
  finishPart(4);
  G.finish();
  pips(-1);
  main.innerHTML=`<section class="panel"><div class="phead"><h2>Home, safe and sound!</h2></div>
    <div class="letterpaper"><p>Dear Apprentice,</p><p>Thank you! With no compass at all, you found north using only the Sun.</p><p>Nutmeg says sorry.</p><p class="sig">Captain Hale</p></div>
    <h3 class="bigq">Now, off you go!</h3>
    <p class="inst">Tap each box when you’ve done it.</p>
    <ol class="todo">${TODO.map(x=>`<li class="${x.k==='tell'?'mum':''}"><button data-k="${x.k}" aria-pressed="${S.ticks.includes(x.k)?'true':'false'}">${x.pic}<span>${x.t}${x.s?`<small>${x.s}</small>`:''}</span><span class="box2"></span></button></li>`).join('')}</ol>
    <div class="wbox"><label for="wr">If you like: write one way to find north</label><small>One sentence is plenty. Mum can write it for you.</small><textarea id="wr" maxlength="400"></textarea></div>
    <p id="alldone" style="text-align:center;font-weight:700;font-size:1.25rem;margin:12px 0 0" hidden>All done! Purr. Well steered, Apprentice.</p>
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="go">Back to the contents</button></div></section>`;
  const upd=()=>{$('#alldone').hidden=!(TODO.every(x=>S.ticks.includes(x.k)));};
  $$('.todo button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const i=S.ticks.indexOf(k);if(i<0)S.ticks.push(k);else S.ticks.splice(i,1);save();b.setAttribute('aria-pressed',i<0?'true':'false');upd();});
  const wr=$('#wr');wr.value=S.write||'';
  wr.addEventListener('input',()=>{S.write=wr.value;save();G.write({prompt:'One way to find north',text:wr.value,area:'HSS'});});
  upd();
  $('#go').onclick=home;
}

/* ---------- contents ---------- */
function home(){
  runId++;cur=-1;pips(-1);toTop();
  main.innerHTML=`<section class="panel"><div class="hero"><div class="sw" style="margin:0">${heroSVG()}</div><div>
      <div class="bubble" style="margin:0 0 8px"><span class="who">${NUTMEG}</span><p>Oops. It’s Nutmeg. I did a bad thing.</p></div>
      <p>I knocked Captain Hale’s compass into the sea! Now he can’t tell which way is north.</p>
      <p>Can you help him find north, using only the Sun?</p>
      <p class="note">Captain Hale, Mistress Wren and Nutmeg are made up. Everything about the Sun is true.</p></div></div>
    <div class="parts">${PARTS.map((p,i)=>{const ok=unlocked(i),d=done(p.id),nx=ok&&!d;
      return `<button class="panel part ${nx?'next':''}" data-i="${i}" ${ok?'':'disabled'}>${TILEPIC[p.id]}<h3>${i+1}. ${p.name}</h3><span class="tag">${d?'Done ✓':ok?'Ready':'Locked'}</span></button>`;}).join('')}</div></section>`;
  $$('.part').forEach(b=>b.onclick=()=>{if(!b.disabled)runPart(+b.dataset.i);});
}

/* ---------- grown-up controls ---------- */
function setEasy(){$('#easy').setAttribute('aria-pressed',S.easy?'true':'false');}
$('#easy').onclick=()=>{S.easy=!S.easy;save();setEasy();if(cur>=0)runPart(cur);};
$('#home').onclick=home;
let armed=false;
$('#reset').onclick=()=>{
  if(!armed){armed=true;$('#reset').textContent='Tap again to start again';setTimeout(()=>{armed=false;$('#reset').textContent='Start again';},4000);return;}
  armed=false;$('#reset').textContent='Start again';const e=S.easy;S=blank();S.easy=e;save();home();
};
setEasy();home();
